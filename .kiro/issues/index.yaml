    frontend/user-portal/src/api/processForm.ts
    backend/user-portal/src/main/java/com/portal/dto/ProcessFormData.java
  fix_summary: |
    1) `showProcessFormPanel` 由从未赋值的 `ref(false)` 改为 `computed(() => !!processFormData.value && processFormEditable.value)` — Return_To_Requester editable 场景自动激活，completed snapshot 仍交由 TaskSnapshotSection（避免重复）。
    2) 新增 `processFormSubTableBindings / processFormFormConfig / processFormNativeSubTableBindingIds` refs；在 `loadProcessAndTaskFormData` 内通过新增的 `buildProcessFormSubTableBindings(pfData)` 把后端 `ProcessFormData.subTableBindings` 与 `configJson.subForms / subTablePortalViews` 合并出 portal binding（含 portalViews / formFields / primaryKeyFields）；pfData 缺失时同步清零。
    3) Process Form `<FormRenderer>` 补齐 `:sub-table-bindings / :linked-sub-table-bindings / :native-sub-table-binding-ids / :form-config`，`view-context="initiatorRequest"`（发起人重新编辑视角，与 My Request 同语义），并暴露 `update:sub-table-data` 回填到本地 binding。
    构建 & 验证：`npm run build` 通过、docker compose rebuild `user-portal-frontend` 启动 nginx 16 workers 无错；`user-portal` Spring Boot 9.131s 启动后 Kafka/MVC 正常。
  note: |
    场景：发起人在 Process Form 提交流程后，审批人退回（processState='Return_To_Requester'），发起人重新打开 To Do 详情；
    设计器 Process Form 内含 sub-table（Process Form 是绑定到 startEvent 的 form，contentType=FORM/PROCESS_FORM）。
    后端 `ProcessFormData` DTO 明确含 `subTableBindings: List<SubTableBindingData>` 字段（getProcessFormData API），但 portal 端：
      1) **`tasks/detail.vue:1993` `showProcessFormPanel = ref(false)` 全文从未被赋值** —— 即使 `processFormData / processFormEditable / processFormCollapse` 都被 `loadProcessAndTaskFormData` 正确填充，模板 `v-if="showProcessFormPanel && processFormData"` 永远 false。Return_To_Requester 时，发起人只能看到主任务表单（taskForm），而 Process Form 面板压根渲染不出来，无法编辑/查看原始 Process Form。
      2) 即使把死开关激活，模板 line 223-232 的 `<FormRenderer>` 仅传 `:fields / :tabs / :model-value / :label-width / :readonly / :primary-read-only`，**未传** `:sub-table-bindings / :linked-sub-table-bindings / :view-context / :form-config / :native-sub-table-binding-ids`。
      3) `parseProcessFormConfig`（line 2931-2962）只用 `extractFieldsRecursive` 把 rule → fields/tabs，**未消费** `pfData.subTableBindings`，相关 binding 数据/字段定义/portalViews 全部被丢弃。子表 widget 的占位 (`type:'subTable', _bindingId:N`) 会进入 `processFormFields`，但 FormRenderer 内 `bindingMap` 为空 → `resolveBinding(child._bindingId)` 返回 undefined → 子表静默不渲染。
    与 portal-design-parity.mdc 冲突：设计器 Form Preview 渲染 Process Form 子表正常，门户 Return_To_Requester 路径完全断流。
    复现：在设计器为某个 FU 的 Process Form 拖入一个 sub-table 绑定 → 部署 → 发起一次申请 → 审批人退回 → 发起人 To Do 进入详情。预期：可看到 Process Form 面板 + 子表 + 可编辑；实测：Process Form 面板根本不显示。
    修复方向（待实施）：
