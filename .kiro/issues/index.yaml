    丢弃 form-create validate[]；DW Preview 精简 mapper 也缺 uppercase/ip/phone/正负数等；
    自定义 validator 未在弹窗 materialize。
    修复：Portal mapFormCreateValidateToElementPlusRules + dialog materialize；
    DW mapDesignerValidateForDialog 对齐 Validation+ 全部内置模式（validator 走 form-create Preview）。
    验证：subFormDialogValidationModes 20/20（17 模式 fixture+pass/fail）、
    mapDesignerValidateForDialog 19/19；rebuild 两端 frontend。
