      - FormRenderer 调用补齐：`:sub-table-bindings="processFormSubTableBindings"`、`:linked-sub-table-bindings="processFormLinkableSubTableBindings"`、`:view-context="isReturnToRequester ? 'assigneeTodo' : 'initiatorRequest'"`（编辑态当作 assigneeTodo 走 form-below-table；只读态以 initiatorRequest 显示）、`:form-config="pfData.configJson"`、并补 `:native-sub-table-binding-ids`。
      - 同步在 `applications/detail.vue` 校验是否需要同样独立的 Process Form 面板（当前 My Request 只渲染单一 form，行为不同；如未来引入需保持同构）。
    爆炸半径：仅前端 portal 视图层 + 一个新的 ref/解析函数，无 API/DTO 变更；与 #1392 的死代码清理同性质（先发现、单独立条）。

- id: "1394"
  status: fixed
  fixed_at: "2026-05-26"
  severity: major
  category: bug
  summary: "user-portal FORM_POPUP action 弹出的设计表单使用 useCustomActions.parseFormPopupConfig + convertFormCreateRuleSimple 简化转换器（非 extractFieldsRecursive），且 FormPopupDialog 不向 FormRenderer 传任何 sub-table bindings/formConfig；含 subTable/card/lookup/嵌套 tabs/Link Form 的设计稿在 popup 中静默退化为普通输入或丢失"
  file: |
    frontend/user-portal/src/composables/tasks/useCustomActions.ts
    frontend/user-portal/src/components/tasks/FormPopupDialog.vue
    frontend/user-portal/src/views/tasks/detail.vue
  fix_summary: |
    1) 删除 `parseFormPopupConfig` + `convertFormCreateRuleSimple`；`openFormPopup` 改为通过新增的 host callback `resolveFormPopupContent`（优先读 `cachedContentForms`，保留完整 tableBindings + sourceId；缺失时回退 `processApi.getFunctionUnitContent` 全量 FU 内容）+ `preparePopupContext` 装配上下文。
    2) `tasks/detail.vue` 在 useCustomActions 选项里注入 `preparePopupContext`：复用主任务表同一套 `extractFieldsRecursive / deriveColumnsFromBinding / resolveSubFormDesign / resolveSubTablePrimaryKeyFields / mergeLinkFormTargetBindingsInto`，把 popup 目标 form 解析成与主 form 同构的 `fields / tabs / subTableBindings / nativeSubTableBindingIds / formConfig`（含 subTablePortalViews & Link Form target merge）。无 preparer 时直接返回错误，杜绝旧简化路径回滚。
    3) `FormPopupDialog.vue` 新增 props `subTableBindings / linkedSubTableBindings / nativeSubTableBindingIds / formConfig / viewContext` 并透传给内部 `<FormRenderer>`；新增 `update:subTableData` emit；`useCustomActions` 暴露 `handleFormPopupSubTableUpdate` 用于本地回填 popup 子表行。
    4) `useCustomActions` 新增 state refs `formPopupSubTableBindings / formPopupLinkedSubTableBindings / formPopupNativeSubTableBindingIds / formPopupFormConfig / formPopupViewContext`，在 popup 关闭/重新打开时正确重置；目前 `submitFormPopup` 仍是 TODO 桩（未来上线 ACTION form 提交端点时再补 subTableData 上送）。
    构建 & 验证：`npm run build` 通过；docker compose rebuild `user-portal-frontend` 启动 nginx 无错；container `platform-user-portal-frontend-dev` healthy。
  note: |
    场景：设计器 Action Designer 配置 actionType=FORM_POPUP + formId=某 ACTION form；该 form 在设计器画布上包含 subTable / card / tabs / lookup / Link Form 列；处办人在 To Do 详情点击该 action 按钮，期望弹窗与设计器 Form Preview 一致。
    实测：弹窗仅渲染顶层普通字段；任何 subTable/card/嵌套布局/lookup backfill 元数据全部丢失。
    根因：
      1) `useCustomActions.parseFormPopupConfig`（lines 180-200）**未使用** `extractFieldsRecursive` —— 仅顶层 `rules.forEach`，识别 `el-tabs`+其顶层 `children.map(convertFormCreateRuleSimple)`；非 tabs 时直接 `rules.map(convertFormCreateRuleSimple)`。子 card 容器的 `children` 完全不递归。
      2) `convertFormCreateRuleSimple`（lines 202-213）是一个 1:1 浅拷贝（`type: rule.type || 'input'`，无 subTable/_bindingId/portalViews 处理，无 lookup `_lookupTableId/_lookupConfig/_lookupViewFields` 等 underscore-prefixed 元数据），与 `formRendererHelpers.extractFieldsRecursive` + `extractLookupFieldMetadata` 的契约差异巨大。subTable 节点 → 进入但 `_bindingId` 丢失；card → 进入但 `children` 丢失；lookup → 进入但 lookup 配置全没。
      3) `FormPopupDialog.vue`（lines 1-39）`<FormRenderer>` 仅接 `:fields / :tabs / :model-value / :label-width / :readonly`，**没有** `subTableBindings / linkedSubTableBindings / viewContext / formConfig / nativeSubTableBindingIds` props 也没有对应 prop 类型 → 即使转换器修好，FormRenderer 内 `resolveBinding` 永远 undefined。
    与 portal-design-parity.mdc 冲突：Form Preview 弹窗（设计页面 canonical 渲染）与 FORM_POPUP runtime 弹窗结构性分叉；后者是一个独立的"简化渲染器"，直接违反「禁止 Portal 写简化渲染器且与 Designer rule 不一致」红线。
    修复方向（待实施）：
      - useCustomActions.parseFormPopupConfig 替换为 `parseFormConfigToTabs(configJson)` + `extractFieldsRecursive(rules)`（与主任务 form 同构）。删除 `convertFormCreateRuleSimple`。
      - FormPopupDialog 新增 props `subTableBindings`, `linkedSubTableBindings`, `viewContext`, `formConfig`, `nativeSubTableBindingIds`，透传给内部 `<FormRenderer>`；调用方 tasks/detail.vue 在 openFormPopup 时按 FORM_POPUP 目标 form 的 contentForms 解析 tableBindings + configJson 装配 bindings（复用 applications/detail.vue `buildSubTableBindingsForForm` 模式），把弹窗当成"另一份完整的 task form"对待。
      - 弹窗默认 viewContext='assigneeTodo'（FORM_POPUP 仍是处办人操作场景）；提交逻辑 `submitFormPopup` 当前是 TODO 空桩（line 218），需要补 subTableData 上送逻辑（与主 form 同样的 TaskFormSubmitRequest 结构）。
    爆炸半径：前端 portal 视图层 + 一个 composable + 一个 dialog 组件；测试覆盖：现存 `__tests__/ActionDesignerN8n.test.ts` 不覆盖 popup 渲染，需要补属性测试断言 popup fields/subTables 与 extractFieldsRecursive 一致。

- id: "1395"
  status: fixed
  fixed_at: "2026-05-26"
  severity: minor
  category: bug
  summary: "user-portal tasks/detail.vue 流程图节点 snapshot 视图与 applications/detail.vue 同源视图不同构 — NodeFormInfo 缺 formConfig / nativeSubTableBindingIds，FormRenderer 调用未传 :form-config / :native-sub-table-binding-ids 且非当前节点强制 :linked-sub-table-bindings=undefined；view-context 硬编码 assigneeTodo（vs My Request 同位置用 initiatorRequest）"
  file: |
    frontend/user-portal/src/views/tasks/detail.vue
    frontend/user-portal/src/views/applications/detail.vue
  fix_summary: |
    1) `NodeFormInfo` 扩展 `formConfig: Record<string, any>` 与 `nativeSubTableBindingIds: number[]`；在 `loadFunctionUnitContent` 内构建 `newMap` 前把 `cfg`（formConfig）和 `nodeNativeIds`（pre-Link-Form-merge 的非 PRIMARY binding 集合）从 try 局部 hoist 出来一起写入。`refreshNodeFormMapFromFormData` 走 `{...info, ...overrides}` 自动透传新字段，`applyCompletedSnapshotToForm` 原地 mutate 同样保留。
    2) 新增 `mainFormConfig / mainFormNativeSubTableBindingIds` refs，在 `loadFunctionUnitContent` 解析主任务 form 时同步赋值，与 `applications/detail.vue` 同名概念对齐。
    3) selected-node `<FormRenderer>` 补 `:native-sub-table-binding-ids / :form-config`，并将 `:linked-sub-table-bindings` 非当前节点 fallback 从 `undefined` 改为 `selectedNodeForm.subTableBindings`（snapshot 自身已含 Link Form merge 后的全量 binding），使 SubTableField 的 Link Form 弹窗可正常解析；当前节点仍使用 `linkableSubTableBindings`。
    4) 主任务 `<FormRenderer>` 补 `:native-sub-table-binding-ids="mainFormNativeSubTableBindingIds"` 与 `:form-config="mainFormConfig"`，与 selected-node 路径同构。view-context 保留 `assigneeTodo`（tasks/detail.vue 始终是 assignee 视角；与 applications/detail.vue 的 initiatorRequest 是不同语义场景）。
    构建 & 验证：`npm run build` 通过、`docker compose rebuild user-portal-frontend` healthy；`ReadLints` 全清。
  note: |
    场景：To Do / Completed 任务详情，BPMN 流程图右侧点击其它节点 → tasks/detail.vue 显示该节点 form snapshot（line 164-182 `<FormRenderer>`）；
    My Request 同样路径在 applications/detail.vue line 168-190 渲染。
    差异：
      | 维度 | tasks/detail.vue 流程图节点 snapshot | applications/detail.vue 流程图节点 snapshot |
      |---|---|---|
      | NodeFormInfo 形状 | `{ formName, isCurrentTask, fields, tabs, values, subTableBindings }`（line 513-520，**无 formConfig/nativeSubTableBindingIds**） | `ApplicationDiagramNodeFormInfo { ..., nativeSubTableBindingIds, formConfig }`（line 700-712） |
      | :linked-sub-table-bindings | `selectedNodeForm.isCurrentTask ? linkableSubTableBindings : undefined` —— 非当前节点强制 undefined | `diagramSelectedLinkableBindings`（computed，始终聚合所有可达 bindings） |
      | :form-config | 未传 | 传 `selectedNodeForm.isCurrentStep ? mainFormConfig : selectedNodeForm.formConfig` |
      | :native-sub-table-binding-ids | 未传 | 传 `selectedNodeForm.isCurrentStep ? mainFormNativeSubTableBindingIds : selectedNodeForm.nativeSubTableBindingIds` |
      | view-context | 硬编码 `"assigneeTodo"` | `"initiatorRequest"`（与 My Request 主视图一致） |
    影响：
      1) Completed Task 详情里点击其它节点查看快照时，若该节点 form 含 link-form-only sub-table（只通过 Link Form 列引用、无 canvas placement），由于缺 `:form-config` → `collectLinkFormTargetBindingIdsFromSubListViews` 无法识别 → `shouldRenderPlacedSubTableField` 无法在 initiatorRequest 模式抑制重复 table；又因 viewContext 是 assigneeTodo 所以早 return true 全部渲染——结果与 Form Preview 的"summary+Link Form modal"模式不符。
      2) 非当前节点 `linkedSubTableBindings=undefined` → `linkableSubTableBindings` fallback 到 `props.subTableBindings`（即仅该节点自己的 bindings），跨节点 Link Form 列的 target binding（如 subtable2 通常在 main form 注册）将无法被 SubTableField 弹窗解析，Link Form 弹层为空或报缺失。
      3) viewContext 选择歧义：tasks/detail.vue 流程图节点 snapshot 实际是"非当前 assignee 视角下查看一个非自己负责的节点的历史快照"，与 applications/detail.vue 同视角，应同样用 initiatorRequest 走 portal-display 模式分支（summary+Link Form modal / table-only 等），而不是按"我是该节点 assignee"的 assigneeTodo 全量铺开。
    与 portal-design-parity.mdc 关系：snapshot 节点视图属于「Portal 运行时」的一种，规则要求"Form Preview ↔ Portal Runtime MUST 一致"且"My Request 同位 merge 同语义"；当前 tasks/detail.vue 路径走的是另一套语义。
    修复方向（待实施）：
      1) NodeFormInfo 类型补 `formConfig: Record<string, any>` 和 `nativeSubTableBindingIds: number[]`；在 loadFunctionUnitContent 构建 newMap 时（line 2798-2805）一起填入 `formConfig = matchedForm.contentData JSON / configForSubTables`、`nativeSubTableBindingIds = matchedForm.tableBindings?.filter(b=>b.bindingType!=='PRIMARY').map(b=>b.bindingId)`。
      2) tasks/detail.vue line 164-182 `<FormRenderer>` 补三个 prop：
         `:linked-sub-table-bindings="selectedNodeFormLinkableBindings"` （新增 computed，参考 applications/detail.vue `diagramSelectedLinkableBindings`）
         `:form-config="selectedNodeForm.isCurrentTask ? mainFormConfig : selectedNodeForm.formConfig"`
         `:native-sub-table-binding-ids="selectedNodeForm.isCurrentTask ? mainFormNativeSubTableBindingIds : selectedNodeForm.nativeSubTableBindingIds"`
      3) view-context 根据 isCurrentTask 切换：`:view-context="selectedNodeForm.isCurrentTask ? 'assigneeTodo' : 'initiatorRequest'"`（与 applications/detail.vue 节点 snapshot 同语义；当前 task 仍 assigneeTodo）。
      4) 配套：tasks/detail.vue 同步引入 mainFormConfig + mainFormNativeSubTableBindingIds refs（applications/detail.vue 已有同名概念）；loadFunctionUnitContent 与 parseFormConfig 路径需在解析 task form 时把 `configJson + nativeSubTableBindingIds` 暴露给主表 FormRenderer 也使用（当前主表 FormRenderer line 269-287 也未传这两项，但 viewContext 是 assigneeTodo 早 return true，目前未触发问题；同时建议补齐以保险）。
    爆炸半径：tasks/detail.vue 局部 + 一个 computed，无契约变更；与 applications/detail.vue 同名概念对齐。建议与 #1392 之后的 portal-design-parity 巩固工作打包一轮再修复。

- id: "1397"
  status: fixed
  severity: critical
  category: bug
  summary: "user-portal TaskFormComponent.mergeCompletedTaskSnapshotIntoVariables 在 stage 无 Task Form 绑定时把全部流程变量（含先前 _snapshot_* + alias 化的 __subTables__）写进新快照，导致 up_process_instance.variables JSON 列指数级膨胀，多实例 / 重复完成场景下触发 Hibernate UPDATE 时 PostgreSQL SimpleParameterList.getV3Length → String.encodeUTF8 OutOfMemoryError"
  fixed_at: "2026-05-26"
  detail: |
    现象：portal 任务详情 `tasks/{taskId}` 上点击自定义按钮（如 “u”）的弹窗 confirm 时，user-portal 报
    `jakarta.servlet.ServletException: Handler dispatch failed: java.lang.OutOfMemoryError: Java heap space`，
    根因栈（user-portal 容器日志）：
      Caused by: java.lang.OutOfMemoryError: Java heap space
        at java.base/java.lang.String.encodeUTF8_UTF16(...)
        at org.postgresql.core.v3.SimpleParameterList.getV3Length(SimpleParameterList.java:517)
        at org.postgresql.core.v3.QueryExecutorImpl.sendBind(...)
        at org.hibernate.engine.jdbc.mutation.internal.AbstractMutationExecutor.performNonBatchedMutation(...)
        at org.hibernate.persister.entity.mutation.UpdateCoordinatorStandard.doDynamicUpdate(...)
    触发链路：
      handleApproval → processInstanceRepository.save(syncInstance)
      → Hibernate flush → UPDATE up_process_instance SET variables = ?::jsonb
      → PostgreSQL 把 Java String 编码为 UTF-8 字节流时，单个参数已经接近 / 超过当前可用堆 → OOM。
    根因：`TaskFormComponent.mergeCompletedTaskSnapshotIntoVariables(...)` 在 fetchTaskFormByStageId 返回 null
    （即该 stage 没有 Task Form 绑定，比如 “Multi-Instance Subtask Demo” 的 `Activity_134mqyl` 子任务，
    日志：“No Task Form binding found for stage 'Activity_134mqyl', falling back to Process Form”）时，
    fieldPermissions 退化为 `Collections.emptyMap()`，进而调用
    `extractFieldSubset(mergedVariables, Set.of())`，后者在 fieldNames 为空时按"向后兼容"语义返回
    **全部** allVariables 的拷贝（含此前所有 `_snapshot_*` 顶层键），最终把这份"复印件"作为 fieldValues
    塞进新快照 `_snapshot_{taskId}`。每完成一个子任务，新快照都包含此前所有快照的副本 → variables JSON
    呈指数级膨胀。
    实测验证：流程 `4f255db5-58c0-11f1-8ffb-ee8fa17d896c` 在 5 次子任务完成后，单条记录 variables 列已达
    10.4 MB；其中 5 个 `_snapshot_*` 顶层键的 size 序列为 1102 → 5281 → 769481 → 3004000 → 5222329 字节，
    几何爆炸。下一次 UPDATE 时 PostgreSQL 把整段 JSON 串编码到字节数组就足以耗尽默认堆。
    修复（最小改动）：`backend/user-portal/.../TaskFormComponent.java`
      Map<String, Object> fieldValues = fieldPermissions.isEmpty()
              ? new HashMap<>()
              : extractFieldSubset(mergedVariables, fieldPermissions.keySet());
      // __subTables__ 仍在下一行按需附带；但不再把 allVariables 全部复印进新快照。
    无 Task Form 绑定时只保留 `__subTables__`（如有），不再回退为「全量拷贝」；不修改 `extractFieldSubset`
    本身的语义，规避 getTaskFormData / getCompletedTaskFormData 等读路径回归风险。
    测试更新：`TaskFormSnapshotPropertyTest` 增加严格断言——无 Task Form 绑定时，快照 fieldValues 只允许
    包含 `__subTables__`，不得携带任何普通顶层字段，防止回归。
    一次性数据修复：对该流程实例（仅）执行 `UPDATE up_process_instance SET variables = (SELECT
    jsonb_object_agg(key, value) FROM jsonb_each(variables) WHERE key NOT LIKE '_snapshot_%')` 后，
    variables 字节数从 10444524 降回 1442071（剩余主要是合法 `__subTables__`）。其它历史膨胀实例
    （e7f3b4b7、92511447、a6df7a42、583de12c）保留待用户决定，不做主动批量裁剪。
    爆炸半径：仅 user-portal；workflow-engine 不受影响。
    构建：mvn -pl backend/user-portal -am package -DskipTests，docker compose -f docker-compose.dev.yml up
    -d --build user-portal。容器重建后启动正常，OOM 不再复现。

    回归分析（同一根因，第二轮收敛）：
    用户在另一条流程（task `876bdd85-58c9-11f1-bdfc-524b562953e5`，stage `Activity_134mqyl` "sub form2"，
    pid `e94e447e-58c8-11f1-bdfc-524b562953e5`）上点击 “u” 弹窗 confirm 时仍触发 OOM。dw_form_stage_bindings
    中确认该 stage 仍无 Task Form 绑定，fieldPermissions 仍为空，但快照路径里 `__subTables__` 被无条件附加，
    而 `__subTables__` 本身已被前端 `useTaskActions.ts` 用多重 alias（bindingId、String(bindingId)、tableName、
    normalizeSubTableName(tableName)）展开成 4–5 份重复副本（实测 root `participants` 同一份 211 KB 数据存在
    `69` / `participants` / `subtable` / `subtable a` / `subtable A` 五个 alias 下；嵌套层亦同），单一快照里
    fieldValues={__subTables__} 已可达 2 MB+。多实例子任务依次完成 → 多份 `_snapshot_*` 各自携带一份完整
    alias-bloated `__subTables__` → variables JSON 又突破到 5.9 MB，再次撞到 PostgreSQL UTF-8 编码阶段堆压。
    收敛动作：把 `__subTables__` 的注入移到 `else` 分支（仅 Task Form 绑定存在时才并入），无绑定路径快照恒为
    **空 fieldValues**——既不写顶层字段，也不写 `__subTables__`。下游 `getCompletedTaskFormData` 第 432–437 行
    在 `snapshot.fieldValues` 空时直接返回 `Collections.emptyMap()`，无破坏；属性测试 `TaskFormSnapshotPropertyTest`
    断言由“keys ⊆ {__subTables__}”收紧到 `isEmpty()`。
    一次性数据修复（本轮）：对 e94e447e-58c8-11f1-bdfc-524b562953e5、92511447-5849-…、e7f3b4b7-5837-…、
    a6df7a42-5844-… 执行同一 `_snapshot_*` 剪枝 SQL，分别从 5.9/6.6/6.5/1.75 MB 降回 1.45/3.06/2.58/0.13 MB。
    遗留改进点（已在 issue radar 跟踪，未在本条 fix 内：见后续条目）：
      1) 前端 `useTaskActions.ts` 在 `__subTables__` 下重复写入同一份 binding.data 四五次（alias 化），
         即使没有快照路径也会让 up_process_instance.variables 比理论大 4–5 倍。建议改为单一 canonical key
         （bindingId），由后端在读时做 tableName/alias resolve，而不是写入时膨胀。→ 见 #1398
      2) 后端 `mergeSubTablesFromTaskInfoForMi` 等合并逻辑只"补缺失 alias"而从不去重，导致 alias 集合
         单调增长。→ 见 #1399

- id: "1398"
  status: open
  severity: major
  category: performance
  summary: "user-portal frontend useTaskActions.ts 把同一份 sub-table data 以 4–5 个别名 key（bindingId / String(bindingId) / tableName / normalizeSubTableName(tableName)）重复写进 __subTables__ → up_process_instance.variables JSONB 列体积膨胀 4–5 倍，并放大快照路径的 OOM 风险（详见 #1397 回归分析）"
  detail: |
    现象：portal `__subTables__` 中同一 binding 的 row 数组以多个 key 同时存在，且每个 key 携带的 JSON 内容
    bytes 完全相同（实测：root participants 在 `69` / `participants` / `subtable` / `subtable a` / `subtable A`
    五个 key 下均为 211917 字节；root subtable2 在 `30` / `subtable2` / `subtable2 a` / `subtable2 A` 四个 key 下
    均为 63933 字节）。嵌套子表（participants[0].__subTables__）同样存在 12 个别名 key 全部指向同一份 ~205 KB
    数据的现象。
    根因：`frontend/user-portal/src/composables/tasks/useTaskActions.ts` 在 submitApprove 构造 variables 时写：
        for (const b of options.subTableBindings.value) {
            mergedSub[b.bindingId] = b.data
            mergedSub[String(b.bindingId)] = b.data
            if (b.tableName) {
                mergedSub[b.tableName] = b.data
                mergedSub[normalizeSubTableName(b.tableName)] = b.data
            }
        }
    JSON 序列化时不会做对象引用 dedupe，每个 key 都会落成一份独立的 JSON 子树写入数据库。
    爆炸半径：所有走 Portal 任务完成路径的 sub-table 数据；JSONB 体积 ≈ 真实数据 × alias 数。
    建议修复：选择 bindingId（数字）作为唯一 canonical key 写入，让后端在读侧（`SubTableInlineForm.vue` /
    `FormRenderer.vue` / `subTableAddDialogHelpers.ts` 等）通过元数据回退（resolveSubTableSchemaByTableId）做
    table-name → bindingId 的 alias resolve。
    与 portal-design-parity.mdc 的关系：写入侧 alias 化是历史遗留兼容层；移除后必须确认设计器预览
    （FormDesigner Preview）与 Portal Runtime 仍能解析两侧的 binding，否则 parity 会断。建议在统一 helper
    中做"写入侧单一 key、读侧 alias resolve"的过渡，先加 telemetry 观察兼容性，再清除冗余别名写入。

- id: "1399"
  status: open
  severity: major
  category: performance
  summary: "user-portal backend TaskProcessComponent.mergeSubTablesFromTaskInfoForMi / 相关 __subTables__ 合并逻辑只'补缺失 alias'但从不去重，alias 集合单调增长，加剧 #1398 描述的 JSONB 膨胀"
  detail: |
    现象：handleApproval 路径里 mergeSubTablesFromTaskInfoForMi 把任务返回的 __subTables__ 合并进
    processInstance.variables 时使用 `if (!merged.containsKey(k)) merged.put(k, e.getValue())` 逻辑——
    既不覆盖已有同名 key，也从不识别 "binding-id ↔ table-name ↔ normalized-name" 之间的等价关系。
    一旦某个 alias 进入存储就永远保留，后续任何完成动作只会"加新别名 / 不去重"，使 alias 集合单调增长。
    与 #1398 联动：前端每次完成都把同一份数据以 4–5 个 alias 提交，后端合并器逐步把更多 alias 累加进
    存储；多实例子任务循环若干轮后，__subTables__ 自身就能达到 MB 级（即使不算 _snapshot_）。
    建议修复：在合并前先 resolve alias 等价类（用 TableBinding 元数据：bindingId 为主 key，tableName /
    normalizedName 作为派生 alias 仅供读侧解析），合并时只写 canonical key；读侧若仍需 alias resolve，
    在 helper 层用 metadata fallback 实现，而非把 alias 落到 JSONB。
    爆炸半径：所有触发 mergeSubTablesFromTaskInfoForMi 的子任务完成路径；与 #1398 同根，宜一并设计。
