- id: "1423"
  status: fixed
  fixed_at: "2026-06-04"
  severity: major
  category: bug
  summary: "表单设计器「显示已隐藏」开关无法露出 Hidden 控件"
  detail: |
    根因：(1) 表单设计器曾出现两个 Hide 开关，且自定义的 Basis `field: hidden` 会设置规则级 `hidden`，
    令画布字段内容塌缩（非期望的「角标」效果）；(2) 打开 Show hidden 时仅去掉 Hermes concealed 类，
    未隐藏 form-create 的 `._fd-drag-hidden` 遮罩层，字段仍被盖住无法编辑。
    最终方案：唯一 Hide 控件 = form-create 原生顶部开关（props.hide → 规则级 `_hidden`，仅显示角标不塌缩内容）；
    通过 hiddenItemConfig 隐藏会塌缩内容的内置 Basic `hidden`；删除中间方案 designerPropsPanelRules（baseRule prepend）；
    `.fc-designer-show-hidden` 下隐藏 `._fd-drag-hidden` overlay 并强制显示 drag-tool / 取消 concealed。
    路径：FormDesigner.vue、main.ts、formDesignerCanvasChrome.test.ts。
- id: "1424"
  status: fixed
  fixed_at: "2026-06-08"
  severity: major
  category: bug
  summary: "表单设计器设置的校验（required / 长度 len 等）在 User Portal 运行时不生效"
  detail: |
    根因（运行时真 bug）：User Portal 的 convertFormCreateRule 仅从 rule.validate[].required 取必填，
    丢弃了 form-create 的 $required 标志以及 len/pattern 等 validate 条目，导致 configJson 里的校验在门户静默丢失。
    修复：新增 user-portal/src/utils/formCreateValidateRules.ts —— isFormCreateRuleRequired（读 $required 或 validate[].required）
    + mapFormCreateValidateToElementPlusRules（剥离 form-create 专用键 mode/adapter，保留 len/min/max/pattern + trigger/message，
    必要时前置 required），applyFormCreateValidationToFormField 写入 FormField.required + FormField.rules；
    FormRenderer.vue 的 formRules 优先消费 field.rules；processes/start.vue、tasks/detail.vue、applications/detail.vue
    的 convertFormCreateRule / extractFieldsRecursive 改用上述工具。
    关于 Preview：form-create 运行时（设计器原生 Preview 与 FormPreviewItems）通过内置 required 插件处理 $required、
    并将 validate（__$validate）合并进 el-form-item.rules，本就原生校验；故回退上一轮误判（以为 $required 不触发校验）
    而往 validate[] 注入 {required:true} 的设计器侧改动——该注入被 Validate.vue parseValue 规整为 {mode:'required'} 多余规则行，
    且 mutate 了 designer 实时规则并被持久化。删除 developer-workstation 侧 formCreateValidateRules.ts 注入工具及调用点。
    formCreatePreviewEvents.ts 的 bindDomOnEvent 改为链式调用既有 on[event]（保留 form-create/EP 的 blur 校验）。
    重建并部署 developer-workstation-frontend、user-portal-frontend。
    路径：user-portal/{utils/formCreateValidateRules.ts, components/FormRenderer.vue, views/processes/start.vue,
    views/tasks/detail.vue, views/applications/detail.vue}；developer-workstation/{components/designer/FormDesigner.vue,
    utils/formCreatePreviewEvents.ts}。
- id: "1425"
  status: fixed
  fixed_at: "2026-06-10"
  severity: major
  category: bug
  summary: "表单设计器自定义 validator 在 Preview 生效、User Portal 不生效"
  detail: |
    根因：设计器将 validator 存为 FORM-CREATE-PREFIX 字符串；form-create Preview 原生解析执行，
    但 user-portal 的 convertFormCreateDesignerValidateEntry 仅在 typeof validator === 'function' 时保留规则，
    JSON 反序列化后字符串 validator 被丢弃，跨字段校验（如 b>a 且 b>c）在门户静默失效。
    修复：formCreateEventRuntime 新增 parseFormCreateValidator / bindFormCreateValidatorForElementPlus（解析字符串并绑定 this.api）；
    formCreateValidateRules 对 validator 存 __formCreateValidatorSource 延迟标记，FormRenderer.formRules 调用
    materializeFormCreateValidationRules 在运行时注入 api.getValue。单测覆盖 b>a&&b>c 场景。
    路径：user-portal/{utils/formCreateEventRuntime.ts, utils/formCreateValidateRules.ts, components/FormRenderer.vue}。
    补充（2026-06-10）：adapter:true 与三参 validator(rule,value,callback) 冲突导致误报 — detectValidatorArity 优先按参数个数
    判定签名；callback 桥接为 Element Plus Error 对象。
