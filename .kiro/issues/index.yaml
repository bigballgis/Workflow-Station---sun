- id: "1430"
  status: fixed
  fixed_at: "2026-06-04"
  severity: major
  category: performance
  summary: "Portal To Do 多实例子任务详情加载慢（MI enrich + 历史 N+1 + 前端阻塞 history）"
  detail: |
    根因（Docker [PERF] 2026-06-04，task f422fb7e，22 个 MI 实例）：
    1) GET /tasks/{id} ~647ms：enrichSubTables 冷路径 ~397ms（getMultiInstanceStatus ~185ms）；
    2) GET /tasks/{id}/history ~774ms：workflow-engine 对每条 activity 单独 admin-center getUserInfo（N+1）；
    3) 前端 loadTaskDetail 在 finally 前 await historyPromise，MI 表单 hydrate 完成后仍被 history 阻塞 skeleton；
    4) 历史请求经 taskId 路径多一次 engine getTaskInfo。
    早前另有加载期 100+ 次 PK allocate 风暴（已 2026-06-03 修：seedMiParticipantScopedBindingForeignKeys 仅 save/complete allocate）。
    修复（2026-06-04）：
    - workflow-engine TaskController：流程历史按 distinct userId 批量 resolve 显示名；
    - user-portal：history 支持 processInstanceId 查询参数，跳过冗余 getTaskInfo；
    - ProcessComponent：getMultiInstanceStatus 5s TTL 缓存（与 enrich 缓存配套）；
    - tasks/detail.vue：FU 与 form prefetch 并行、history 后台加载不阻塞 loading=false；
    已重建 workflow-engine、user-portal、user-portal-frontend。
