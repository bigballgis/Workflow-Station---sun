- id: "1464"
  status: fixed
  fixed_at: "2026-06-30"
  severity: major
  category: bug
  summary: "Portal 启动含 Send Email 节点流程失败：No catching boundary event found for errorCode 'EMAIL_CONFIG_INVALID'"
  file: "backend/user-portal/src/main/java/com/portal/component/ProcessStartComponent.java"
  note: |
    症状：User Portal 发起 MCY 流程报 400 BAD_REQUEST：Failed to start process instance: No catching boundary event
    found for error with errorCode 'EMAIL_CONFIG_INVALID', neither in same process nor in parent process。
    根因：Send Email 节点（Start 后第一个节点，同步执行）经 #1462 转为 serviceTask + ${sendEmailTaskDelegate}。
    SendEmailTaskDelegate.resolveFunctionUnitId 依赖流程变量 functionUnitId/functionUnitCode，但 ProcessStartComponent.startProcess
    只放入 formData + initiator + workspace context，从未注入 functionUnitId/Code → 解析为空 → throw BpmnError("EMAIL_CONFIG_INVALID")。
    该节点无 boundary error event，BpmnError 向上传播未被捕获 → Flowable 终止整个流程启动事务，门户收到 400。
    修复：startProcess 注入 variables.put("functionUnitId", pin.catalogId()) 与 functionUnitCode = pin.code()
    （pin.catalogId() 即 admin-center FU 实体 id，邮件连接 syncConnections/getCredentials 即以此为键）。
    避免类似错误（pattern）：同步 serviceTask/delegate 抛 BpmnError 而流程无对应 boundary error event 时，会以
    "No catching boundary event found for errorCode 'XXX'" 终止整个启动/办理事务，错误信息对用户极不友好。
    新增依赖流程变量的 delegate 时：(1) 必须确认启动/办理入口已注入所需变量；(2) 技术/配置类失败应优先抛常规异常或
    记录失败并继续，BpmnError 仅用于设计师可挂 boundary 捕获的业务错误。
