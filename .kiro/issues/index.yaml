    elCard 内 subtable A B binding 64），导致 subTableBindings 被过滤掉；新增 collectPlacedSubTableBindingIds 递归 walk card/row/col/collapse
    并包含 fieldsAfterTabs；start.vue / applications/detail.vue 同步使用。
