- id: "1398"
  status: fixed
  fixed_at: "2026-05-27"
  severity: major
  category: performance
  summary: "user-portal frontend useTaskActions.ts 把同一份 sub-table data 以 4–5 个别名 key（bindingId / String(bindingId) / tableName / normalizeSubTableName(tableName)）重复写进 __subTables__ → up_process_instance.variables JSONB 列体积膨胀 4–5 倍，并放大快照路径的 OOM 风险（详见 #1397 回归分析）"
  detail: |
    现象：portal `__subTables__` 中同一 binding 的 row 数组以多个 key 同时存在，且每个 key 携带的 JSON 内容
    bytes 完全相同（实测：root participants 在 `69` / `participants` / `subtable` / `subtable a` / `subtable A`
    五个 key 下均为 211917 字节；root subtable2 在 `30` / `subtable2` / `subtable2 a` / `subtable2 A` 四个 key 下
    均为 63933 字节）。嵌套子表（participants[0].__subTables__）同样存在 12 个别名 key 全部指向同一份 ~205 KB
    数据的现象。
    根因：`frontend/user-portal/src/composables/tasks/useTaskActions.ts` 在 submitApprove 构造 variables 时写：
        for (const b of options.subTableBindings.value) {
            mergedSub[b.bindingId] = b.data
            mergedSub[String(b.bindingId)] = b.data
            if (b.tableName) {
                mergedSub[b.tableName] = b.data
                mergedSub[normalizeSubTableName(b.tableName)] = b.data
            }
        }
    JSON 序列化时不会做对象引用 dedupe，每个 key 都会落成一份独立的 JSON 子树写入数据库。
    爆炸半径：所有走 Portal 任务完成路径的 sub-table 数据；JSONB 体积 ≈ 真实数据 × alias 数。
    建议修复：选择 bindingId（数字）作为唯一 canonical key 写入，让后端在读侧（`SubTableInlineForm.vue` /
    `FormRenderer.vue` / `subTableAddDialogHelpers.ts` 等）通过元数据回退（resolveSubTableSchemaByTableId）做
    table-name → bindingId 的 alias resolve。
    与 portal-design-parity.mdc 的关系：写入侧 alias 化是历史遗留兼容层；移除后必须确认设计器预览
    （FormDesigner Preview）与 Portal Runtime 仍能解析两侧的 binding，否则 parity 会断。建议在统一 helper
    中做"写入侧单一 key、读侧 alias resolve"的过渡，先加 telemetry 观察兼容性，再清除冗余别名写入。
    
    已落地实现：`frontend/user-portal/src/composables/tasks/useTaskActions.ts` 的 submitApprove 构造 variables 时，
    `__subTables__` 改为 canonical 仅写 bindingId key；当存在数字 key 时会先清理历史别名 key，再按 bindingId 覆写当前
    `subTableBindings` 数据，不再写 `tableName` / `normalizeSubTableName(tableName)` / `participants` 别名键。
- id: "1399"
  status: fixed
  fixed_at: "2026-05-27"
  severity: major
  category: performance
  summary: "user-portal backend TaskProcessComponent.mergeSubTablesFromTaskInfoForMi / 相关 __subTables__ 合并逻辑只'补缺失 alias'但从不去重，alias 集合单调增长，加剧 #1398 描述的 JSONB 膨胀"
  detail: |
    现象：handleApproval 路径里 mergeSubTablesFromTaskInfoForMi 把任务返回的 __subTables__ 合并进
    processInstance.variables 时使用 `if (!merged.containsKey(k)) merged.put(k, e.getValue())` 逻辑——
    既不覆盖已有同名 key，也从不识别 "binding-id ↔ table-name ↔ normalized-name" 之间的等价关系。
    一旦某个 alias 进入存储就永远保留，后续任何完成动作只会"加新别名 / 不去重"，使 alias 集合单调增长。
    与 #1398 联动：前端每次完成都把同一份数据以 4–5 个 alias 提交，后端合并器逐步把更多 alias 累加进
    存储；多实例子任务循环若干轮后，__subTables__ 自身就能达到 MB 级（即使不算 _snapshot_）。
    建议修复：在合并前先 resolve alias 等价类（用 TableBinding 元数据：bindingId 为主 key，tableName /
    normalizedName 作为派生 alias 仅供读侧解析），合并时只写 canonical key；读侧若仍需 alias resolve，
    在 helper 层用 metadata fallback 实现，而非把 alias 落到 JSONB。

    已落地实现：在 `backend/user-portal/.../TaskProcessComponent.mergeSubTablesFromTaskInfoForMi` 合并完成后，
    若同一层级存在数字 key（bindingId），则仅保留数字 key，并递归清理行内 nested `__subTables__` 的非数字别名 key，
    从根源阻断 alias 集合单调增长。
    爆炸半径：所有触发 mergeSubTablesFromTaskInfoForMi 的子任务完成路径；与 #1398 同根，宜一并设计。
- id: "1400"
  status: fixed
  fixed_at: "2026-05-27"
  severity: major
  category: bug
  summary: "user-portal My Request 画布已放置的 sub-table 因同时是 Link Form 目标被 filterLinkOnlyStandaloneSubTableFields 误删（mirrorTodo + tableOnly）"
  detail: |
    根因：shouldSuppressStandaloneSubTableInInitiatorRequest 对 native tableBindings 中的 binding 若出现在
    collectAllLinkFormTargetBindingIds（含 subListViews 自引用 linkForm 列）且 initiatorRequest 为 mirrorTodo，
    仍按 mirrorTodo !== tableOnly 判定 suppress，导致 applyLinkOnlySubTableFieldFilterToMainForm 从 formFields
    移除画布 subTable 节点（Transaction Assignment binding 281 等）。
    修复：nativeBindingIds 命中时直接 return false，画布放置优先于 link-only 去重逻辑。
    路径：formRendererHelpers.ts + linkOnlySubTableFields.test.ts。
