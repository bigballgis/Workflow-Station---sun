    2) backfillMiLinkChildPrimaryKeysFromVariables 把当前参与者 UUID 回填到 foreign 占位行 → PK 碰撞 → collapse 再次污染 id_idw。
    3) buildSubTableSubmitPayload 合并 formData.__subTables__ 快照时，快照内 stale id_idw 被 re-introduce（merge 不传播删除）。
    4) flattenNestedSubTableRowsIntoPayload 以 nested 为 incoming 合并到顶层 slice → 旧 userTask collection 行内 nested
       （age=5）覆盖当前任务已 persist 的顶层 slice（age=88）；flat 快照被污染。
    5) hydrateMiLinkChildBindingsFromFullSnapshot 经 collectSubTableSliceRowsForRelationTableId 收集同 tableId 全部 sibling
       slice（如 binding 63 age=5 与 binding 30 age=88）；collapse 同分时后写入者赢 → binding.data 仍为 stale。
    6) 历史污染：当前参与者行（id=UUID, sub_task_id=Test-000071）泄漏到 foreign 参与者 Test-000073 的 nested slice，
       与 (4)(5) 叠加放大 reload 回显错误。
