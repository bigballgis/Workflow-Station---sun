- id: "1375"
  status: fixed
  fixed_at: "2026-05-25"
  severity: major
  category: bug
  summary: "user-portal 申请详情页在 cookie 登录态下未向 workflow-engine 转发 access_token，导致 Current Step/Assignee 为空"
  file: "backend/user-portal/src/main/java/com/portal/client/WorkflowEngineClient.java; backend/user-portal/src/test/java/com/portal/client/WorkflowEngineClientTest.java"
