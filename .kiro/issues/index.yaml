- id: "180"
  status: fixed
  fixed_at: "2026-05-19"
  severity: major
  category: performance
  summary: "user-portal 我的申请详情首屏过慢：loading 直至 FU 全量处理（历史步骤 buildPreviousFormEntry×N、全 BPMN 遍历、跨节点子表 align、lookup、流程图）才结束"
  file: "frontend/user-portal/src/views/applications/detail.vue; frontend/user-portal/src/utils/bpmnParseCache.ts; backend/user-portal/src/main/java/com/portal/component/ProcessComponent.java"
  note: |
    现象：发起人（如 e2e_sunqiang）打开 My Request 详情长时间白屏/骨架，主表单与子表迟迟不可交互。
    根因：loadProcessDetail 中 loading 与 loadFunctionUnitContent 串行重计算绑定——Promise.all(历史, FU) 后仍同步执行 previousForms 循环、alignProcessSubTableBindingsBySharedTable、nodeFormMap、BPMN 多遍解析与 lookup；首屏无必要工作阻塞 paint。
  修复（2026-05-19，无功能语义变更）：
    1) 两阶段加载：primary 仅当前表单 parseFormConfig + 子表 hydrate + alignMainSubTableBindingsOnly，随后 loading=false；
    2) secondary（requestIdleCallback）：await 流程历史 → lookup → previousForms/MI 识别/全量 align → nodeFormMap → 流程图；
    3) 流程历史不再与 FU 并行阻塞首屏；快照 Completed Tasks 的 assignee 过滤移至 secondary 末尾。
    若首屏仍慢：profile getProcessDetail（RUNNING+__subTables__ 时 resolveMiRowProgress/getMultiInstanceStatus）与 getFunctionUnitContent 接口耗时。

