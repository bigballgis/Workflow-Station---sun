    - detail.vue：seedMiParticipantScopedBindingForeignKeys 分离 foreign 占位行，仅对当前参与者 seed/allocate/collapse；
      hydrateMiLinkChildBindingsFromFullSnapshot 在 collapse 后以当前 binding 的 ownSlice merge 覆盖 stale sibling。
    验证：MI 回归单元 104 passed（vitest.mi-regression.config.ts）；Playwright 调试脚本 frontend/scripts/_cap-e921.mjs
    （persisted after save 正确；hydrate 修复合入后须 rebuild user-portal-frontend 再跑 FORM after reload 断言）。
