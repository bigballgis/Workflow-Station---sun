- id: "142"
  status: fixed
  fixed_at: "2026-04-03"
  severity: major
  category: architecture
  summary: "功能单元版本回滚（废弃某已部署版本）：按钉死版本删除该版本下全部流程数据（含已结束实例），因渲染依赖功能单元配置、版本不存在则业务数据无保留必要；主要场景为 live test / UAT test"
  description: |
    产品决策（方案 B，已确认）：
    - 当某功能单元语义版本在 admin 侧被回滚/废弃后，清理所有「发起时钉死到该版本」的流程与附属数据，**包括 RUNNING 与 COMPLETED**。
    - 理由：列表/详情渲染依赖功能单元与表单等配置；该版本目录与内容已不存在时，残留实例与任务无法一致展示，无业务保留必要。
    - 适用范围声明：**主要发生在 live test、UAT test**；生产若启用需配套强审计与二次确认（另议）。
    已实现（2026-04-03）：
    - up_process_instance 钉死 function_unit_catalog_id / code / version_label；门户 startProcess 走 GET .../active-for-start 并与 resolve 结果校验。
    - workflow-engine POST .../instances/{id}/purge；门户 internal purge-by-catalog + 删 up_change_history / up_process_history / up_process_instance。
    - admin GET .../code/{code}/active-for-start、启用校验（仅 DEPLOYED 中最高 semver）、POST .../{id}/purge-runtime-data；配置 PORTAL_INTERNAL_API_TOKEN / USER_PORTAL_BASE_URL。
    待加强：专用审计日志、其它 up_* 附属表若后续挂流程实例需纳入 purge。
  file: "backend/admin-center; backend/user-portal; backend/workflow-engine-core"

