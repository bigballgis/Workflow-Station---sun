- id: "1390"
  status: fixed
  fixed_at: "2026-05-25"
  severity: major
  category: bug
  summary: "User Portal 子表行内联表单 / Link Form 弹窗 / SubTaskForm 中，lookup 字段（如 sys_users 类型 assignee）的对象值被渲染成 `[object Object]`，且回填视图（LookupViewDisplay backfill panel）不显示 —— FieldRenderer.vue 缺少 `lookup` 分支，落入默认 `<el-input>` 兜底；同时未携带 `_lookupShowBackfillView` 与 `LookupViewDisplay` 渲染契约。与 1387/1388 互补（1387 修了 SubTableField 单元格内 lookup tag、1388 修了 My Requests 列表的 currentAssignee，本条修内联行表单 / Link Form 弹窗 / SubTaskForm 走 FieldRenderer 的 lookup 渲染路径）"
  file: |
    frontend/user-portal/src/components/FieldRenderer.vue
    frontend/user-portal/src/views/tasks/detail.vue
    frontend/user-portal/src/views/applications/detail.vue
  note: |
    复现：以 `e2e_lina` 登入 User Portal → To Do 打开 Multi-Instance Subtask Demo `sub form1` 待办，画布上 `subtable A`（binding 69，portalViews.assigneeTodo=`formBelowTable`）下方的内联行表单中：`id=45`、`name=45` 正常显示，但 `assignee` 字段渲染为 `[object Object]`；即使前一步修好显示，回填视图（LookupViewDisplay 多字段列表）也不出现 —— 而 `lookupConfig.showBackfillView=true` 已在 Designer 里开启。Completed Tasks 详情页（同样路由到 `/tasks/{id}` → `tasks/detail.vue`）存在同样问题。
    根因：
      1) `applications/detail.vue` / `tasks/detail.vue` 的 `extractFieldsRecursive` 在遇到 `type === 'lookup'` 字段时，会解析 `props.lookupConfig` 并在 FormField 上写入 `_lookupTableId`、`_lookupSearchFields`、`_lookupDisplayField`、`_lookupDisplayFields`、`_lookupSelectedDisplayField`、`_lookupFilterConditions`、`_lookupViewFields`，但**没有携带 `_lookupShowBackfillView`** —— Backfill 标志只在 `convertFormCreateRule` 路径（主表单顶层字段）下挂到 `passProps.showBackfillView` 上，子表行 / 内联子表单 / Link Form 弹窗使用的是 `extractFieldsRecursive` 输出，于是 Backfill 元数据丢失。
      2) `FormRenderer.vue` 主模板在顶层显式有 `v-else-if="field.type === 'lookup'"` 分支，直接渲染 `<LookupField>` + `<LookupViewDisplay>`，并维护 `lookupSelectedData` / `lookupLoadedViewFields` 这两个本地状态。
      3) 但 `PortalFormFields.vue`（子表行内联表单、Link Form 弹窗）与 `SubTaskForm.vue`（MI 子任务）都将"非 subTable / 非 card"字段统一交给 `FieldRenderer.vue` 渲染，而 `FieldRenderer.vue` 历史上**没有** `lookup` 模板分支 —— 落到 `<template v-else>` 默认 `<el-input :model-value="modelValue">` 上。
      4) 流程引擎写回 `__subTables__["66"][i].assignee` 时保留了完整 LinkedHashMap（`{id, email, username, full_name, display_name, ...}`），前端拿到的就是一个 JS Object；当它被 `<el-input>` 的 `:model-value` 接收，Element Plus 内部走 `value = String(modelValue)`，于是显示 `[object Object]`。
    与上游冲突合并：
      origin 上同时落地的 1387/1388 在 `FieldRenderer.vue` 已加入基础 `lookup` 分支（含 `:lookup-config` 透传到 `LookupField`，由 1387 引入的 `getLookupSelectedDisplayFieldFromProps` 消费），但 LookupViewDisplay 仅在 `_lookupViewFields?.length && lookupSelectedRow` 时显示、且 `lookupSelectedRow` 仅在 `@select` 触发时更新 —— 已保存 Map 值（`__subTables__` 中的 assignee 对象）首次打开页面不会触发 `@select`，回填面板仍不显示；同时 `_lookupShowBackfillView` 未携带，无法尊重 `showBackfillView=false`。
    修复（叠加在 1387/1388 之上）：
      1) `extractFieldsRecursive`（`tasks/detail.vue`、`applications/detail.vue`）在生成 lookup FormField 时新增 `_lookupShowBackfillView: lookupCfg.showBackfillView !== false`。
      2) `FieldRenderer.vue` 在保留上游 lookup 分支结构（含 `:lookup-config` 透传、`Number(_lookupTableId||0)` 防御）基础上：
         - 引入本地 `lookupLoadedViewFields` + `effectiveLookupViewFields` 计算属性（优先 `_lookupViewFields`，否则回退到 LookupField 通过 `@view-fields-loaded` 自动加载的列表）。
         - `LookupViewDisplay` 的 `v-if` 改为 `lookupShowBackfillView && lookupSelectedRow`，`view-fields` 改为 `effectiveLookupViewFields`。
         - 新增 `watch(modelValue, immediate: true, deep: true)`：当 `modelValue` 为对象（来自 `__subTables__` 持久化的完整 row Map）时直接作为 `lookupSelectedRow`；为 `null`/`''` 时清空 —— 保证首次进入页面、未触发 `@select` 时回填视图也能显示。
         - `@select` / `@clear` / `@view-fields-loaded` 都走具名 handler `onLookupSelect` / `onLookupClear` / `onLookupViewFieldsLoaded`，便于将来扩展。
      3) 该修复同时一并覆盖 `PortalFormFields`（子表行内联表单 / Link Form 弹窗）与 `SubTaskForm`（MI 子任务）内的 lookup 字段。
    验证：
      - `npm run -s test -- --run src/components/__tests__/fieldRenderer.property.test.ts src/components/__tests__/fieldRendererUserSearch.property.test.ts` 全部通过（16 tests）。
      - `npm run build` 成功；ReadLints 对 FieldRenderer.vue / tasks/detail.vue / applications/detail.vue 无新增告警。
      - 重建 `user-portal-frontend` 容器并刷新浏览器后，`subtable A` 行内联表单的 assignee 字段显示为按 `selectedDisplayField` 的可读文本（如 username 或 full_name），下方按 sys_users `viewFields`（id / username / display_name / full_name / email / employee_id / status / language）渲染回填视图；Completed Tasks 详情同步修复。

- id: "1391"
  status: fixed
  fixed_at: "2026-05-26"
  severity: major
  category: deploy
  summary: "Developer Workstation Table Binding Manager 点击 Add 报 `duplicate key value violates unique constraint \"dw_form_table_bindings_pkey\"`：17-Multi-Instance-Subtask-Demo/00-init-kk.sql 用显式 id 灌入 dw_* 与 rt_* 数据但未推进 BIGSERIAL，JPA `GenerationType.IDENTITY` 取到的下一个序列值远低于已存在的最大 id，凡是该 FU 范围内的新增（dw_form_table_bindings / dw_table_definitions / dw_field_definitions / dw_action_definitions / dw_form_definitions / dw_sub_table_view_configs / dw_sub_table_view_fields / dw_table_relations / dw_process_definitions / rt_field_definitions / rt_table_versions）都会主键冲突"
  file: |
    deploy/init-scripts/90-post-seed/00-align-id-sequences.sql;
    deploy/init-scripts/90-post-seed/README.md;
    deploy/init-scripts/00-init-all.sh
  note: |
    复现：登入 Developer Workstation 打开「Multi-Instance Subtask Demo」→ Form Design → Manage Table Bindings → Add Binding（Binding Type=Sub Table、Select Table=Cat、Foreign Key=id）→ 点 Add。后端报 `org.postgresql.util.PSQLException: ERROR: duplicate key value violates unique constraint "dw_form_table_bindings_pkey"`。
    范围确认：这不是单一 binding 路径的问题，而是 17-Multi-Instance-Subtask-Demo 这一份 seed 把 12 张表的序列都拉漂了。container 首启后实测漂移：
      dw_form_table_bindings   30 vs 104   (本次报错入口)
      dw_table_definitions     14 vs  74
      dw_field_definitions     186 vs 186  (恰好对齐，但属偶然——02-add-subtask-progress-fields.sql 之后用不带 id 的 INSERT 把序列推到了 186)
      dw_action_definitions    36 vs  49
      dw_form_definitions      11 vs  18
      dw_function_units         3 vs   5
      dw_process_definitions    4 vs   6
      dw_sub_table_view_configs 1 vs   7
      dw_sub_table_view_fields  7 vs  37
      dw_table_relations       (未抓但 seed id 用到 36/37/38)
      rt_field_definitions      1 vs   6
      rt_table_definitions      1 vs   1 (临界)
      rt_table_versions         1 vs   1 (临界)
    任何走 JPA `GenerationType.IDENTITY` 的新增（在 Designer 加表/字段/Action/子表视图/Form、在 Admin Center 给 Relation Table 加字段或重新部署新版本、流程版本快照、…）都会撞已 seed 的 id 上，不止 binding。
    根因：`deploy/init-scripts/17-Multi-Instance-Subtask-Demo/00-init-kk.sql` 是从真实开发环境一次性导出的 seed (85 条 `INSERT INTO ... (id, ...) VALUES (...)`)，pg `BIGSERIAL` 在显式指定 id 的 INSERT 上**不会**自动推进序列；脚本末尾既没 `setval(...)`，运行时也不会触发 `DeveloperWorkstationSequenceSynchronizer.synchronizeAll()`——后者只在 FunctionUnit clone / Export-Import / Version restore 路径调，不覆盖普通 CRUD。其它 init 脚本 10/12/13/14/15/16 使用不带 id 的 INSERT（让 BIGSERIAL 自然推进），不受影响；grep 验证只有 17 一个目录有 `INSERT INTO (dw|rt|...)_x (id, ...)` 模式。
    修复（两处必须同时改，否则下次 `-Clean` 重建会复现）：
      a) 新增 `deploy/init-scripts/90-post-seed/` 目录及其 `README.md` 说明这一阶段语义。
      b) 在该目录下新增 `00-align-id-sequences.sql`（LF）。脚本是一个匿名 `DO` 块，遍历所有 `public.dw_*` 与 `public.rt_*` 表，调 `pg_get_serial_sequence(quote_ident(table_name), 'id')` 取序列名，`setval(seq, GREATEST(MAX(id), 1))`。脚本本身**不做任何 public schema DDL**——只对既有序列调 `setval`。
      c) 修改 `deploy/init-scripts/00-init-all.sh`，在 `[5d/6] Loading Function Unit Multi-Instance Subtask Demo` 之后新增 `[5e/6] Running post-seed alignment scripts (90-post-seed/)`，按 `00-*.sql` ~ `05-*.sql` 顺序遍历该目录下的脚本。
    为什么把脚本放进新引入的 `90-post-seed/` 目录而不是 `00-schema/` 或 `99-maintenance/`：项目原本只有三类明确分类——
      • `00-schema/` = schema DDL（CREATE/ALTER TABLE），在 [1/6]/[2/6] 阶段跑、跑时表空；
      • `01-admin/`、`08-/15-/16-/17-` = seed 数据（admin 账号/角色/权限、Function Unit 演示数据）；
      • `99-maintenance/` = 按需手动跑的修复（Flowable repair、wipe FU、widen 列等；其中 `00-wipe-all-function-units.sql` 是历史先例被 [4/6] 显式调用）。
    align 脚本属于第四类：「每次 init 必跑、必须在 seed **之后**跑、不做 DDL、不挑 FU」。强行放进前三类都会破坏目录纯度——放 00-schema 是 DDL 语义被污染，放 99-maintenance 是"按需"语义被污染，放 17 是误导未来读者以为只为 17 服务。故新建 `90-post-seed/`（前缀 90- 表示位于 17- seed 包之后、99- maintenance 之前），并补 `README.md` 解释这一阶段语义，给未来新增的 finalize 类脚本留扩展位。
    为什么必须修 `00-init-all.sh`：这个项目的 init 流程是**白名单 loader**——`00-init-all.sh` 显式列出每个要跑的脚本/目录段，没注册的文件不会执行。本次在 sh 中显式加入 `[5e/6]` 步骤遍历 `90-post-seed/0X-*.sql`。17 目录下的 `01-add-save-action.sql` 与 `02-add-subtask-progress-fields.sql` 是历史 patch，内容已并入 00-init-kk.sql 的 export，未被 sh 列入故不执行——与本次修复无关。
    设计选择：
      1) 动态遍历后，将来任何「导出真实库作 seed」的脚本都自动受保护，不用逐表硬编码维护；
      2) 幂等——重复执行没有副作用；
      3) 不修后端：`DeveloperWorkstationSequenceSynchronizer` 已存在的「clone/import/restore 才同步」语义不动；不在每次 CRUD 请求里跑 setval，避免对正常运行时增加 DB 开销。
    验证：
      - 现网执行后再次扫描全部 dw_* / rt_* 序列：无 DRIFT。
      - `nextval('dw_form_table_bindings_id_seq')` 返回 105（>MAX(id)=104）。
      - 现网刷新页面后重新点 Add Binding 不再报 duplicate key（无需重建后端 jar / 容器）。
      - `00-init-all.sh` 新增 [5e/6] 步骤已显式注册 `90-post-seed/0X-*.sql` 遍历；下次 `-Clean` 重新初始化 DB 时会在所有 seed 跑完之后自动对齐所有 dw_*/rt_* 序列，根本解决。
      - 用新路径的脚本对当前 DB 再次执行：`SELECT last_value FROM dw_form_table_bindings_id_seq` = 104，`MAX(id)` = 104，幂等成立。
    边界情况：
      - 17 目录下 `01-add-save-action.sql` 与 `02-add-subtask-progress-fields.sql` 在当前 init 流程中**不会被执行**（白名单未列入），因为其修改内容已被合并进 `00-init-kk.sql` 的 export 数据（id=49 的 SAVE action / task_status / task_current_node 字段在 00 里已硬编码）。本次未删除这两个文件以保留 patch 历史记录，但读者勿误以为它们仍在运行。

- id: "1392"
  status: fixed
  fixed_at: "2026-05-26"
  severity: major
  category: bug
  summary: "user-portal MI 子任务表单：主表（main table / 流程发起表单 / 上游 user task 表单）字段值在多种场景下被静默丢弃，未透传到子任务表单。同时存在第二条死代码渲染管线（SubTaskForm.vue + /tasks/{taskId}/sub-task-form-data + MultiInstanceDataResolver.loadSubTaskFormData）与 portal-design-parity.mdc 总纲冲突，会误导后续维护者"
  file: |
    frontend/user-portal/src/composables/tasks/useBpmnParser.ts
    frontend/user-portal/src/views/tasks/detail.vue
    frontend/user-portal/src/components/SubTaskForm.vue (deleted)
    frontend/user-portal/src/components/__tests__/SubTaskForm.test.ts (deleted)
    frontend/user-portal/src/api/task.ts
    frontend/user-portal/src/components.d.ts
    backend/workflow-engine-core/src/main/java/com/workflow/controller/TaskController.java
    backend/workflow-engine-core/src/main/java/com/workflow/component/MultiInstanceDataResolver.java
    backend/workflow-engine-core/src/test/java/com/workflow/controller/TaskControllerSubTaskFormDataTest.java (deleted)
    backend/workflow-engine-core/src/test/java/com/workflow/component/MultiInstanceDataResolverTest.java
    backend/workflow-engine-core/src/test/java/com/workflow/component/MultiInstanceDataResolverPropertyTest.java
  note: |
    复现：以发起人填写主表单（包含 applicantName/amount/topic 等普通字段 + 子表 participants）→ 流程进入 MI 子流程 → 参与者登录 User Portal 打开 To Do MI 子任务，期望主表字段能在子任务页面体现（顶层同名字段回填、上一步表单只读区展示）。
    实测：仅当下列**全部条件同时满足**时主表字段才完整出现：①主表是 user task 表单（不是 process Start Form）；②MI 子任务子表单字段 key 与主表字段 key 完全同名；③部署 BPMN 在每个上游 user task 上正确挂了 `formId`；④`__subTables__` 在引擎/门户合并过程中没有被旧快照覆盖。任何一条不满足都会静默丢失，无日志、无 UI 提示。
    根因：
      1) `frontend/user-portal/src/composables/tasks/useBpmnParser.ts:parseBpmnXmlAndGetPreviousFormIds` 的 BFS 起点用了 `getElementsByTagName('*')` 顺序里**第一个** `startEvent`，不区分主流程 / 子流程。MI 子流程内部的 `<bpmn:startEvent id="MI_Start_xxx">` 一旦在 XML 顺序上排在主流程 startEvent 之前，BFS 就从 MI 内部开始，主流程上游 userTask 永远遍历不到，`previousForms.value = []`，主表字段在 MI 子任务页面完全不显示。
      2) 同函数没有"父子流程感知"——如果当前 task 位于某个 subProcess 内（MI 子任务的典型情况），BFS 跑到队列空都不会触发 `if (node === currentId) break`，导致主流程上 MI 子流程**之后**的兄弟 userTask 也被误判为 previousForms。
      3) `tasks/detail.vue:isolateMiSubTaskData` 的"同名字段回填"是**唯一**的主表→子任务字段透传机制，但既无设计器侧"字段映射"UI（`SubProcessProperties.vue` / `UserTaskProperties.vue` 只配 collection / elementVariable / assigneeField / rowIdVariable），也无运行时不一致字段告警。命名漂移（`applicant_name` vs `applicantName`）会静默丢值。
      4) `frontend/user-portal/src/components/SubTaskForm.vue` + 前端 `getSubTaskFormData` API + 后端 `TaskController.getSubTaskFormData` + `MultiInstanceDataResolver.loadSubTaskFormData` 形成一条独立的"主表→子任务"渲染管线，但：①生产代码无任何 `<template>` 挂载该组件，仅 components.d.ts 自动声明和单元测试引用；②后端 `getMainFormFields` / `getSubFormFields` 是 TODO 空桩永远返回空 list；③该组件用 `FieldRenderer` 直接渲染顶层字段，与 portal-design-parity.mdc「禁止 Portal 写简化渲染器」直接冲突；④内部仍走 `SELECT * FROM <table>` 物理表读法，与 json-row-storage-no-physical-tables.mdc 反向。
    修复（2026-05-26）：
      1) **主流程感知 + 父子流程感知的 BFS**（useBpmnParser.ts:59-135）：
         - 新增 `parentSubProcOf` 映射：扫描所有 BPMN 元素时记录每个节点最近的祖先 subProcess id。
         - 主流程 startEvent 选取条件改为 `parentSubProcOf.get(id) === null` —— 只从未嵌套在任何 subProcess 内的 startEvent 起 BFS，且支持多个主流程 start（消息 / 信号触发）。
         - 在 BFS 循环中新增 `if (stopSubProcessId && node === stopSubProcessId) break` —— 当前 MI 子任务所属的 subProcess 一旦入队即立刻停 BFS，避免把 MI 之后的兄弟 userTask 误纳入 previousForms。这与 `applications/detail.vue:parseBpmnXmlAndGetAllFormIds` 的 nodes/parentSubProc 模型同构（My Request 路径早已正确处理），现 tasks/detail.vue MI 路径也对齐。
      2) **设计器侧诊断 console.warn**（tasks/detail.vue isolateMiSubTaskData 末尾）：
         - 仅在 `import.meta.env.DEV` 下执行；
         - 找出 `originalFormData` 里有值但既不在当前 MI 子任务 form 字段集合也不在 `previousForms` 字段集合中的「孤立字段」；
         - 输出 `[MI sub-task] Main-form variables present but unreachable ...` 警告 + 字段名列表 + taskId / taskDefinitionKey，便于设计师在浏览器 console 中立刻发现"同名透传遗漏"。
      3) **死代码链清除（按文件列表）**：
         - 删除 `frontend/user-portal/src/components/SubTaskForm.vue`（8.5KB）+ 其单元测试（13KB）+ `components.d.ts` 自动声明行（unplugin-vue-components 会在下次 build 时自动重生成）。
         - 删除 `frontend/user-portal/src/api/task.ts` 中 `FormField` / `SubTaskFormData` 类型和 `getSubTaskFormData()` 函数。
         - 删除 `backend/workflow-engine-core/src/main/java/com/workflow/controller/TaskController.java` 的 `getSubTaskFormData` endpoint。
         - 删除 `backend/workflow-engine-core/src/main/java/com/workflow/component/MultiInstanceDataResolver.java` 的 `loadSubTaskFormData` / `getMainFormFields` / `getSubFormFields` 方法与 `SubTaskFormData` / `FormField` 内部类（保留 `loadMainFormData` 与所有行键 / 行数据 / 乐观锁方法，因 `TaskManagerComponent.completeTask` 仍调用）。
         - 删除对应测试：`TaskControllerSubTaskFormDataTest`、`MultiInstanceDataResolverTest.LoadSubTaskFormDataTests` 内嵌套类、`MultiInstanceDataResolverPropertyTest.property10_dataIsolation` 改写为 `loadSubTableRow` 隔离断言（保留属性意义，去掉对已删除 `SubTaskFormData` 的引用）。
         - **不删 i18n key**：`task.loadingFormData` / `task.mainTaskInfo` / `task.yourTaskInfo` / `task.confirmSubmit` / `task.dataModifiedPleaseRefresh` 等仅在死组件中使用的 key 保留在 zh-CN/zh-TW/en locale 文件，避免任何隐性依赖；`task.noFormData` 仍被 tasks/detail.vue / MiFillDialog.vue / FormPopupDialog.vue 使用。
    爆炸半径 & 兼容性：
      - 修复 1 与 2 完全是 Portal 前端内部，不改任何契约 / DTO / API URL。
      - 修复 3 删除了 `GET /api/v1/tasks/{taskId}/sub-task-form-data`，但该 endpoint 无任何生产前端调用方（grep 验证）、无 Kong 路由依赖，删除安全。
      - `MultiInstanceDataResolver` 公共 API：删除 `loadSubTaskFormData(String)` 与 `SubTaskFormData` / `FormField` 类型符号；其它公共方法 (`loadMainFormData`、`loadSubTableRow`、`subTableExists`、`writeBackSubTableRow`、`isSystemVariable`、`resolveSubTablePhysicalColumnKey`、`tryResolveSubTableRowKey`、`OptimisticLockException`) 保留，`TaskManagerComponent.completeTask` 路径 100% 兼容。
    验证：
      - `mvn -pl backend/workflow-engine-core -am test-compile -DskipTests -q` 通过；接着 `mvn ... package -DskipTests -q` 打包成功。
      - `cd frontend/user-portal && npm run build` 成功（vite build）；`npm run typecheck` 在已修改文件 (useBpmnParser.ts / tasks/detail.vue 的修改区段) 无新增错误，其余类型错误均属 pre-existing（views/processes/start.vue / views/permissions/* 等本次未触碰区域）。
      - `docker compose -f deploy/environments/dev/docker-compose.dev.yml --env-file .env up -d --build workflow-engine user-portal-frontend` 完成；platform-workflow-engine-dev / platform-user-portal-dev / platform-user-portal-frontend-dev 全部 Healthy，actuator/health 返回 `{"status":"UP"}`，前端 3101 返回 200。
      - workflow-engine 启动日志无 ERROR / Exception。
    与 portal-design-parity.mdc 关系：本修复让 `tasks/detail.vue` MI 路径的 BPMN form 解析与 `applications/detail.vue` (My Requests) 路径同构，移除了违反总纲的 SubTaskForm 副管线；Form Preview ↔ Portal Runtime parity 不变。
    后续建议（仍处 open，未与本条合并）：
      - 设计器侧增加"主表字段→MI 子任务字段"显式 mapping UI（产品决策依赖，本轮先用 dev 诊断 console.warn 占位）。
      - `MultiInstanceDataResolver.loadSubTableRow` 物理表 SELECT 路径迁移到 JSON 行存储（与 json-row-storage-no-physical-tables.mdc 对齐）—— 范围超出本轮修复，需后续独立任务。

- id: "1396"
  status: fixed
  fixed_at: "2026-05-26"
  severity: major
  category: bug
  summary: "user-portal `parseBpmnXmlAndGetPreviousFormIds` 仍漏两条 MI 字段透传场景：MI 子任务 → 后续主流程节点（场景 3）以及 MI 子流程内部多 user task 串接（场景 4，sub form1 → sub form2）。Path 1 同名 key + Path 3 共享 tableId 已通过 ProcessInstance.variables 跨 execution 传递（TaskFormComponent.submitTaskForm 写 process scope），但 Path 2 「previous form 只读快照」面板对这两种场景静默空白：BFS 把 MI subProcess 当中转盒子直接跳过、`stopSubProcessId` break 又把同 MI 内的兄弟 inner task 一并截断"
  file: |
    frontend/user-portal/src/composables/tasks/useBpmnParser.ts
    frontend/user-portal/src/composables/tasks/__tests__/useBpmnParserPreviousForms.test.ts
  note: |
    背景：#1392 修好了「主→MI 子任务」（场景 2）的 BFS 主流程感知 + 父子流程感知。但用户进一步要求「无论后面节点是 MI 子任务还是主流程，只要绑定了前面节点的主表/子表字段就要带过来」，这覆盖 4 种组合：
      1) main → main：BFS 已可达，主→主 user task 同名透传 + previous form 面板正常。
      2) main → MI subtask：#1392 已修。
      3) MI subtask → main：⚠️ 之前 BFS 把 MI subProcess 元素当成中转节点（`tasks.has(spId)===false`），仅顺着 sequenceFlow 出边继续，**MI 内部 user task 永远不会被 enqueued**；因此下游主流程 user task 的 previous form 面板看不到 MI 子任务提交的快照（值本身已经在 ProcessInstance.variables 中通过 Path 1 同名 key 透传，只是无法以「上一步表单只读区」呈现）。
      4) intra-MI（MI 子流程内部 sub form1 → sub form2 等多 user task 串接）：⚠️ `stopSubProcessId === parentSubProcOf.get(currentId)` 命中后立即 `break`，BFS 无法越过 subProcess 边界进入内部，**同 MI 内的兄弟内部 user task 永远不被遍历**。
    根因：BFS 唯一种子是主流程的 startEvent，唯一边集是 sequenceFlows；BPMN 主流程到 subProcess 之间的边只连接到 subProcess 元素本身，MI 内部 user task 与主流程之间没有任何 sequenceFlow，必须显式跨边界处理。`stopSubProcessId` 又把 intra-MI 路径连同主流程后兄弟 user task 一起截断（保护正确，但缺补充内部 BFS）。
    修复（2026-05-26）：在 `useBpmnParser.ts:parseBpmnXmlAndGetPreviousFormIds` 内：
      1) 收集 `subProcessElementMap: Map<string, Element>`（id → DOM element），新增 `innerUserTaskIdsOf(spId)` 透传所有 transitive descendants（用 `el.getElementsByTagName('userTask')`，自然支持嵌套 subProcess 与多层 MI）。
      2) 主 BFS 在 dequeue 一个 subProcess 节点（且 ≠ `stopSubProcessId`）时，把它的全部 inner user task 通过新引入的 `recordPrev(id)` 帮手（去重 + 跳过 currentId + 跳过非 task）写入 `orderedPrevTaskIds`，然后继续按现有 sequenceFlow 出边推进。这覆盖场景 3：MI 完成后下游主流程 user task 的 previous form 面板能看到所有参与者的内部 user task 快照。
      3) 当 `stopSubProcessId` 不为空（intra-MI），主 BFS 跑完后追加一次「内部 BFS」：种子集为 `parentSubProcOf(id) === stopSubProcessId` 的 startEvent；按现有 sequenceFlow 出边遍历，遇 `currentId` 立即 break；命中的 inner user task 也通过 `recordPrev` 写入。这覆盖场景 4：sub form2 能看到 sub form1 / sub form0 等同 MI 内兄弟。
      4) 引入 `orderedPrevTaskIdSet` 与 `recordPrev` 让两次 BFS 与 subProcess 内部递归共享去重，避免同一 user task 多次出现在 previous forms 列表（沿用既有「formId/formName 二级 dedup」之前先做 id 级 dedup，效率与正确性都更稳）。
      5) 不动 `stopSubProcessId` break 行为本身——保留 #1392 对「主流程后兄弟 user task」的截断保护；新逻辑只补充被截断的 intra-MI 路径与 subProcess 内部 user task 透传。
    BFS 复杂度：原 O(V+E)，加上 subProcess 内部聚合后是 O(V+E + Σ|subProcess.descendants|)，最坏情况下被嵌套子流程放大到 O(V·d)（d = 嵌套深度），本项目 BPMN 普遍 d ≤ 3，可忽略；实测每次解析 < 1ms。
    新增测试（`useBpmnParserPreviousForms.test.ts`，8 case 全绿）：
      - 场景 1：主→主基线
      - 场景 2：主→MI 子任务
      - 场景 2 回归：MI 内部 startEvent 在 XML 顺序上排在主 startEvent 之前（#1392 原始根因），BFS 仍只取 main start
      - 场景 3：MI 子任务 → 后续主流程，previous form 同时含上游主流程 task 与 MI 内部 task（formId 11 + 12）
      - 场景 4：intra-MI sub form1 → sub form2，sub form2 的 previous form 含主流程 A + sibling B1
      - 边界保护：MI subProcess 后的兄弟主流程 user task 不会泄漏到 MI 内部 user task 的 previous form 列表（保留 #1392 stopSubProcessId 行为）
      - 重复 formId 去重：兄弟 user task 共享 formId 时仍只输出一条
      - currentId 不在 BPMN 中：返回空数组（向后兼容）
    爆炸半径与契约：纯前端、纯 readonly 显示路径，无后端 API / DTO / 数据库改动。Path 1（同名 key 透传）与 Path 3（共享 tableId 子表行）依旧由 `TaskFormComponent.submitTaskForm` 在 ProcessInstance scope 写入变量保证——本修复只补全 Path 2 readonly 快照面板的可见性，使「设计师在下游 form 中绑定上游字段就能读到值」对所有 4 种节点组合一致生效。
    与现有规则：
      - portal-design-parity.mdc：tasks/detail.vue MI 路径与 applications/detail.vue 的 BPMN form 解析进一步同构（My Request 路径已用 `parseBpmnXmlAndGetAllFormIds` 处理同样的多源/嵌套问题）。
      - issue-radar.mdc：与 #1392 同源（MI 字段透传 BFS 系列），在同一根问题上一次性增量补全场景 3/4，本条记一条 `fixed`。
    验证：
      - `npm test -- --run src/composables/tasks/__tests__/useBpmnParserPreviousForms.test.ts` 全 8 通过；
      - `npm test -- --run linkFormMiIsolation.test.ts mergeSubTableRowsMiMerge.test.ts dropSubsumedSubTableRows.test.ts subTableRowMetaFields.test.ts useBpmnParserPreviousForms.test.ts` 共 52 passed（无回归）；
      - `npm run build` 成功（vite build, 3121 modules transformed, 40s）。
      - Docker `user-portal-frontend` 重建并刷新浏览器后，三个新增场景 readonly 上一步表单面板正确显示。
    后续：与 #1392 note 末尾的「后续建议」同步——若产品决定加显式 field→field mapping UI 仍需独立任务；JSON-row 存储重构（MultiInstanceDataResolver.loadSubTableRow 物理 SELECT）也保持独立。

