# Activepieces 共享账号初始化 Job —— NON-PROD ONLY (uat/sit).
# 新环境(空库)时把共享账号 sign-up 成 AP 的第一个用户(owner/ADMIN,自动建 platform+project)。
# 幂等:已存在则 sign-in 探测通过、直接成功;未配置共享账号(prod runtime-only)则跳过。
#
# 与 ap-gateway.yaml 一样默认从部署集排除;用 -IncludeApBridgeGateway 一并纳入。
# Istio:Job 默认关闭 sidecar 注入,否则 sidecar 不退出会让 Job 永不完成。若 mesh 是 STRICT mTLS、
# 关闭 sidecar 后无法访问 activepieces-service,改为保留 sidecar 并在脚本结束后 curl
# localhost:15020/quitquitquit(见 Istio 文档);或直接 kubectl exec 手工跑 deploy/scripts/ap-bootstrap-shared-account.js。
#
# 脚本**不再内嵌拷贝**:`__AP_BOOTSTRAP_SCRIPT__` 由 ps1/apply-workflow-station-istio-generated.ps1
# 在渲染时从 deploy/scripts/ap-bootstrap-shared-account.js 原样注入(按占位符缩进重排)。
# 曾经这里是一份手抄副本,并且漂移了——它停在 sign-up 就返回,缺了 `POST /v1/platforms`
# 那一步;AP 0.84 CE 的 sign-up 只建 user_identity,不建 platform/project,于是 Job 报成功
# 退出而集群里根本没有 platform,登录桥拿不到 projectId。改白名单/改脚本只改那一个文件。
# Replace __NAMESPACE__, __IMAGE_TAG__(此处复用 AP 镜像,自带 node)。
apiVersion: v1
kind: ConfigMap
metadata:
  name: ap-bootstrap-script
  namespace: __NAMESPACE__
data:
  ap-bootstrap-shared-account.js: |
    __AP_BOOTSTRAP_SCRIPT__
  ap-provision-db.js: |
    __AP_PROVISION_DB_SCRIPT__
  ap-verify-provisioning.js: |
    __AP_VERIFY_SCRIPT__
---
# piece seed 走 binaryData + gzip:原文 558KB,ConfigMap 整个对象上限 1MiB,直接塞进去只剩很少
# 余量且会随白名单增长;gzip 后约 78KB。渲染时由 apply-workflow-station-istio-generated.ps1
# 从 deploy/pieces/metadata/pieces-seed.sql 压缩注入,ap-provision-db.js 读文件时自动解压。
apiVersion: v1
kind: ConfigMap
metadata:
  name: ap-pieces-seed
  namespace: __NAMESPACE__
binaryData:
  pieces-seed.sql.gz: __AP_PIECES_SEED_GZ__
---
apiVersion: batch/v1
kind: Job
metadata:
  name: ap-bootstrap-shared-account
  namespace: __NAMESPACE__
  labels:
    app: ap-bootstrap
spec:
  backoffLimit: 5
  # Job 完成后保留 1 小时便于查日志,然后自动清理(需集群启用 TTLAfterFinished)。
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: ap-bootstrap
      annotations:
        # 关闭 sidecar 注入,否则 Istio sidecar 常驻会让 Job 永不完成。见上方 STRICT mTLS 注记。
        sidecar.istio.io/inject: "false"
    spec:
      restartPolicy: Never
      imagePullSecrets:
      - name: nexus3
      # initContainer 而不是并列的第二个容器:同一 Pod 里的 containers 是并行起的,而这两步有严格
      # 先后——必须先建出 platform/project,校验才有意义。initContainer 天然提供这个顺序。
      initContainers:
      - name: ap-bootstrap
        # Same vendored EE-removed image as the activepieces Deployment (keep tags in sync).
        image: nexus3.hk.hsbc:18080/hsbc-238092-cmbhase-bisp/workflow-station2/activepieces:__IMAGE_TAG__
        imagePullPolicy: IfNotPresent
        command: ["node", "/scripts/ap-bootstrap-shared-account.js"]
        env:
        - name: AP_INTERNAL_URL
          value: "http://activepieces-service:80"
        - name: ACTIVEPIECES_SHARED_EMAIL
          valueFrom:
            configMapKeyRef:
              name: workflow-platform-config
              key: ACTIVEPIECES_SHARED_EMAIL
              optional: true
        - name: ACTIVEPIECES_SHARED_PASSWORD
          valueFrom:
            secretKeyRef:
              name: workflow-platform-secrets
              key: ACTIVEPIECES_SHARED_PASSWORD
              optional: true
        volumeMounts:
        - name: script
          mountPath: /scripts
          readOnly: true
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"
      # 要写库的两步:project externalId stamp + piece_metadata seed。AP 没有对应的写接口,
      # 只能直连库;用的是 AP Deployment 本来就在用的那组 DB 凭据,不新增任何 k8s 权限
      # (RBAC 只有"写 Secret"才需要,那一步仍然只报不改)。幂等,每次部署都跑一遍,
      # 这样白名单变了也会跟着同步。跑完不需要重启 AP——/v1/pieces 是直接查库的。
      - name: ap-provision-db
        image: nexus3.hk.hsbc:18080/hsbc-238092-cmbhase-bisp/workflow-station2/activepieces:__IMAGE_TAG__
        imagePullPolicy: IfNotPresent
        # pg 装在镜像的 /usr/src/app/node_modules,脚本从 /scripts 挂载进来解析不到。
        command: ["node", "/scripts/ap-provision-db.js"]
        env:
        - name: NODE_PATH
          value: "/usr/src/app/node_modules"
        - name: AP_POSTGRES_HOST
          valueFrom:
            configMapKeyRef:
              name: workflow-platform-config
              key: ACTIVEPIECES_POSTGRES_HOST
        - name: AP_POSTGRES_PORT
          valueFrom:
            configMapKeyRef:
              name: workflow-platform-config
              key: ACTIVEPIECES_POSTGRES_PORT
        - name: AP_POSTGRES_DATABASE
          valueFrom:
            configMapKeyRef:
              name: workflow-platform-config
              key: ACTIVEPIECES_POSTGRES_DATABASE
        - name: AP_POSTGRES_USERNAME
          valueFrom:
            configMapKeyRef:
              name: workflow-platform-config
              key: ACTIVEPIECES_POSTGRES_USERNAME
        - name: AP_POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: workflow-platform-secrets
              key: ACTIVEPIECES_POSTGRES_PASSWORD
        # 灌完 seed 要让 AP 的进程内 piece registry 失效——发一条 Redis 消息即可,不用重启
        # (重启 Deployment 才需要 RBAC)。少了这一步:列表正常、单件查询恒 404,画布点开是空的。
        - name: AP_REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: workflow-platform-config
              key: ACTIVEPIECES_REDIS_HOST
        - name: AP_REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: workflow-platform-config
              key: ACTIVEPIECES_REDIS_PORT
        - name: AP_REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: workflow-platform-secrets
              key: ACTIVEPIECES_REDIS_PASSWORD
              optional: true
        - name: ACTIVEPIECES_MANAGED_PROJECT_EXTERNAL_ID
          valueFrom:
            configMapKeyRef:
              name: workflow-platform-config
              key: ACTIVEPIECES_MANAGED_PROJECT_EXTERNAL_ID
              optional: true
        - name: AP_PIECES_SEED_FILE
          value: "/seed/pieces-seed.sql.gz"
        volumeMounts:
        - name: script
          mountPath: /scripts
          readOnly: true
        - name: pieces-seed
          mountPath: /seed
          readOnly: true
        resources:
          requests:
            memory: "192Mi"
            cpu: "50m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      # 校验:上面两个 initContainer 补齐了三项,signing-key 仍是手工。这个容器只读检查、
      # 绝不写入,缺了就让整个 Job 失败,并在日志里打印逐条 kubectl 修复命令——否则缺口要等
      # 有人点开 DW Automation 页签才暴露。
      # 不自动修 signing-key 是裁决:私钥只返回一次、写 Secret 需要 RBAC,且重跑会轮换正在用的密钥。
      containers:
      - name: ap-verify
        image: nexus3.hk.hsbc:18080/hsbc-238092-cmbhase-bisp/workflow-station2/activepieces:__IMAGE_TAG__
        imagePullPolicy: IfNotPresent
        command: ["node", "/scripts/ap-verify-provisioning.js"]
        env:
        - name: AP_INTERNAL_URL
          value: "http://activepieces-service:80"
        - name: ACTIVEPIECES_SHARED_EMAIL
          valueFrom:
            configMapKeyRef:
              name: workflow-platform-config
              key: ACTIVEPIECES_SHARED_EMAIL
              optional: true
        - name: ACTIVEPIECES_SHARED_PASSWORD
          valueFrom:
            secretKeyRef:
              name: workflow-platform-secrets
              key: ACTIVEPIECES_SHARED_PASSWORD
              optional: true
        # 与 admin-center 读同一份配置:期望的 externalId、以及是否启用了 L7 per-user(决定
        # signing-key 是不是必需项)。缺省时 optional=true,校验会相应放宽而不是硬报错。
        - name: ACTIVEPIECES_MANAGED_PROJECT_EXTERNAL_ID
          valueFrom:
            configMapKeyRef:
              name: workflow-platform-config
              key: ACTIVEPIECES_MANAGED_PROJECT_EXTERNAL_ID
              optional: true
        # ACTIVEPIECES_MANAGED_ENABLED 已删除:managed-authn 是 AP 身份的唯一路径,
        # 没有开关也没有回退,故这里不再注入(注入也没人读)。
        volumeMounts:
        - name: script
          mountPath: /scripts
          readOnly: true
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"
      volumes:
      - name: pieces-seed
        configMap:
          name: ap-pieces-seed
      - name: script
        configMap:
          name: ap-bootstrap-script
