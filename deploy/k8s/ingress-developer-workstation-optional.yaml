# =====================================================
# OPTIONAL — Ingress for Developer Workstation Frontend (/dev/)
# =====================================================
# DEV only. Do NOT apply in SIT/UAT/PROD.
# This file is NOT used by deploy.ps1.
# =====================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: workflow-platform-ingress-dev-workstation
  namespace: workflow-platform-sit
spec:
  ingressClassName: nginx
  rules:
  - host: __INGRESS_HOST__
    http:
      paths:
      - path: /dev
        pathType: Prefix
        backend:
          service:
            name: developer-workstation-frontend-service
            port:
              number: 80

