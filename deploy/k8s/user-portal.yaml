# Replace __BASE_DOMAIN__ with your real domain suffix before applying.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-portal
  namespace: __NAMESPACE__
  labels:
    app: user-portal
    component: backend
    app.kubernetes.io/name: user-portal
    app.kubernetes.io/instance: user-portal
spec:
  # P0-2: user-portal 无 @Scheduled 任务、JWT 无状态(httpOnly cookie 按请求校验)、
  # 通过 ClusterIP Service 负载均衡，可安全多副本。HPA 在下方按 CPU 扩缩(min=2)。
  replicas: 2
  selector:
    matchLabels:
      app: user-portal
  template:
    metadata:
      annotations:
        sidecar.istio.io/proxyCPU: 50m
        sidecar.istio.io/proxyCPULimit: 200m
        sidecar.istio.io/proxyMemory: 400Mi
        sidecar.istio.io/proxyMemoryLimit: 400Mi
        sidecar.istio.io/inject: "true"
        sidecar.istio.io/rewriteAppHTTPProbers: "true"
        proxy.istio.io/config: '{ "holdApplicationUntilProxyStarts": true }'
      labels:
        app: user-portal
        component: backend
        app.kubernetes.io/name: user-portal
        app.kubernetes.io/instance: user-portal
    spec:
      imagePullSecrets:
      - name: nexus3
      containers:
      - name: user-portal
        image: nexus3.hk.hsbc:18080/hsbc-238092-cmbhase-bisp/workflow-station2/user-portal:__IMAGE_TAG__
        imagePullPolicy: Always
        command:
        - sh
        - -c
        args:
        - java $JAVA_OPTS -cp /app org.springframework.boot.loader.launch.JarLauncher
        envFrom:
        - configMapRef:
            name: workflow-platform-config
        - secretRef:
            name: workflow-platform-secrets
        ports:
        - containerPort: 8080
          name: http
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /api/portal/health/live
            port: 8080
          initialDelaySeconds: 90
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/portal/health/ready
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: user-portal-service
  namespace: __NAMESPACE__
  labels:
    app: user-portal
spec:
  selector:
    app: user-portal
  ports:
  - name: http
    protocol: TCP
    port: 8080
    targetPort: 8080
  type: ClusterIP
---
apiVersion: networking.istio.io/v1alpha3
kind: DestinationRule
metadata:
  name: user-portal-destination-rule
  namespace: __NAMESPACE__
spec:
  host: user-portal-service
  subsets:
  - name: v1
    labels:
      app: user-portal
---
apiVersion: networking.istio.io/v1beta1
kind: Sidecar
metadata:
  name: user-portal-sidecar
  namespace: __NAMESPACE__
spec:
  workloadSelector:
    labels:
      app: user-portal
  egress:
  - hosts:
    - ./*
    - istio-system/*
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: user-portal-virtual-service
  namespace: __NAMESPACE__
spec:
  hosts:
  - workflow-station-backend-user-portal.__BASE_DOMAIN__
  gateways:
  - user-portal-gateway
  http:
  - retries:
      attempts: 0
    route:
    - destination:
        host: user-portal-service
        subset: v1
        port:
          number: 8080
    timeout: 30s
---
apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: user-portal-gateway
  namespace: __NAMESPACE__
spec:
  selector:
    istio: ingressgateway
  servers:
  - port:
      number: 80
      name: http
      protocol: HTTP
    hosts:
    - workflow-station-backend-user-portal.__BASE_DOMAIN__
---
# P0-2: 按 CPU 自动扩缩(基于 requests.cpu=500m 的百分比)。需集群已装 metrics-server。
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: user-portal-hpa
  namespace: __NAMESPACE__
  labels:
    app: user-portal
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: user-portal
  minReplicas: 2
  maxReplicas: 6
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
---
# P0-2: 保证节点排空/集群升级期间至少 1 个 pod 在线，消除滚动维护停服窗口。
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: user-portal-pdb
  namespace: __NAMESPACE__
  labels:
    app: user-portal
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: user-portal