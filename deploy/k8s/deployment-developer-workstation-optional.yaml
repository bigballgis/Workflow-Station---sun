# =====================================================
# OPTIONAL — Developer Workstation（设计器）仅本地/DEV
# =====================================================
# 勿在 SIT/UAT/PROD 应用。deploy.ps1 不包含本文件；需要时在独立命名空间手动 kubectl apply。
# =====================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: developer-workstation-frontend
  namespace: workflow-platform-sit
  labels:
    app: developer-workstation-frontend
    component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: developer-workstation-frontend
  template:
    metadata:
      labels:
        app: developer-workstation-frontend
        component: frontend
    spec:
      containers:
      - name: developer-workstation-frontend
        image: harbor.company.com/workflow/developer-workstation-frontend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
          name: http
        env:
        - name: KONG_PROXY_URL
          valueFrom:
            configMapKeyRef:
              name: workflow-platform-config
              key: KONG_PROXY_URL
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /dev/
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /dev/
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: developer-workstation-frontend-service
  namespace: workflow-platform-sit
  labels:
    app: developer-workstation-frontend
spec:
  selector:
    app: developer-workstation-frontend
  ports:
  - name: http
    port: 80
    targetPort: 80
  type: ClusterIP
