# Replace __BASE_DOMAIN__ with your real domain suffix before applying.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hase-hermes-workflow-superset
  namespace: __NAMESPACE__
  labels:
    app: hase-hermes-workflow-superset
    component: analytics
    app.kubernetes.io/name: hase-hermes-workflow-superset
    app.kubernetes.io/instance: hase-hermes-workflow-superset
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hase-hermes-workflow-superset
      app.kubernetes.io/instance: hase-hermes-workflow-superset
  template:
    metadata:
      annotations:
        sidecar.istio.io/proxyCPU: 50m
        sidecar.istio.io/proxyCPULimit: 200m
        sidecar.istio.io/proxyMemory: 400Mi
        sidecar.istio.io/proxyMemoryLimit: 400Mi
        sidecar.istio.io/inject: "true"
        sidecar.istio.io/rewriteAppHTTPProbers: "true"
        proxy.istio.io/config: '{ "holdApplicationUntilProxyStarts": true }'
      labels:
        app: hase-hermes-workflow-superset
        component: analytics
        app.kubernetes.io/name: hase-hermes-workflow-superset
        app.kubernetes.io/instance: hase-hermes-workflow-superset
    spec:
      imagePullSecrets:
      - name: nexus3
      containers:
      - name: hase-hermes-workflow-superset
        image: nexus3.hk.hsbc:18080/hsbc-238092-cmbhase-bisp/workflow-station2/superset:6.0.0
        imagePullPolicy: Always
        envFrom:
        - configMapRef:
            name: workflow-platform-config
        - secretRef:
            name: workflow-platform-secrets
        ports:
        - containerPort: 8088
          name: http
        resources:
          requests:
            memory: "2000Mi"
            cpu: "600m"
          limits:
            memory: "3600Mi"
            cpu: "1000m"
        volumeMounts:
        - name: superset-config
          mountPath: /app/pythonpath/superset_config.py
          subPath: superset_config.py
      volumes:
      - name: superset-config
        configMap:
          name: hase-hermes-workflow-superset-config
---
apiVersion: v1
kind: Service
metadata:
  name: hase-hermes-workflow-superset
  namespace: __NAMESPACE__
  labels:
    app: hase-hermes-workflow-superset
spec:
  selector:
    app: hase-hermes-workflow-superset
  ports:
  - name: http
    protocol: TCP
    port: 80
    targetPort: 8088
  type: ClusterIP
---
apiVersion: networking.istio.io/v1alpha3
kind: DestinationRule
metadata:
  name: hase-hermes-workflow-superset-destination-rule
  namespace: __NAMESPACE__
spec:
  host: hase-hermes-workflow-superset
  subsets:
  - name: v1
    labels:
      app: hase-hermes-workflow-superset
---
apiVersion: networking.istio.io/v1beta1
kind: Sidecar
metadata:
  name: hase-hermes-workflow-superset-sidecar
  namespace: __NAMESPACE__
spec:
  workloadSelector:
    labels:
      app: hase-hermes-workflow-superset
  egress:
  - hosts:
    - ./*
    - istio-system/*
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: hase-hermes-workflow-superset-virtual-service
  namespace: __NAMESPACE__
spec:
  # EMBED host (ungated, guest-token auth) — used by the user-portal iframe
  # (SUPERSET_PUBLIC_HOST). Strip any client-supplied X-Remote-* so this open
  # host can never forge an authenticated REMOTE_USER (author) session.
  hosts:
  - hermes-workflow-superset-internal-proxy.__BASE_DOMAIN__
  gateways:
  - hase-hermes-workflow-superset-gateway
  http:
  - retries:
      attempts: 0
    headers:
      request:
        remove:
        - x-remote-user
        - x-remote-roles
        - x-remote-email
        - x-remote-firstname
        - x-remote-lastname
    route:
    - destination:
        host: hase-hermes-workflow-superset
        subset: v1
        port:
          number: 80
    timeout: 30s
---
apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: hase-hermes-workflow-superset-gateway
  namespace: __NAMESPACE__
spec:
  selector:
    istio: ingressgateway
  servers:
  - port:
      number: 80
      name: http
      protocol: HTTP
    hosts:
    - hermes-workflow-superset-internal-proxy.__BASE_DOMAIN__
---
# =============================================================================
# Superset AUTHOR UI gateway (Phase 1 "E") — JWT-gated via Istio ext_authz.
# Authors reach Superset's native UI through this host. An AuthorizationPolicy
# (CUSTOM action) calls the admin-center authorize endpoint, which validates the
# platform JWT and returns X-Remote-User / X-Remote-Roles; Envoy injects those
# upstream so the custom SecurityManager logs the author in (REMOTE_USER SSO).
#
# PREREQUISITE (cluster-ops, NOT in this repo): the ext_authz provider named
# "superset-bi-ext-authz" must be declared in the mesh's meshConfig
# extensionProviders. See deploy/k8s/SUPERSET_SSO_GATEWAY.md.
# =============================================================================
apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: hase-hermes-workflow-superset-author-gateway
  namespace: __NAMESPACE__
spec:
  selector:
    istio: ingressgateway
  servers:
  - port:
      number: 80
      name: http
      protocol: HTTP
    hosts:
    - hermes-workflow-superset-author.__BASE_DOMAIN__
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: hase-hermes-workflow-superset-author-virtual-service
  namespace: __NAMESPACE__
spec:
  hosts:
  - hermes-workflow-superset-author.__BASE_DOMAIN__
  gateways:
  - hase-hermes-workflow-superset-author-gateway
  http:
  - retries:
      attempts: 0
    # Strip client-forged identity headers; the ext_authz provider re-injects the
    # validated X-Remote-User / X-Remote-Roles (headersToUpstreamOnAllow).
    headers:
      request:
        remove:
        - x-remote-user
        - x-remote-roles
        - x-remote-email
        - x-remote-firstname
        - x-remote-lastname
    route:
    - destination:
        host: hase-hermes-workflow-superset
        subset: v1
        port:
          number: 80
    timeout: 30s
---
# CUSTOM AuthorizationPolicy: gate ONLY the author host with ext_authz.
# Embed-host traffic does not match (different host) and stays ungated.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: hase-hermes-workflow-superset-author-extauthz
  namespace: __NAMESPACE__
spec:
  selector:
    matchLabels:
      app: hase-hermes-workflow-superset
  action: CUSTOM
  provider:
    # Must match a meshConfig extensionProviders[].name (cluster-ops managed).
    name: superset-bi-ext-authz
  rules:
  - to:
    - operation:
        hosts:
        - hermes-workflow-superset-author.__BASE_DOMAIN__