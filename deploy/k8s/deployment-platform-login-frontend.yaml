# =====================================================
# Platform Login Frontend (unified /login/ SPA)
# =====================================================
# Serves static login UI + proxies /api/ to Kong (KONG_PROXY_URL).
# Ingress: route path /login (Prefix) on the single domain host to this Service so
# redirectToUnifiedLogin() (same-origin /login/) works in single-domain multi-path deployments.
# =====================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-login-frontend
  namespace: workflow-platform-sit
  labels:
    app: platform-login-frontend
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: platform-login-frontend
  template:
    metadata:
      labels:
        app: platform-login-frontend
        component: frontend
    spec:
      containers:
      - name: platform-login-frontend
        image: harbor.company.com/workflow/platform-login-frontend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
          name: http
        env:
        - name: KONG_PROXY_URL
          valueFrom:
            configMapKeyRef:
              name: workflow-platform-config
              key: KONG_PROXY_URL
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        livenessProbe:
          httpGet:
            path: /login/
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /login/
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: platform-login-frontend-service
  namespace: workflow-platform-sit
  labels:
    app: platform-login-frontend
spec:
  selector:
    app: platform-login-frontend
  ports:
  - name: http
    port: 80
    targetPort: 80
  type: ClusterIP
