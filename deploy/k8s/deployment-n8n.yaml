apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
  namespace: workflow-platform-sit
  labels:
    app: n8n
    component: automation
spec:
  replicas: 1
  selector:
    matchLabels:
      app: n8n
  template:
    metadata:
      labels:
        app: n8n
        component: automation
    spec:
      containers:
      - name: n8n
        image: n8nio/n8n
        imagePullPolicy: Always
        ports:
        - containerPort: 5678
          name: http
        envFrom:
        - configMapRef:
            name: workflow-platform-config
        - secretRef:
            name: workflow-platform-secrets
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        readinessProbe:
          httpGet:
            path: /healthz
            port: 5678
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /healthz
            port: 5678
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        volumeMounts:
        - name: n8n-data
          mountPath: /home/node/.n8n
      volumes:
      - name: n8n-data
        persistentVolumeClaim:
          claimName: n8n-data-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: n8n-service
  namespace: workflow-platform-sit
  labels:
    app: n8n
spec:
  selector:
    app: n8n
  ports:
  - name: http
    port: 5678
    targetPort: 5678
  type: ClusterIP

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: n8n-data-pvc
  namespace: workflow-platform-sit
  labels:
    app: n8n
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
