# Replace __BASE_DOMAIN__ with your real domain suffix before applying.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workflow-engine
  namespace: __NAMESPACE__
  labels:
    app: workflow-engine
    component: backend
    app.kubernetes.io/name: workflow-engine
    app.kubernetes.io/instance: workflow-engine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: workflow-engine
  template:
    metadata:
      annotations:
        sidecar.istio.io/proxyCPU: 50m
        sidecar.istio.io/proxyCPULimit: 200m
        sidecar.istio.io/proxyMemory: 400Mi
        sidecar.istio.io/proxyMemoryLimit: 400Mi
        sidecar.istio.io/inject: "true"
        sidecar.istio.io/rewriteAppHTTPProbers: "true"
        proxy.istio.io/config: '{ "holdApplicationUntilProxyStarts": true }'
      labels:
        app: workflow-engine
        component: backend
        app.kubernetes.io/name: workflow-engine
        app.kubernetes.io/instance: workflow-engine
    spec:
      imagePullSecrets:
      - name: nexus3
      containers:
      - name: workflow-engine
        image: nexus3.hk.hsbc:18080/hsbc-238092-cmbhase-bisp/workflow-station2/workflow-engine-core:__IMAGE_TAG__
        imagePullPolicy: Always
        envFrom:
        - configMapRef:
            name: workflow-platform-config
        - secretRef:
            name: workflow-platform-secrets
        ports:
        - containerPort: 8080
          name: http
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8080
          initialDelaySeconds: 90
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: workflow-engine-service
  namespace: __NAMESPACE__
  labels:
    app: workflow-engine
spec:
  selector:
    app: workflow-engine
  ports:
  - name: http
    protocol: TCP
    port: 8080
    targetPort: 8080
  type: ClusterIP
---
apiVersion: networking.istio.io/v1alpha3
kind: DestinationRule
metadata:
  name: workflow-engine-destination-rule
  namespace: __NAMESPACE__
spec:
  host: workflow-engine-service
  subsets:
  - name: v1
    labels:
      app: workflow-engine
---
apiVersion: networking.istio.io/v1beta1
kind: Sidecar
metadata:
  name: workflow-engine-sidecar
  namespace: __NAMESPACE__
spec:
  workloadSelector:
    labels:
      app: workflow-engine
  egress:
  - hosts:
    - ./*
    - istio-system/*
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: workflow-engine-virtual-service
  namespace: __NAMESPACE__
spec:
  hosts:
  - workflow-station-backend-workflow-engine.__BASE_DOMAIN__
  gateways:
  - workflow-engine-gateway
  http:
  - retries:
      attempts: 0
    route:
    - destination:
        host: workflow-engine-service
        subset: v1
        port:
          number: 8080
    timeout: 30s
---
apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: workflow-engine-gateway
  namespace: __NAMESPACE__
spec:
  selector:
    istio: ingressgateway
  servers:
  - port:
      number: 80
      name: http
      protocol: HTTP
    hosts:
    - workflow-station-backend-workflow-engine.__BASE_DOMAIN__