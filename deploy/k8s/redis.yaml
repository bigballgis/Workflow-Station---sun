# Replace __BASE_DOMAIN__ with your real domain suffix before applying.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: __NAMESPACE__
  labels:
    app: redis
    component: infrastructure
    app.kubernetes.io/name: redis
    app.kubernetes.io/instance: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
        component: infrastructure
        app.kubernetes.io/name: redis
        app.kubernetes.io/instance: redis
    spec:
      imagePullSecrets:
      - name: nexus3
      containers:
      - name: redis
        #image: nexus3.hk.hsbc:18080/hsbc-238092-cmbhase-bisp/workflow-station2/redis:__IMAGE_TAG__
        image: nexus3.hk.hsbc:18080/hsbc-238092-cmbhase-bisp/workflow-station2/redis:7.2
        command: ["redis-server", "--appendonly", "yes", "--requirepass", "$(REDIS_PASSWORD)"]
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: workflow-platform-secrets
              key: SPRING_REDIS_PASSWORD
        ports:
        - containerPort: 6379
          name: redis
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - redis-cli -a $REDIS_PASSWORD ping | grep PONG
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - redis-cli -a $REDIS_PASSWORD ping | grep PONG
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: redis-data
          mountPath: /data
      volumes:
      - name: redis-data
        persistentVolumeClaim:
          claimName: redis-data-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data-pvc
  namespace: __NAMESPACE__
  labels:
    app: redis
spec:
  storageClassName: pwx-standard
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: __NAMESPACE__
  labels:
    app: redis
spec:
  selector:
    app: redis
  ports:
  - name: redis
    protocol: TCP
    port: 6379
    targetPort: 6379
  type: ClusterIP
---
apiVersion: networking.istio.io/v1alpha3
kind: DestinationRule
metadata:
  name: redis-destination-rule
  namespace: __NAMESPACE__
spec:
  host: redis-service
  subsets:
  - name: v1
    labels:
      app: redis
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 100
        connectTimeout: 30s
---
apiVersion: networking.istio.io/v1beta1
kind: Sidecar
metadata:
  name: redis-sidecar
  namespace: __NAMESPACE__
spec:
  workloadSelector:
    labels:
      app: redis
  egress:
  - hosts:
    - ./*
    - istio-system/*
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: redis-virtual-service
  namespace: __NAMESPACE__
spec:
  hosts:
  - workflow-station-redis.__BASE_DOMAIN__
  gateways:
  - redis-gateway
  tcp:
  - route:
    - destination:
        host: redis-service
        subset: v1
        port:
          number: 6379
---
apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: redis-gateway
  namespace: __NAMESPACE__
spec:
  selector:
    istio: ingressgateway
  servers:
  - port:
      number: 6379
      name: redis-tcp
      protocol: TCP
    hosts:
    - workflow-station-redis.__BASE_DOMAIN__