# =====================================================
# Kong API Gateway Deployment + Service
# =====================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kong
  namespace: workflow-platform-sit
  labels:
    app: kong
    component: gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kong
  template:
    metadata:
      labels:
        app: kong
        component: gateway
    spec:
      containers:
      - name: kong
        image: kong:3.9
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: proxy
        - containerPort: 8001
          name: admin
        env:
        - name: KONG_DATABASE
          value: "off"
        - name: KONG_DECLARATIVE_CONFIG
          value: /kong/kong.yml
        - name: KONG_PROXY_ACCESS_LOG
          value: /dev/stdout
        - name: KONG_PROXY_ERROR_LOG
          value: /dev/stderr
        - name: KONG_ADMIN_LISTEN
          value: "0.0.0.0:8001"
        - name: KONG_NGINX_PROXY_CLIENT_MAX_BODY_SIZE
          value: "100m"
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: workflow-platform-secrets
              key: JWT_SECRET
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: workflow-platform-config
              key: SPRING_REDIS_HOST
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: workflow-platform-secrets
              key: SPRING_REDIS_PASSWORD
        - name: CORS_ALLOWED_ORIGINS
          valueFrom:
            configMapKeyRef:
              name: workflow-platform-config
              key: CORS_ALLOWED_ORIGINS
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /status
            port: 8001
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /status
            port: 8001
          initialDelaySeconds: 5
          periodSeconds: 5
        volumeMounts:
        - name: kong-config
          mountPath: /kong/kong.yml.template
          subPath: kong.yml.template
        - name: kong-entrypoint
          mountPath: /kong/docker-entrypoint-kong.sh
          subPath: docker-entrypoint-kong.sh
      volumes:
      - name: kong-config
        configMap:
          name: kong-declarative-config
      - name: kong-entrypoint
        configMap:
          name: kong-declarative-config
          defaultMode: 0755

---
apiVersion: v1
kind: Service
metadata:
  name: kong-service
  namespace: workflow-platform-sit
  labels:
    app: kong
spec:
  selector:
    app: kong
  ports:
  - name: proxy
    port: 8000
    targetPort: 8000
  - name: admin
    port: 8001
    targetPort: 8001
  type: ClusterIP
