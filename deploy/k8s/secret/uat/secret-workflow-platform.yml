apiVersion: v1
kind: Secret
metadata:
  name: workflow-platform-secrets
  namespace: __NAMESPACE__
type: Opaque
# =====================================================================
# UAT Secret —— 仅占位符，严禁提交真实密钥
# =====================================================================
# 本文件被 git 跟踪（文件名不以 -secret.yml 结尾，沿用 preprod 约定），因此只放 CHANGE_ME_UAT_* 占位。
# 部署时用以下任一方式注入真实值（取自 deploy/environments/uat/secrets.env，该文件已被 .gitignore 忽略）：
#   - sealed-secrets / vault 渲染；或
#   - kubectl create secret generic workflow-platform-secrets --from-env-file=... --dry-run=client -o yaml | kubectl apply -f -
stringData:
  APP_SECURITY_JWT_SECRET_KEY: "CHANGE_ME_UAT_JWT_SECRET"
  ENCRYPTION_SECRET_KEY: "CHANGE_ME_UAT_ENCRYPTION_SECRET_KEY"
  JWT_SECRET: "CHANGE_ME_UAT_JWT_SECRET"
  SPRING_DATASOURCE_PASSWORD: "CHANGE_ME_UAT_DB_PASSWORD"
  SPRING_REDIS_PASSWORD: "CHANGE_ME_UAT_REDIS_PASSWORD"
  SSO_INTERNAL_TOKEN: "CHANGE_ME_UAT_SSO_INTERNAL_TOKEN"
  # C-3 (docs/ap-integration/DECISIONS.md#d6): trusted first-party service secret.
  # Consumed via envFrom by admin-center / user-portal / developer-workstation ONLY.
  # activepieces references the shared secret by individual key (no envFrom), so it does
  # NOT receive this — do not add a SERVICE_INTERNAL_TOKEN secretKeyRef to activepieces.yaml.
  SERVICE_INTERNAL_TOKEN: "CHANGE_ME_UAT_SERVICE_INTERNAL_TOKEN"
  DB_POSTGRESDB_PASSWORD: "CHANGE_ME_UAT_DB_PASSWORD"
  N8N_DB_POSTGRESDB_PASSWORD: "CHANGE_ME_UAT_N8N_DB_PASSWORD"
  N8N_ENCRYPTION_KEY: "CHANGE_ME_UAT_N8N_ENCRYPTION_KEY"
  ACTIVEPIECES_POSTGRES_PASSWORD: "CHANGE_ME_UAT_ACTIVEPIECES_DB_PASSWORD"
  ACTIVEPIECES_REDIS_PASSWORD: "CHANGE_ME_UAT_REDIS_PASSWORD"
  # MUST be a 32-char hex string (16 bytes): `openssl rand -hex 16`.
  ACTIVEPIECES_ENCRYPTION_KEY: "CHANGE_ME_UAT_ACTIVEPIECES_ENCRYPTION_KEY_32HEX"
  ACTIVEPIECES_JWT_SECRET: "CHANGE_ME_UAT_ACTIVEPIECES_JWT_SECRET"
  # AP shared service account password (admin-center signs in server-side; browser never sees it).
  ACTIVEPIECES_SHARED_PASSWORD: "CHANGE_ME_UAT_ACTIVEPIECES_SHARED_PASSWORD"
  DOUBAO_MODEL_ID: "CHANGE_ME_UAT_DOUBAO_MODEL_ID"
  N8N_DOUBAO_MODEL_ID: "CHANGE_ME_UAT_DOUBAO_MODEL_ID"
  DOUBAO_API_KEY: "CHANGE_ME_UAT_DOUBAO_API_KEY"
  N8N_DOUBAO_API_KEY: "CHANGE_ME_UAT_DOUBAO_API_KEY"
  SUPERSET_SECRET_KEY: "CHANGE_ME_UAT_SUPERSET_SECRET_KEY"
  BI_SUPERSET_USERNAME: "CHANGE_ME_UAT_SUPERSET_ADMIN_USER"
  BI_SUPERSET_PASSWORD: "CHANGE_ME_UAT_SUPERSET_ADMIN_PASSWORD"
  # ==================== LDAP / SSO-DSP 密钥（UAT）====================
  # 真实值见 deploy/environments/uat/secrets.env（gitignored）：
  #   LDAP_BIND_PASSWORD / LDAP_KEYSTORE_PASSWORD(changeit) / DSP_CLIENT_SECRET
  LDAP_BIND_PASSWORD: "CHANGE_ME_UAT_LDAP_BIND_PASSWORD"
  LDAP_KEYSTORE_PASSWORD: "CHANGE_ME_UAT_LDAP_KEYSTORE_PASSWORD"
  DSP_CLIENT_SECRET: "hermes@123"
  VITE_DSP_CLIENT_SECRET: "hermes@123"