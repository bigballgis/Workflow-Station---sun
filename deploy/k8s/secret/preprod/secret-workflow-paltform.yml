apiVersion: v1
kind: Secret
metadata:
  name: workflow-platform-secrets
  namespace: __NAMESPACE__
type: Opaque
stringData:
  APP_SECURITY_JWT_SECRET_KEY: "dev-256-bit-secret-key-for-jwt-signing-development-environment-only"
  ENCRYPTION_SECRET_KEY: "dev-32-byte-aes-256-secret-key!!"
  JWT_SECRET: "dev-256-bit-secret-key-for-jwt-signing-development-environment-only"
  SPRING_DATASOURCE_PASSWORD: ""
  SPRING_REDIS_PASSWORD: ""
  SSO_INTERNAL_TOKEN: "CHANGE_ME_SIT_SSO_INTERNAL_TOKEN"
  # C-3 (docs/ap-integration/DECISIONS.md#d6): trusted first-party service secret.
  # Consumed via envFrom by admin-center / user-portal / developer-workstation ONLY.
  # activepieces references the shared secret by individual key (no envFrom), so it does
  # NOT receive this — do not add a SERVICE_INTERNAL_TOKEN secretKeyRef to activepieces.yaml.
  SERVICE_INTERNAL_TOKEN: "CHANGE_ME_SIT_SERVICE_INTERNAL_TOKEN"
  ACTIVEPIECES_POSTGRES_PASSWORD: ""
  ACTIVEPIECES_REDIS_PASSWORD: ""
  # AP_ENCRYPTION_KEY MUST be a 32-char hex string (16 bytes): `openssl rand -hex 16`.
  ACTIVEPIECES_ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef"
  ACTIVEPIECES_JWT_SECRET: "dev-activepieces-jwt-secret-change-in-production"
  # AP shared service account password (admin-center signs in server-side; browser never sees it).
  ACTIVEPIECES_SHARED_PASSWORD: "CHANGE_ME_SIT_ACTIVEPIECES_SHARED_PASSWORD"
  SUPERSET_SECRET_KEY: "preprod-superset-secret-key-rotate-me-3d9f1a7c8e2b4506"
  # Superset metadata DB — required. No ConfigMap/code fallback credentials.
  # Example: postgresql+psycopg2://USER:PASS@HOST:5432/DB
  SUPERSET_DATABASE_URI: "CHANGE_ME_SUPERSET_DATABASE_URI"
  BI_SUPERSET_USERNAME: "admin"
  BI_SUPERSET_PASSWORD: "admin123"
  # LDAP 服务账号密码 / DSP translator 凭证 / LDAPS truststore 口令（各环境替换）
  LDAP_BIND_PASSWORD: "CHANGE_ME_SIT_LDAP_BIND_PASSWORD"
  LDAP_KEYSTORE_PASSWORD: "CHANGE_ME_SIT_LDAP_KEYSTORE_PASSWORD"
  DSP_CLIENT_SECRET: "hermes@123"