apiVersion: v1
kind: ConfigMap
metadata:
  name: workflow-platform-config
  namespace: __NAMESPACE__
data:
  ADMIN_CENTER_BACKEND_URL: "http://admin-center-service.__NAMESPACE__:8080"
  ADMIN_CENTER_URL: "http://admin-center-service.__NAMESPACE__:8080"
  API_GATEWAY_BACKEND_URL: "http://kong-service.__NAMESPACE__:8000"
  API_GATEWAY_URL: "http://kong-service.__NAMESPACE__:8000"
  KONG_PROXY_URL: "http://kong-service.__NAMESPACE__:8000"
  CACHE_DICTIONARY_TTL_MINUTES: "120"
  CACHE_PERMISSION_TTL_MINUTES: "60"
  CACHE_USER_TTL_MINUTES: "30"
  CORS_ALLOWED_ORIGINS: "https://__INGRESS_HOST__,http://__INGRESS_HOST__,https://sit-admin.company.com,https://sit-portal.company.com,https://sit-dev.company.com"
  DEVELOPER_WORKSTATION_BACKEND_URL: "http://developer-workstation-service.__NAMESPACE__:8080"
  DEVELOPER_WORKSTATION_URL: "http://developer-workstation-service.__NAMESPACE__:8080"
  FLOWABLE_SCHEMA_UPDATE: "true"
  JWT_EXPIRATION: "86400000"
  JWT_EXPIRATION_MS: "86400000"
  JWT_ISSUER: "platform-sit"
  JWT_REFRESH_EXPIRATION: "604800000"
  JWT_REFRESH_EXPIRATION_MS: "604800000"
  JWT_VALIDATE_ISSUER: "true"
  LOG_LEVEL: "INFO"
  LOG_LEVEL_PLATFORM: "INFO"
  LOG_LEVEL_ROOT: "INFO"
  LOG_LEVEL_SQL: "WARN"
  SECURITY_LOGIN_MAX_FAILED_ATTEMPTS: "5"
  SECURITY_PASSWORD_MIN_LENGTH: "8"
  SECURITY_SESSION_TIMEOUT_MINUTES: "30"
  # admin-center Admin UI「重置密码」后的明文（application.yml: admin.user.reset-password）；生产建议改 Secret
  USER_RESET_PASSWORD: "password"
  SERVER_PORT: "8080"
  SPRING_DATASOURCE_URL: "jdbc:postgresql://hkl25243602.hc.cloud.hk.hsbc:25011/hmhkdev?currentSchema=hmwfst"
  SPRING_DATASOURCE_USERNAME: "hmhkodev1"
  SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka-service.__NAMESPACE__:29092"
  SPRING_DATA_REDIS_HOST: "redis-service.__NAMESPACE__"
  SPRING_DATA_REDIS_PORT: "6379"
  SPRING_DATA_REDIS_SSL_ENABLED: "false"
  SPRING_FLYWAY_ENABLED: "false"
  SPRING_PROFILES_ACTIVE: "sit"
  SPRING_REDIS_HOST: "redis-service.__NAMESPACE__"
  SPRING_REDIS_PORT: "6379"
  SPRING_REDIS_SSL_ENABLED: "false"
  INGRESS_HOST: "__INGRESS_HOST__"
  SSO_REDIRECT_ADMIN_PREFIX: "https://__INGRESS_HOST__/admin/sso/callback"
  SSO_REDIRECT_ADMIN_HTTP_PREFIX: "http://__INGRESS_HOST__/admin/sso/callback"
  SSO_REDIRECT_PORTAL_PREFIX: "https://__INGRESS_HOST__/portal/sso/callback"
  SSO_REDIRECT_PORTAL_HTTP_PREFIX: "http://__INGRESS_HOST__/portal/sso/callback"
  SSO_REDIRECT_DW_PREFIX: "https://__INGRESS_HOST__/dev/sso/callback"
  SSO_REDIRECT_DW_HTTP_PREFIX: "http://__INGRESS_HOST__/dev/sso/callback"
  SWAGGER_ENABLED: "true"
  USER_PORTAL_BACKEND_URL: "http://user-portal-service.__NAMESPACE__:8080"
  USER_PORTAL_URL: "http://user-portal-service.__NAMESPACE__:8080"
  WORKFLOW_ENGINE_BACKEND_URL: "http://workflow-engine-service.__NAMESPACE__:8080"
  WORKFLOW_ENGINE_URL: "http://workflow-engine-service.__NAMESPACE__:8080"
  FILE_UPLOAD_BASE_URL: "/api/v1/upload/files"
  # Activepieces (PROD runtime only — UI not exposed; Istio routes only /api/v1/webhooks).
  ACTIVEPIECES_POSTGRES_HOST: "hkl25243602.hc.cloud.hk.hsbc"
  ACTIVEPIECES_POSTGRES_PORT: "25011"
  ACTIVEPIECES_POSTGRES_DATABASE: "hmhkdev"
  ACTIVEPIECES_POSTGRES_USERNAME: "hmhkodev1"
  ACTIVEPIECES_REDIS_HOST: "redis-service.__NAMESPACE__"
  ACTIVEPIECES_REDIS_PORT: "6379"
  ACTIVEPIECES_FRONTEND_URL: "https://sit-activepieces.company.com/"
  ACTIVEPIECES_WEBHOOK_URL: "https://sit-activepieces.company.com/"
  # --- AP shared-account login bridge (NON-PROD: uat/sit have the UI) ---
  # Share the platform JWT across sub-domains so the AP gateway host receives it.
  JWT_COOKIE_DOMAIN: ".__BASE_DOMAIN__"
  ACTIVEPIECES_BRIDGE_ENABLED: "true"
  ACTIVEPIECES_INTERNAL_URL: "http://activepieces-service:80"
  # AI Generate 对话(developer-workstation)走 Activepieces 同步 webhook。
  # flowId 每环境不同:先把 deploy/ap-flows/ai-function-unit-gen.json 经 Jenkins 导入本环境 AP,
  # 再把 ap-import 打印出的 flowId 回填 __AI_GEN_FLOW_ID__。
  AI_GENERATION_WEBHOOK_URL: "http://activepieces-service:80/api/v1/webhooks/__AI_GEN_FLOW_ID__/sync"
  # 300s: deepseek-v4-pro DESIGN 文档实测 ~230s;与 activepieces.yaml 的 AP_WEBHOOK_TIMEOUT_SECONDS 对齐。
  AI_GENERATION_TIMEOUT: "300"
  # developer-workstation 出站 SSRF 白名单(仅该服务读取 ssrf.allowed-hosts)。
  SSRF_ALLOWED_HOSTS: "localhost,activepieces-service"
  ACTIVEPIECES_SHARED_EMAIL: "hermes-svc@platform.local"
  # npm registry for AP runtime piece installs (bun honors NPM_CONFIG_REGISTRY).
  # REPLACE with the internal Nexus npm repo URL before provisioning pieces.
  # Fail-closed default on purpose: empty would silently fall back to PUBLIC npmjs.
  ACTIVEPIECES_NPM_REGISTRY: "http://npm-registry-not-configured.invalid/"
  # Frontend runtime config: admin "Activepieces" launcher -> AP gateway bridge.
  AP_BRIDGE_URL: "http://hermes-workflow-activepieces.__BASE_DOMAIN__/__ap/bridge"
  SUPERSET_CONFIG_PATH: "/app/pythonpath/superset_config.py"
  SUPERSET_HOST: "http://hase-hermes-workflow-superset.__NAMESPACE__:80"
  SUPERSET_PUBLIC_HOST: "http://hermes-workflow-superset-internal-proxy.__BASE_DOMAIN__/"
  SUPERSET_DB_SCHEMA: "superset"
  # Origins allowed to call Superset APIs (CORS) and to iframe it (CSP frame-ancestors).
  # Must list the user-portal origin(s) that embed dashboards. Was implicitly "*".
  SUPERSET_CORS_ORIGINS: "https://__INGRESS_HOST__,http://__INGRESS_HOST__,https://sit-portal.company.com"
  # Superset Logout button -> platform endpoint that clears the JWT cookie, then login.
  SUPERSET_LOGOUT_REDIRECT_URL: "https://__INGRESS_HOST__/api/v1/admin/auth/logout-redirect"
  # Where /auth/logout-redirect lands after clearing the cookie: a WORKING login page
  # (SSO params; redirect_uri percent-encoded). state=superset-author flows re-login
  # back into Superset. Relative -> resolved against the ingress host.
  APP_SECURITY_LOGOUT_REDIRECT_TARGET: "/login/?client_id=admin&redirect_uri=https%3A%2F%2F__INGRESS_HOST__%2Fadmin%2Fsso%2Fcallback&state=superset-author"
  # ==================== LDAP / SSO-DSP (admin-center) ====================
  # 非敏感配置；bind/client 密钥放 workflow-platform-secrets。连接细节按环境填 __LDAP_*__ / __DSP_*__。
  # 默认关闭：各环境确认连通后再置 true（开发跳过角色校验生产恒为 false）。
  ADMIN_DEV_BYPASS_ROLE_CHECK: "false"
  # 引擎本地测试账号开关：生产/预生产必须为 false（accounts 变量不设置）
  WORKFLOW_TEST_USERS_ENABLED: "false"
  LDAP_ENABLED: "true"
  LDAP_PROVIDER_URL: "ldaps://aa-lds-prod.hk.hsbc:3269"
  LDAP_BASE_DN: "OU=HSBCPeople,DC=InfoDir,DC=Prod,DC=HSBC"
  LDAP_BIND_DN: "CN=HK-SVCA-HERMES,OU=Service Accounts,DC=InfoDir,DC=Prod,DC=HSBC"
  LDAP_TLS: "true"
  # 明文 ldap:// 且 TLS=false 时启动 fail-fast；仅本地 mock 才可置 true
  LDAP_ALLOW_INSECURE: "false"
  LDAP_CONNECT_TIMEOUT_MS: "5000"
  LDAP_READ_TIMEOUT_MS: "10000"
  LDAP_USER_SEARCH_FILTER: "(|(objectclass=userproxy)(objectclass=user))"
  LDAP_SYNC_ENABLED: "true"
  LDAP_SYNC_CRON: "0 0 */2 * * ?"
  LDAP_HERMES_ENV: "PPD"
  LDAP_GROUP_SEARCH_BASE_DN: "DC=InfoDir,DC=Prod,DC=HSBC"
  LDAP_HERMES_GROUP_SYNC_GROUPS: "Admin=Infodir-Hermes-Default-PPD-Admin,User=Infodir-Hermes-Default-PPD-User,Developer=Infodir-Hermes-Default-PPD-Developer"
  LDAP_HERMES_GROUP_SYNC_ROLES: "Admin,User,Developer"
  LDAP_HERMES_GROUP_SYNC_PATTERN: "Infodir-Hermes-Default-{env}-{role}"
  LDAP_HERMES_GROUP_SYNC_BATCH_SIZE: "20"
  LDAP_ATTR_TITLE: "title"
  LDAP_ATTR_WORK_ROLE: "hsbc-ad-WorkRole"
  LDAP_ATTR_POSTAL_ADDRESS: "postalAddress"
  LDAP_KEYSTORE_PATH: "/tmp/dsp-cacerts"
  DSP_SSO_ENABLED: "true"
  DSP_AUTHENTICATE_URL: "https://cmb-staff-dsp-uat.hk.hsbc:8443/dsp/dspAuthenticate.jsp?realm=staff&service=wdssoservice"
  DSP_TRANSLATOR_URL: "https://cmb-ib2b-dsp-pprod-ap.hk.hsbc:8443/dsp/rest-sts/DSP_iB2B/iB2B_tokenTranslator_v2?_action=translate"
  DSP_MANIFEST_LOCATIONS: "https://public-key-manifest-v1-cert.apps.cf.skm-drn-01.cloud.hk.hsbc/manifest.json"
  DSP_CLIENT_ID: "HERMES"
  DSP_E2E_HEADER_NAME: "X-HSBC-E2E-Trust-Token"
  DSP_EMPLOYEE_ID_CLAIMS: "employeeID,employeeNumber,hsbcStaffId,sub"
  DSP_USERNAME_CLAIMS: "uid,preferred_username,samAccountName,sub"