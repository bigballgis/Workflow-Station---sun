apiVersion: v1
kind: ConfigMap
metadata:
  name: workflow-platform-config
  namespace: workflow-platform-prod
data:
  # Spring Profile
  SPRING_PROFILES_ACTIVE: "prod"

  # Server Port
  SERVER_PORT: "8080"

  # Database (non-sensitive)
  SPRING_DATASOURCE_URL: "jdbc:postgresql://prod-postgres.internal:5432/workflow_platform_prod"

  # Redis (K8S internal service)
  SPRING_REDIS_HOST: "redis-service"
  SPRING_REDIS_PORT: "6379"

  # Kafka (K8S internal service)
  SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka-service:29092"

  # Service URLs (K8S Service names — used by both backends and frontend nginx)
  ADMIN_CENTER_URL: "http://admin-center-service:8080"
  WORKFLOW_ENGINE_URL: "http://workflow-engine-service:8080"
  DEVELOPER_WORKSTATION_URL: "http://developer-workstation-service:8080"
  USER_PORTAL_URL: "http://user-portal-service:8080"
  KONG_PROXY_URL: "http://kong-service:8000"

  # JWT (shorter expiration for production)
  JWT_EXPIRATION: "28800000"
  JWT_REFRESH_EXPIRATION: "86400000"

  # Logging (production: minimal)
  LOG_LEVEL_ROOT: "WARN"
  LOG_LEVEL_PLATFORM: "INFO"
  LOG_LEVEL_SQL: "ERROR"

  # Cache (longer TTL for performance)
  CACHE_USER_TTL_MINUTES: "60"
  CACHE_PERMISSION_TTL_MINUTES: "120"
  CACHE_DICTIONARY_TTL_MINUTES: "240"

  # Security (strictest)
  SECURITY_PASSWORD_MIN_LENGTH: "12"
  SECURITY_LOGIN_MAX_FAILED_ATTEMPTS: "3"
  SECURITY_SESSION_TIMEOUT_MINUTES: "15"

  # Features
  SWAGGER_ENABLED: "false"
  CORS_ALLOWED_ORIGINS: "https://admin.company.com,https://portal.company.com,https://dev.company.com"

  # Flowable
  FLOWABLE_SCHEMA_UPDATE: "false"

  # Connection Pool (production optimized)
  DATASOURCE_MAX_POOL_SIZE: "50"
  DATASOURCE_MIN_IDLE: "10"
  DATASOURCE_CONNECTION_TIMEOUT: "30000"

  # File Upload
  FILE_UPLOAD_DIR: "/app/uploads"
  FILE_UPLOAD_BASE_URL: "/api/v1/upload/files"

  # N8N Configuration (non-sensitive)
  N8N_PORT: "5678"
  DB_TYPE: "postgresdb"
  DB_POSTGRESDB_HOST: "prod-postgres.internal"
  DB_POSTGRESDB_PORT: "5432"
  DB_POSTGRESDB_DATABASE: "n8n_prod"
  WEBHOOK_URL: "https://n8n.company.com"
  N8N_SERVICE_URL: "http://n8n-service:5678"
  N8N_RESTRICT_ENVIRONMENT_VARIABLES_ACCESS: "false"
  N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
