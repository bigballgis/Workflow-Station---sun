# Activepieces — PRODUCTION RUNTIME ONLY.
# Strategy: community edition + gateway shared account. In prod AP runs purely as a
# workflow runtime: the UI is NOT exposed (no shared-account login bridge here — that
# lives only in non-prod, see deploy/environments/dev). Istio exposes ONLY the webhook
# ingress path so external systems can trigger flows; the internal API is reached
# in-cluster via the ClusterIP Service (admin-center / workflow-engine -> activepieces-service:80).
#
# Replace __NAMESPACE__, __BASE_DOMAIN__, __IMAGE_TAG__ before applying.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: activepieces
  namespace: __NAMESPACE__
  labels:
    app: activepieces
    component: automation
    app.kubernetes.io/name: activepieces
    app.kubernetes.io/instance: activepieces
spec:
  replicas: 1
  selector:
    matchLabels:
      app: activepieces
  template:
    metadata:
      annotations:
        sidecar.istio.io/proxyCPU: 50m
        sidecar.istio.io/proxyCPULimit: 200m
        sidecar.istio.io/proxyMemory: 400Mi
        sidecar.istio.io/proxyMemoryLimit: 400Mi
        sidecar.istio.io/inject: "true"
        sidecar.istio.io/rewriteAppHTTPProbers: "true"
        proxy.istio.io/config: '{ "holdApplicationUntilProxyStarts": true }'
      labels:
        app: activepieces
        component: automation
        app.kubernetes.io/name: activepieces
        app.kubernetes.io/instance: activepieces
    spec:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      imagePullSecrets:
      - name: nexus3
      containers:
      - name: activepieces
        # HERMES vendored image: EE-removed + de-bunned Activepieces 0.84.0, built from the
        # in-repo source (activepieces/Dockerfile) — mirrors the dev compose activepieces
        # service. Replaces the upstream 0.84.0 image; must be pushed to this Nexus path at
        # the :0.84.0-ee-removed tag.
        # AIR-GAP (X-3): the allowlisted pieces (activepieces/hermes/pieces.json) are
        # PRE-INSTALLED by the image's last layer, so the runtime installer never reaches
        # a registry for them; ACTIVEPIECES_NPM_REGISTRY stays fail-closed as a backstop.
        # ⚠️ Not yet validated on a genuinely disconnected cluster — prod red line.
        # The designer half (piece_metadata rows) is NOT in the image: run
        # deploy/pieces/metadata/pieces-seed.sql against this environment's DB, then
        # restart AP (the piece registry is cached in-process).
        #image: nexus3.hk.hsbc:18080/hsbc-238092-cmbhase-bisp/workflow-station2/activepieces:__IMAGE_TAG__
        image: nexus3.hk.hsbc:18080/hsbc-238092-cmbhase-bisp/workflow-station2/activepieces:0.84.0-ee-removed
        imagePullPolicy: Always
        # >>> SANDBOX BASELINE — decision D6 (2026-07-23). Mirrors dev compose. <<<
        # See docs/ap-integration/DECISIONS.md#d6.
        # SYS_ADMIN is deliberately NOT requested (security policy forbids privilege
        # escalation; it also conflicts with Pod Security Standards `restricted`), which
        # rules out isolate(1) process sandboxing — hence SANDBOX_CODE_ONLY.
        # NET_ADMIN is granted for parity with dev but is INERT at this execution mode:
        # the iptables owner-uid egress chain only installs in isolate process modes.
        # ⚠️ Kernel-level egress control is therefore ABSENT. Compensating controls that
        # MUST be in place before this reaches production:
        #   C-1 — NetworkPolicy: default-deny egress for this pod, allow-list only
        #         Postgres / Redis / approved public APIs.
        #   C-3 — admin-center ServiceCallAuthenticationFilter must stop accepting a bare
        #         X-User-Id header (signed token or mTLS). This is the root-cause fix for
        #         P-1; C-1 is defence-in-depth and does NOT substitute for it.
        # Neither is implemented yet — see docs/ap-integration/OPEN_GATES.md (AG-05).
        securityContext:
          capabilities:
            add:
            - NET_ADMIN
        env:
        - name: AP_EXECUTION_MODE
          value: "SANDBOX_CODE_ONLY"
        - name: AP_NETWORK_MODE
          value: "STRICT"
        # <<< SANDBOX BASELINE (D6) >>>
        - name: AP_DB_TYPE
          value: "POSTGRES"
        - name: AP_POSTGRES_HOST
          valueFrom:
            configMapKeyRef:
              name: workflow-platform-config
              key: ACTIVEPIECES_POSTGRES_HOST
        - name: AP_POSTGRES_PORT
          valueFrom:
            configMapKeyRef:
              name: workflow-platform-config
              key: ACTIVEPIECES_POSTGRES_PORT
        - name: AP_POSTGRES_DATABASE
          valueFrom:
            configMapKeyRef:
              name: workflow-platform-config
              key: ACTIVEPIECES_POSTGRES_DATABASE
        - name: AP_POSTGRES_USERNAME
          valueFrom:
            configMapKeyRef:
              name: workflow-platform-config
              key: ACTIVEPIECES_POSTGRES_USERNAME
        - name: AP_POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: workflow-platform-secrets
              key: ACTIVEPIECES_POSTGRES_PASSWORD
        - name: AP_REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: workflow-platform-config
              key: ACTIVEPIECES_REDIS_HOST
        - name: AP_REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: workflow-platform-config
              key: ACTIVEPIECES_REDIS_PORT
        - name: AP_REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: workflow-platform-secrets
              key: ACTIVEPIECES_REDIS_PASSWORD
        - name: AP_ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: workflow-platform-secrets
              key: ACTIVEPIECES_ENCRYPTION_KEY
        - name: AP_JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: workflow-platform-secrets
              key: ACTIVEPIECES_JWT_SECRET
        # External base used to build webhook URLs (the only externally-reachable path).
        - name: AP_FRONTEND_URL
          valueFrom:
            configMapKeyRef:
              name: workflow-platform-config
              key: ACTIVEPIECES_FRONTEND_URL
        - name: AP_WEBHOOK_URL
          valueFrom:
            configMapKeyRef:
              name: workflow-platform-config
              key: ACTIVEPIECES_WEBHOOK_URL
        - name: AP_ENVIRONMENT
          value: "prod"
        - name: AP_TRIGGER_DEFAULT_POLL_INTERVAL
          value: "5"
        # Sync-webhook wait (AP default 30s → 204 No Content on slow flows). Kept at 300s for
        # long-running service-task flows. (AI Generate no longer runs on AP — since 2026-07-29
        # DW calls the group AI gateway directly, so this no longer pairs with a DW timeout.)
        - name: AP_WEBHOOK_TIMEOUT_SECONDS
          value: "300"
        # ---- Offline / no-external-download policy (IKP blocks external egress) ----
        # Piece catalog is served ONLY from the piece_metadata table; AP must never
        # sync/download pieces from cloud.activepieces.com or the public npm registry.
        # Pieces have to be provisioned internally (DB archive / internal registry).
        # NOTE: AP 0.84.0 has no AP_PIECES_SOURCE variable (verified by full-repo grep);
        # the offline switch that actually works is SYNC_MODE=NONE, which makes
        # piece-sync-service skip the cloud metadata sync (default OFFICIAL_AUTO
        # re-downloads piece metadata from cloud.activepieces.com into the DB).
        - name: AP_PIECES_SYNC_MODE
          value: "NONE"
        # No PostHog product telemetry.
        - name: AP_TELEMETRY_ENABLED
          value: "false"
        # No OAuth2 app credentials via Activepieces cloud.
        - name: AP_CLOUD_AUTH_ENABLED
          value: "false"
        # Runtime piece installs no longer use bun (X-4): piece-installer runs pnpm, which
        # honors NPM_CONFIG_REGISTRY exactly the same way (verified on pnpm 9.15.9), and an
        # empty value still means the PUBLIC npm registry — pnpm's own default. So the
        # configmap keeps a fail-closed .invalid URL. Do NOT "fix" it to the internal Nexus
        # while AP_PIECES_OFFLINE_INSTALL below is true: this value is then reached only on
        # an offline-store MISS, and a reachable registry turns that miss into a silent
        # online install instead of the loud failure the air-gap red line depends on.
        - name: NPM_CONFIG_REGISTRY
          valueFrom:
            configMapKeyRef:
              name: workflow-platform-config
              key: ACTIVEPIECES_NPM_REGISTRY
        # HERMES piece-admin P3 (X-3 air-gap): runtime piece installs resolve ONLY from
        # the pnpm offline store baked into the image (pieces-framework/-common/shared/
        # tslib closure — what build-piece pins into self-developed ARCHIVE tarballs).
        # REGISTRY whitelist pieces are prewarmed at image build and never install at
        # runtime; NPM_CONFIG_REGISTRY above stays fail-closed as the last-resort fence.
        - name: AP_PIECES_OFFLINE_INSTALL
          value: "true"
        # STRICT-mode egress proxy blocks every private IP, our own services included, so a
        # flow cannot fetch the uploaded file the engine hands it (FILE_SERVICE_BASE_URL).
        # IPs / CIDRs only — matched against RESOLVED addresses, a hostname never matches.
        # Empty = fail-closed; set ACTIVEPIECES_SSRF_ALLOW_LIST in the configmap per cluster.
        - name: AP_SSRF_ALLOW_LIST
          valueFrom:
            configMapKeyRef:
              name: workflow-platform-config
              key: ACTIVEPIECES_SSRF_ALLOW_LIST
        ports:
        - containerPort: 80
          name: http
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        readinessProbe:
          httpGet:
            path: /api/v1/flags
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /api/v1/flags
            port: 80
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        volumeMounts:
        - name: activepieces-data
          mountPath: /app/packages/server/data
      volumes:
      - name: activepieces-data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: activepieces-service
  namespace: __NAMESPACE__
  labels:
    app: activepieces
spec:
  selector:
    app: activepieces
  ports:
  - name: http
    protocol: TCP
    port: 80
    targetPort: 80
  type: ClusterIP
---
apiVersion: networking.istio.io/v1alpha3
kind: DestinationRule
metadata:
  name: activepieces-destination-rule
  namespace: __NAMESPACE__
spec:
  host: activepieces-service
  subsets:
  - name: v1
    labels:
      app: activepieces
---
apiVersion: networking.istio.io/v1beta1
kind: Sidecar
metadata:
  name: activepieces-sidecar
  namespace: __NAMESPACE__
spec:
  workloadSelector:
    labels:
      app: activepieces
  egress:
  - hosts:
    - ./*
    - istio-system/*
---
# Webhook-only ingress. ONLY /api/v1/webhooks is routed from outside so external
# systems can trigger flows. The UI (root) and the rest of the API are NOT matched
# here -> Istio returns 404 -> no public UI. Internal API stays in-cluster (ClusterIP).
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: activepieces-virtual-service
  namespace: __NAMESPACE__
spec:
  hosts:
  - activepieces.__BASE_DOMAIN__
  gateways:
  - activepieces-gateway
  http:
  - match:
    - uri:
        prefix: /api/v1/webhooks
    retries:
      attempts: 0
    route:
    - destination:
        host: activepieces-service
        subset: v1
        port:
          number: 80
    timeout: 120s
---
apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: activepieces-gateway
  namespace: __NAMESPACE__
spec:
  selector:
    istio: ingressgateway
  servers:
  - port:
      number: 80
      name: http
      protocol: HTTP
    hosts:
    - activepieces.__BASE_DOMAIN__
