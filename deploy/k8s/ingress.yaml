# =====================================================
# Ingress Configuration (single domain + multi path)
# =====================================================
# /admin/  -> admin-center-frontend-service
# /portal/ -> user-portal-frontend-service
# /login/  -> platform-login-frontend-service
# Note: developer-workstation (/dev/) is DEV-only and is NOT exposed here.
#       Use ingress-developer-workstation-optional.yaml if you need it.
#
# Browser calls to APIs typically go: frontend nginx -> Kong (deploy/k8s/deployment-kong.yaml)
# -> backend Services. This Ingress does not replace Kong; it exposes the SPAs.
#
# SSO: ConfigMap keys SSO_REDIRECT_* must use this host + paths /admin/sso/callback, /portal/sso/callback, /dev/sso/callback.
# CORS_ALLOWED_ORIGINS on backends should include https://<same host> when browsers use this ingress.
#
# Replace "__INGRESS_HOST__" with your actual domain (handled by deploy.ps1 -IngressHost).
# Namespace is replaced by deploy.ps1 based on -Environment flag.
# =====================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: workflow-platform-ingress
  namespace: workflow-platform-sit
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    # Uncomment for cert-manager:
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  # tls:
  # - hosts:
  #   - __INGRESS_HOST__
  #   secretName: workflow-platform-tls
  rules:
  - host: __INGRESS_HOST__
    http:
      paths:
      - path: /login
        pathType: Prefix
        backend:
          service:
            name: platform-login-frontend-service
            port:
              number: 80
      - path: /admin
        pathType: Prefix
        backend:
          service:
            name: admin-center-frontend-service
            port:
              number: 80
      - path: /portal
        pathType: Prefix
        backend:
          service:
            name: user-portal-frontend-service
            port:
              number: 80
