# Activepieces login-bridge gateway — NON-PROD ONLY (uat/sit).
# The k8s equivalent of dev's :8085 nginx-edge AP block: users reach the AP UI through
# this host; the shared-account login bridge mints an AP token into localStorage.
#
# Routing on hermes-workflow-activepieces.<BASE_DOMAIN>:
#   /__ap/bridge  -> admin-center  (serves the bridge HTML; ungated — auth carried by nonce)
#   /__ap/token   -> admin-center  (resolves the AP session from a one-time ?nonce=)
#   /             -> activepieces  (the AP app/API; AP self-protects with its own token)
#
# Cross-domain SSO handshake (方案 B): this AP host needs NO platform JWT cookie. The platform
# identity is validated on the ADMIN origin by admin-center's /launch (cookie valid there),
# which mints the AP session and a one-time nonce; the browser arrives here with #nonce=<票>
# in the fragment and the bridge exchanges it at /__ap/token. So admin and AP may live on
# DIFFERENT parent domains — no JWT_COOKIE_DOMAIN widening required. No Istio ext_authz needed:
# /__ap/token rejects an invalid/expired/used nonce (401); the bridge HTML carries no secret.
#
# EXCLUDED from the default deploy set (see apply-workflow-station-istio-generated.ps1);
# deploy to non-prod with -IncludeApBridgeGateway. PROD is runtime-only (webhooks via
# activepieces.yaml) and must NOT apply this manifest.
#
# Replace __NAMESPACE__, __BASE_DOMAIN__ before applying.
apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: hase-hermes-workflow-activepieces-gateway
  namespace: __NAMESPACE__
spec:
  selector:
    istio: ingressgateway
  servers:
  - port:
      number: 80
      name: http
      protocol: HTTP
    hosts:
    - hermes-workflow-activepieces.__BASE_DOMAIN__
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: hase-hermes-workflow-activepieces-virtual-service
  namespace: __NAMESPACE__
spec:
  hosts:
  - hermes-workflow-activepieces.__BASE_DOMAIN__
  gateways:
  - hase-hermes-workflow-activepieces-gateway
  http:
  # Bridge page: served by admin-center, rewritten from the gateway path.
  - match:
    - uri:
        exact: /__ap/bridge
    rewrite:
      uri: /api/v1/admin/internal/ap/bridge
    route:
    - destination:
        host: admin-center-service
        port:
          number: 8080
    timeout: 30s
  # Token endpoint: served by admin-center.
  - match:
    - uri:
        exact: /__ap/token
    rewrite:
      uri: /api/v1/admin/internal/ap/token
    route:
    - destination:
        host: admin-center-service
        port:
          number: 8080
    timeout: 30s
  # AP native credential sign-in/sign-up: terminated at the gateway.
  # Identity is "whoever acts, that's the identity": an AP session may only be minted by
  # admin-center via managed-authn for the current actor. AP's own
  # POST /api/v1/authentication/sign-{in,up} are public() endpoints, so without this rule
  # anyone holding a password on an AP identity could sign in here and bypass the platform
  # entirely. sign-up is already refused in the application layer (HERMES-PATCH-022);
  # sign-in is untouched upstream code, hence this gateway rule.
  #
  # Must be declared BEFORE the catch-all: Istio evaluates http rules in order and the
  # catch-all below has no match block, so it would swallow these paths.
  #
  # Not an IP allowlist: uat/preprod users sit on the corporate network, so their client
  # IPs are private too — allowing "internal" IPs would allow exactly the traffic we are
  # trying to stop. The real boundary is whether the caller traverses this gateway at all:
  # the migration/export scripts (deploy/scripts/ap-*.js) talk to activepieces-service:80
  # (ClusterIP, not exposed) via AP_INTERNAL_URL and never come through here.
  #
  # Only these two paths — /v1/authentication/switch-platform is still used by the AP SPA
  # (packages/web/src/lib/authentication-session.ts); blocking it would break live sessions.
  - match:
    - uri:
        exact: /api/v1/authentication/sign-in
    - uri:
        exact: /api/v1/authentication/sign-up
    directResponse:
      status: 404
      body:
        string: '{"message":"Not Found"}'
  # Everything else -> Activepieces (the app + its own /api). AP self-protects with the
  # localStorage token minted by the bridge; an un-platform-authed visitor just sees AP's
  # own login page, which can no longer submit (the endpoint above is terminated).
  - route:
    - destination:
        host: activepieces-service
        port:
          number: 80
    timeout: 120s
