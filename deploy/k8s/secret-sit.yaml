apiVersion: v1
kind: Secret
metadata:
  name: workflow-platform-secrets
  namespace: workflow-platform-sit
type: Opaque
stringData:
  # Database Credentials
  SPRING_DATASOURCE_USERNAME: "platform"
  SPRING_DATASOURCE_PASSWORD: "CHANGE_ME_SIT_DB_PASSWORD"
  
  # Redis Credentials
  SPRING_REDIS_PASSWORD: "CHANGE_ME_SIT_REDIS_PASSWORD"
  
  # JWT Secret (256-bit) - Generate: openssl rand -base64 32
  JWT_SECRET: "CHANGE_ME_SIT_JWT_SECRET_256_BIT_KEY"
  
  # Encryption Key (32 bytes) - Generate: openssl rand -base64 32 | cut -c1-32
  ENCRYPTION_SECRET_KEY: "CHANGE_ME_SIT_ENCRYPTION_KEY_32"

  # N8N Credentials
  DB_POSTGRESDB_USER: "CHANGE_ME_SIT_N8N_DB_USER"
  DB_POSTGRESDB_PASSWORD: "CHANGE_ME_SIT_N8N_DB_PASSWORD"
  # Generate: openssl rand -base64 32
  N8N_ENCRYPTION_KEY: "CHANGE_ME_SIT_N8N_ENCRYPTION_KEY"

  # Doubao (Volcengine) LLM API for N8N invoice recognition
  DOUBAO_MODEL_ID: "CHANGE_ME_SIT_DOUBAO_MODEL_ID"
  DOUBAO_API_KEY: "CHANGE_ME_SIT_DOUBAO_API_KEY"
