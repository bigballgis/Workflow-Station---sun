apiVersion: v1
kind: ConfigMap
metadata:
  name: workflow-platform-config
  namespace: workflow-platform-uat
data:
  # Spring Profile
  SPRING_PROFILES_ACTIVE: "uat"

  # Server Port
  SERVER_PORT: "8080"

  # Database (non-sensitive)
  SPRING_DATASOURCE_URL: "jdbc:postgresql://uat-postgres.internal:5432/workflow_platform_uat"

  # Redis (K8S internal service)
  SPRING_REDIS_HOST: "redis-service"
  SPRING_REDIS_PORT: "6379"

  # Kafka (K8S internal service)
  SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka-service:29092"

  # Service URLs (K8S Service names — used by both backends and frontend nginx)
  ADMIN_CENTER_URL: "http://admin-center-service:8080"
  WORKFLOW_ENGINE_URL: "http://workflow-engine-service:8080"
  DEVELOPER_WORKSTATION_URL: "http://developer-workstation-service:8080"
  USER_PORTAL_URL: "http://user-portal-service:8080"

  # JWT (non-sensitive)
  JWT_EXPIRATION: "43200000"
  JWT_REFRESH_EXPIRATION: "259200000"

  # Logging
  LOG_LEVEL_ROOT: "INFO"
  LOG_LEVEL_PLATFORM: "INFO"
  LOG_LEVEL_SQL: "WARN"

  # Cache (longer TTL for UAT)
  CACHE_USER_TTL_MINUTES: "45"
  CACHE_PERMISSION_TTL_MINUTES: "90"
  CACHE_DICTIONARY_TTL_MINUTES: "180"

  # Security (stricter)
  SECURITY_PASSWORD_MIN_LENGTH: "10"
  SECURITY_LOGIN_MAX_FAILED_ATTEMPTS: "3"
  SECURITY_SESSION_TIMEOUT_MINUTES: "30"

  # Features
  SWAGGER_ENABLED: "false"
  CORS_ALLOWED_ORIGINS: "https://uat-admin.company.com,https://uat-portal.company.com,https://uat-dev.company.com"

  # Flowable
  FLOWABLE_SCHEMA_UPDATE: "false"

  # File Upload
  FILE_UPLOAD_DIR: "/app/uploads"
  FILE_UPLOAD_BASE_URL: "/api/v1/upload/files"

  # N8N Configuration (non-sensitive)
  N8N_PORT: "5678"
  DB_TYPE: "postgresdb"
  DB_POSTGRESDB_HOST: "uat-postgres.internal"
  DB_POSTGRESDB_PORT: "5432"
  DB_POSTGRESDB_DATABASE: "n8n_uat"
  WEBHOOK_URL: "https://uat-n8n.company.com"
  N8N_SERVICE_URL: "http://n8n-service:5678"
  N8N_RESTRICT_ENVIRONMENT_VARIABLES_ACCESS: "false"
  N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
