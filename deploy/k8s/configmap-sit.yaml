apiVersion: v1
kind: ConfigMap
metadata:
  name: workflow-platform-config
  namespace: workflow-platform-sit
data:
  # Spring Profile
  SPRING_PROFILES_ACTIVE: "sit"

  # Server Port (unified to 8080 inside K8S)
  SERVER_PORT: "8080"

  # Database (non-sensitive — credentials in Secret)
  SPRING_DATASOURCE_URL: "jdbc:postgresql://sit-postgres.internal:5432/workflow_platform_sit"

  # Redis (K8S internal service)
  SPRING_REDIS_HOST: "redis-service"
  SPRING_REDIS_PORT: "6379"

  # Kafka (K8S internal service)
  SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka-service:29092"

  # Service URLs (K8S Service names — used by both backends and frontend nginx)
  ADMIN_CENTER_URL: "http://admin-center-service:8080"
  WORKFLOW_ENGINE_URL: "http://workflow-engine-service:8080"
  DEVELOPER_WORKSTATION_URL: "http://developer-workstation-service:8080"
  USER_PORTAL_URL: "http://user-portal-service:8080"
  KONG_PROXY_URL: "http://kong-service:8000"

  # Ingress (single domain + multi path)
  INGRESS_HOST: "workflow-sit.your-domain.com"

  # SSO — redirect URI prefixes must match browser URL + Vite base (see ingress paths /admin /portal /dev)
  SSO_REDIRECT_ADMIN_PREFIX: "https://workflow-sit.your-domain.com/admin/sso/callback"
  SSO_REDIRECT_PORTAL_PREFIX: "https://workflow-sit.your-domain.com/portal/sso/callback"
  SSO_REDIRECT_DW_PREFIX: "https://workflow-sit.your-domain.com/dev/sso/callback"

  # JWT (non-sensitive parts)
  JWT_EXPIRATION: "86400000"
  JWT_REFRESH_EXPIRATION: "604800000"

  # Logging
  LOG_LEVEL_ROOT: "INFO"
  LOG_LEVEL_PLATFORM: "INFO"
  LOG_LEVEL_SQL: "WARN"

  # Cache
  CACHE_USER_TTL_MINUTES: "30"
  CACHE_PERMISSION_TTL_MINUTES: "60"
  CACHE_DICTIONARY_TTL_MINUTES: "120"

  # Security
  SECURITY_PASSWORD_MIN_LENGTH: "8"
  SECURITY_LOGIN_MAX_FAILED_ATTEMPTS: "5"
  SECURITY_SESSION_TIMEOUT_MINUTES: "30"

  # Features
  SWAGGER_ENABLED: "true"
  # 与 INGRESS_HOST 单域多路径一致时浏览器源为该 https 主机；后者为旧版子域部署可选保留
  CORS_ALLOWED_ORIGINS: "https://workflow-sit.your-domain.com,https://sit-admin.company.com,https://sit-portal.company.com,https://sit-dev.company.com"

  # Flowable
  FLOWABLE_SCHEMA_UPDATE: "true"

  # File Upload
  FILE_UPLOAD_DIR: "/app/uploads"
  FILE_UPLOAD_BASE_URL: "/api/v1/upload/files"

  # N8N Configuration (non-sensitive)
  N8N_PORT: "5678"
  DB_TYPE: "postgresdb"
  DB_POSTGRESDB_HOST: "sit-postgres.internal"
  DB_POSTGRESDB_PORT: "5432"
  DB_POSTGRESDB_DATABASE: "n8n_sit"
  WEBHOOK_URL: "https://sit-n8n.company.com"
  N8N_SERVICE_URL: "http://n8n-service:5678"
  N8N_RESTRICT_ENVIRONMENT_VARIABLES_ACCESS: "false"
  N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
