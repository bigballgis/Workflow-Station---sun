# =====================================================
# Development Environment - Docker Compose
# =====================================================
# Local Docker Desktop only. Infrastructure (PG, Redis) runs locally.
# SIT/UAT/PROD use company K8S — see deploy/k8s/
#
# IMPORTANT: All images use "local build + copy" approach.
# Docker multi-stage builds are NOT used due to local Docker limitations.
# You MUST build artifacts locally before running docker compose:
#
# Backend (requires Maven):
#   mvn clean package -DskipTests -pl backend/workflow-engine-core,backend/admin-center,backend/user-portal,backend/developer-workstation -am
#
# Frontend (requires Node.js):
#   cd frontend/admin-center && npm run build
#   cd frontend/user-portal && npm run build
#   cd frontend/developer-workstation && npm run build
#
# Then start:
#   docker compose -f docker-compose.dev.yml --env-file .env up -d --build
# =====================================================

services:
  # ==================== Infrastructure ====================

  # PostgreSQL Database
  postgres:
    image: postgres:16.5-alpine
    container_name: platform-postgres-dev
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ../../../deploy/init-scripts:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - platform-dev-network

  # Redis Cache
  redis:
    image: redis:7.2-alpine
    container_name: platform-redis-dev
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - platform-dev-network

  # Kafka (KRaft mode - no ZooKeeper needed)
  kafka:
    image: confluentinc/cp-kafka:7.5.3
    container_name: platform-kafka-dev
    ports:
      - "${KAFKA_PORT}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:29092 > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - platform-dev-network

  # N8N Automation Engine
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: platform-n8n-dev
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${N8N_DB_NAME:-n8n_dev}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-postgres}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5678}
      N8N_PORT: 5678
      N8N_RESTRICT_ENVIRONMENT_VARIABLES_ACCESS: "false"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      DOUBAO_MODEL_ID: ${DOUBAO_MODEL_ID:-doubao-1-5-vision-pro-32k-250115}
      DOUBAO_API_KEY: ${DOUBAO_API_KEY:-your-doubao-api-key-here}
    volumes:
      - n8n_data:/home/node/.n8n
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5678/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - platform-dev-network
    restart: unless-stopped

  # ==================== Backend Services ====================

  # Workflow Engine Core
  workflow-engine:
    build:
      context: ../../../backend/workflow-engine-core
      dockerfile: Dockerfile
    container_name: platform-workflow-engine-dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${WORKFLOW_ENGINE_PORT}:8080"
    environment:
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PASSWORD: ${REDIS_PASSWORD}
      ADMIN_CENTER_URL: http://admin-center:8080
      USER_PORTAL_URL: http://user-portal:8080
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION}
      ENCRYPTION_SECRET_KEY: ${ENCRYPTION_SECRET_KEY}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
    volumes:
      - ./logs:/app/logs
    networks:
      - platform-dev-network
    restart: unless-stopped

  # Admin Center Backend
  admin-center:
    build:
      context: ../../../backend/admin-center
      dockerfile: Dockerfile
    container_name: platform-admin-center-dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      workflow-engine:
        condition: service_healthy
    ports:
      - "${ADMIN_CENTER_PORT}:8080"
    environment:
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PASSWORD: ${REDIS_PASSWORD}
      WORKFLOW_ENGINE_URL: http://workflow-engine:8080
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION}
      ENCRYPTION_SECRET_KEY: ${ENCRYPTION_SECRET_KEY}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
    volumes:
      - ./logs:/app/logs
    networks:
      - platform-dev-network
    restart: unless-stopped

  # User Portal Backend
  user-portal:
    build:
      context: ../../../backend/user-portal
      dockerfile: Dockerfile
    container_name: platform-user-portal-dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      workflow-engine:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "${USER_PORTAL_PORT}:8080"
    environment:
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PASSWORD: ${REDIS_PASSWORD}
      ADMIN_CENTER_URL: http://admin-center:8080
      WORKFLOW_ENGINE_URL: http://workflow-engine:8080
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION}
      ENCRYPTION_SECRET_KEY: ${ENCRYPTION_SECRET_KEY}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
      SPRING_FLYWAY_ENABLED: false
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    volumes:
      - ./logs:/app/logs
    networks:
      - platform-dev-network
    restart: unless-stopped

  # Developer Workstation Backend
  developer-workstation:
    build:
      context: ../../../backend/developer-workstation
      dockerfile: Dockerfile
    container_name: platform-developer-workstation-dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      workflow-engine:
        condition: service_healthy
    ports:
      - "${DEVELOPER_WORKSTATION_PORT}:8080"
    environment:
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PASSWORD: ${REDIS_PASSWORD}
      ADMIN_CENTER_URL: http://admin-center:8080
      WORKFLOW_ENGINE_URL: http://workflow-engine:8080
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION}
      ENCRYPTION_SECRET_KEY: ${ENCRYPTION_SECRET_KEY}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
      SPRING_FLYWAY_ENABLED: false
      FILE_UPLOAD_DIR: /app/uploads
      FILE_UPLOAD_BASE_URL: /api/v1/upload/files
    volumes:
      - ./logs:/app/logs
      - developer_workstation_uploads:/app/uploads
    networks:
      - platform-dev-network
    restart: unless-stopped

  # ==================== Frontend Services ====================
  # Uses Dockerfile.local — requires pre-built dist/ in each frontend project.
  # Build steps before docker compose up:
  #   1. cd frontend/admin-center && npm run build
  #   2. cd frontend/user-portal && npm run build
  #   3. cd frontend/developer-workstation && npm run build

  admin-center-frontend:
    build:
      context: ../../../frontend/admin-center
      dockerfile: Dockerfile.local
    image: dev-admin-center-frontend
    container_name: platform-admin-center-frontend-dev
    depends_on:
      - admin-center
    ports:
      - "${ADMIN_CENTER_FRONTEND_PORT}:80"
    environment:
      ADMIN_CENTER_URL: http://admin-center:8080
    networks:
      - platform-dev-network
    restart: unless-stopped

  user-portal-frontend:
    build:
      context: ../../../frontend/user-portal
      dockerfile: Dockerfile.local
    image: dev-user-portal-frontend
    container_name: platform-user-portal-frontend-dev
    depends_on:
      - user-portal
    ports:
      - "${USER_PORTAL_FRONTEND_PORT}:80"
    environment:
      USER_PORTAL_URL: http://user-portal:8080
      ADMIN_CENTER_URL: http://admin-center:8080
      DEVELOPER_WORKSTATION_URL: http://developer-workstation:8080
    networks:
      - platform-dev-network
    restart: unless-stopped

  developer-workstation-frontend:
    build:
      context: ../../../frontend/developer-workstation
      dockerfile: Dockerfile.local
    image: dev-developer-workstation-frontend
    container_name: platform-developer-workstation-frontend-dev
    depends_on:
      - developer-workstation
    ports:
      - "${DEVELOPER_WORKSTATION_FRONTEND_PORT}:80"
    environment:
      DEVELOPER_WORKSTATION_URL: http://developer-workstation:8080
      ADMIN_CENTER_URL: http://admin-center:8080
    networks:
      - platform-dev-network
    restart: unless-stopped

volumes:
  postgres_dev_data:
  redis_dev_data:
  developer_workstation_uploads:
  n8n_data:

networks:
  platform-dev-network:
    driver: bridge
    name: platform-dev-network
