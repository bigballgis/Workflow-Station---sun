map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Docker embedded DNS: re-resolve service names when frontend containers are recreated (new IPs).
# Without `resolve`, edge can proxy /portal/ to a stale IP (often login nginx) → 404.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream kong_upstream {
    zone kong_upstream 64k;
    server kong:8000 resolve;
}

upstream login_fe_upstream {
    zone login_fe_upstream 64k;
    server platform-login-frontend:80 resolve;
}

upstream admin_fe_upstream {
    zone admin_fe_upstream 64k;
    server admin-center-frontend:80 resolve;
}

upstream portal_fe_upstream {
    zone portal_fe_upstream 64k;
    server user-portal-frontend:80 resolve;
}

upstream dw_fe_upstream {
    zone dw_fe_upstream 64k;
    server developer-workstation-frontend:80 resolve;
}

upstream help_fe_upstream {
    zone help_fe_upstream 64k;
    server platform-help-frontend:80 resolve;
}

upstream superset_upstream {
    zone superset_upstream 64k;
    server superset-final:8088 resolve;
}

upstream activepieces_upstream {
    zone activepieces_upstream 64k;
    server activepieces:80 resolve;
}

# admin-center API, reached directly (bypass Kong) for the Superset auth_request subrequest.
upstream admin_center_api_upstream {
    zone admin_center_api_upstream 64k;
    server admin-center:8080 resolve;
}

server {
    listen 80;
    server_name localhost;

    client_max_body_size 50M;

    # HSTS: production TLS only; dev edge is HTTP — leave empty (no policy value).
    set $hsts_sts_header "";
    add_header Strict-Transport-Security $hsts_sts_header always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Unified API entry (same origin as SPAs)
    location ^~ /api/ {
        proxy_pass http://kong_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    # Activepieces local CDN mirror (air-gapped replacement for cdn.activepieces.com).
    # Served by the AP container out of its own publicDir; referenced as ROOT-absolute
    # `/ap-cdn/...` both by the build-time rewrite (HERMES-PATCH-009) and by piece
    # metadata logoUrl. The DW-embedded builder is a Vite lib-mode bundle (no publicDir)
    # living on THIS origin, so without this route every piece icon in the Automation
    # tab 404s into a gray placeholder. Via Kong (`activepieces-cdn-route`) rather than
    # activepieces_upstream directly, so the route is defined once and DW's own nginx
    # (:3102, KONG_PROXY_URL-only) reuses it.
    location ^~ /ap-cdn/ {
        proxy_pass http://kong_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Canonical trailing slashes (SPA base paths use .../)
    location = /portal { return 308 /portal/; }
    location = /login { return 308 /login/; }
    location = /admin { return 308 /admin/; }
    location = /dev { return 308 /dev/; }
    location = /help { return 308 /help/; }
    # Legacy DW-only formula help URL → environment-independent Guidelines portal
    location = /dev/help/computed-fields {
        absolute_redirect off;
        return 302 /help/computed-fields;
    }
    # ---- Superset BI under /bi/ (single FQDN + path, same model as /admin /portal /dev) ----
    # Superset is a third-party app that emits root-absolute URLs (/static, /login),
    # which would collide with kong's /api on this shared origin. So
    # we strip the /bi prefix before forwarding and send X-Forwarded-Prefix: /bi;
    # Superset's ProxyFix (SUPERSET_APP_ROOT=/bi) then re-adds the prefix to every
    # redirect / url_for / static asset. Auth model: gate ONLY /bi/login/ (inject the
    # validated X-Remote-* for REMOTE_USER SSO); every other path passes ungated so
    # guest-token EMBED traffic (portal iframe -> /bi/embedded, /bi/api) works without
    # a platform JWT, while authenticated authors ride their Superset session cookie.
    # Legacy / full-page-fallback Superset root-absolute links -> under /bi (preserve path).
    # absolute_redirect off -> relative Location keeps the browser's host:port (:3000).
    location = /superset  { absolute_redirect off; return 302 /bi/superset/welcome/; }
    location ^~ /superset/ { absolute_redirect off; return 302 /bi$request_uri; }

    # Superset's top-left logo image is emitted as a bare /static path (theme default
    # brandLogoUrl, not app-root-aware) which would otherwise 404 on this shared origin.
    # Exact-match (highest priority) -> serve it from /bi/static. Superset's other
    # assets are already /bi-prefixed; this is the one stray bare path.
    location = /static/assets/images/superset-logo-horiz.png {
        absolute_redirect off; return 302 /bi/static/assets/images/superset-logo-horiz.png;
    }
    # absolute_redirect off -> emit a relative Location (/bi/) so the browser keeps
    # its host:port (:3000); otherwise nginx rebuilds an absolute URL and drops the port.
    location = /bi { absolute_redirect off; return 308 /bi/; }

    # auth_request subrequest -> admin-center authorize endpoint (bypasses Kong).
    # Validates the JWT cookie: 200 + X-Remote-* / 401 (no JWT) / 403 (no BI mapping).
    location = /_superset_authz {
        internal;
        proxy_pass http://admin_center_api_upstream/api/v1/admin/internal/bi/superset/authorize;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Cookie $http_cookie;   # forward JWT cookie to the filter
        # Strip Origin: internal server-to-server call. Forwarding the browser Origin
        # (e.g. a Superset telemetry POST) trips admin-center's CORS filter (403).
        proxy_set_header Origin "";
    }

    # Author login entrypoint: JWT-gated, injects trusted identity for REMOTE_USER SSO.
    # Longest-prefix match beats the generic ^~ /bi/ below for /bi/login/*.
    location ^~ /bi/login/ {
        auth_request /_superset_authz;
        auth_request_set $sx_user  $upstream_http_x_remote_user;
        auth_request_set $sx_roles $upstream_http_x_remote_roles;
        auth_request_set $sx_email $upstream_http_x_remote_email;
        auth_request_set $sx_first $upstream_http_x_remote_firstname;

        # Inject trusted identity; these OVERRIDE any client-forged X-Remote-* headers.
        proxy_set_header X-Remote-User      $sx_user;
        proxy_set_header X-Remote-Roles     $sx_roles;
        proxy_set_header X-Remote-Email     $sx_email;
        proxy_set_header X-Remote-Firstname $sx_first;
        proxy_set_header X-Remote-Lastname  "";

        # Superset natively serves under APPLICATION_ROOT=/bi (SUPERSET_APP_ROOT env),
        # so forward /bi/* UNCHANGED — no prefix stripping, no X-Forwarded-Prefix.
        proxy_pass http://superset_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 600s;

        error_page 401 = @superset_login;
        error_page 403 = @superset_forbidden;
    }

    # Everything else under /bi/: ungated (guest-token embed + authenticated author
    # session cookie). Strip client-forged X-Remote-* so this open path can never
    # establish an author session without passing through the gated /bi/login/.
    location ^~ /bi/ {
        proxy_set_header X-Remote-User      "";
        proxy_set_header X-Remote-Roles     "";
        proxy_set_header X-Remote-Email     "";
        proxy_set_header X-Remote-Firstname "";
        proxy_set_header X-Remote-Lastname  "";

        # Forward /bi/* UNCHANGED — Superset serves natively under APPLICATION_ROOT=/bi.
        proxy_pass http://superset_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    # Unified Login SPA
    location ^~ /login/ {
        proxy_pass http://login_fe_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Guidelines portal (no login; shared by DW / Admin / Portal)
    location ^~ /help/ {
        proxy_pass http://help_fe_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Admin Center SPA
    location ^~ /admin/ {
        proxy_pass http://admin_fe_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # User Portal SPA
    location ^~ /portal/ {
        proxy_pass http://portal_fe_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Developer Workstation SPA (DEV only)
    location ^~ /dev/ {
        proxy_pass http://dw_fe_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Unauthenticated Superset author -> unified login WITH SSO params (admin client
    # sets the ac_access_token cookie the authorize endpoint reads). state=superset-author
    # makes SsoCallback bounce back into /bi/ after login.
    location @superset_login {
        return 302 "http://localhost:3000/login/?client_id=admin&redirect_uri=http://localhost:3000/admin/sso/callback&state=superset-author";
    }
    location @superset_forbidden {
        default_type text/plain;
        return 403 "No Superset access: your account has no BI role mapping.\n";
    }

    # Default: hard 404 for bare root — EXCEPT the Superset logo click. Superset 6.0
    # renders its top-left logo as <a href="/"> (theme default brandLogoHref, which is
    # NOT app-root-aware and can't be reliably overridden — legacy HSBC THEME_OVERRIDES /
    # DB themes win). Route that one case (referer under /bi) to Superset's home so the
    # logo works; genuine bare-root hits still 404 (the platform has no root app).
    location = / {
        absolute_redirect off;   # relative Location keeps the browser's :3000
        if ($http_referer ~ "/bi(/|$)") { return 302 /bi/superset/welcome/; }
        return 404;
    }
}

# =============================================================================
# Activepieces gateway (DEV / non-prod) — community edition + shared-account SSO.
# AP stores its JWT in localStorage (not a cookie), so a server-side cookie inject
# can't log the browser in — we use a CLIENT bridge instead:
#
#   browser -> :8085  (auth_request validates the platform JWT cookie)
#     no platform JWT      -> 302 to the unified login
#     launcher entry point -> /__ap/bridge : a gated HTML page whose JS fetches a
#       shared-account AP token from /__ap/token, writes localStorage['token'],
#       then bounces to :8085/ where AP loads already authenticated (shared ADMIN).
#
# Served at ROOT (not a /activepieces/ subpath) because AP's own /api + /assets
# would collide with kong on :3000. The bridge endpoints use a /__ap/ prefix
# to avoid clashing with AP's own /api. Prod runs AP as runtime only (no UI): this
# gateway and the bridge endpoints (activepieces.bridge.enabled=false -> 404) do
# not exist there.
# =============================================================================
server {
    listen 8085;
    server_name localhost;
    client_max_body_size 50M;

    # auth_request subrequest -> admin-center AP authz. Validates the platform JWT
    # cookie: 200 (valid) / 401 (none) / 404 (bridge disabled). Internal-only.
    location = /__ap/authz {
        internal;
        proxy_pass http://admin_center_api_upstream/api/v1/admin/internal/ap/authz;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Cookie $http_cookie;   # forward JWT cookie to the filter
        # Strip Origin: internal server-to-server call; forwarding the browser Origin
        # would trip admin-center's CORS filter (403) and deny the whole request.
        proxy_set_header Origin "";
    }

    # Login bridge page (launcher links here). Served by admin-center (single source,
    # shared with non-prod k8s). Gated; JS mints the AP token and redirects into AP.
    # Unauthenticated -> bounce to the unified login.
    location = /__ap/bridge {
        auth_request /__ap/authz;
        error_page 401 = @ap_login;
        proxy_pass http://admin_center_api_upstream/api/v1/admin/internal/ap/bridge;
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Origin "";
    }

    # Shared-account token endpoint (gated). Returns {data:{token}}; the bridge JS
    # stores it in localStorage['token'].
    location = /__ap/token {
        auth_request /__ap/authz;
        error_page 401 = @ap_login;
        proxy_pass http://admin_center_api_upstream/api/v1/admin/internal/ap/token;
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Origin "";
    }

    # AP's native sign-in is a dead end under shared-account SSO (no local password
    # to type). Full-page hits on it (typed URL / reload) bounce to the bridge, which
    # re-mints the AP token silently when the platform cookie is present and otherwise
    # 302s to the unified login via its auth_request gate. Only catches server hits:
    # the SPA's client-side <Navigate> to /sign-in never reaches nginx. dev-only —
    # k8s ap-gateway's bridge is nonce-gated cross-domain, where a nonce-less bridge
    # visit is itself a dead end, so this redirect must NOT be synced there.
    location = /sign-in {
        return 302 /__ap/bridge;
    }

    # 上面那条只挡"页面"，不挡登录表单实际打的 API。AP 的
    # POST /api/v1/authentication/sign-{in,up} 是 public() 端点，本 server 是 AP 的
    # 浏览器唯一入口，故在此终止 —— 否则任何在 AP 库里有口令的身份都能绕过平台直接
    # 换到 AP token（身份模型要求一切会话经 managed-authn 按操作人换取）。
    # 与 Kong 的 activepieces-authn-block-route 同一处置，两个网关都要堵：
    # 本 server 直连 activepieces_upstream，不经 Kong。
    # 迁移/导出脚本不受影响：它们走 AP_INTERNAL_URL 直连容器，不经本网关。
    # 只封这两条 —— /v1/authentication/switch-platform 仍被 AP SPA 使用。
    location ~ ^/api/v1/authentication/sign-(in|up)$ {
        return 404;
    }

    # Everything else -> Activepieces, proxied WITHOUT the platform-JWT gate.
    # Why not gated: AP's own SPA calls its API (/api/v1/*) with the AP token in the
    # Authorization header and does NOT send the platform cookie, so a platform
    # auth_request here 401s those XHRs -> 302 to login -> blank app. AP self-protects
    # (its API requires the AP token), and the ONLY way to mint that token is the gated
    # bridge below. So an un-platform-authed visitor to / just sees AP's own login (no
    # token, harmless); platform gating lives on /__ap/bridge + /__ap/token only.
    location / {
        proxy_pass http://activepieces_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    # Unauthenticated -> unified login WITH SSO params (admin client sets the
    # ac_access_token cookie the AP authz endpoint reads). state=ap-bridge so the
    # callback can route back to the AP bridge.
    location @ap_login {
        return 302 "http://localhost:3000/login/?client_id=admin&redirect_uri=http://localhost:3000/admin/sso/callback&state=ap-bridge";
    }
}
