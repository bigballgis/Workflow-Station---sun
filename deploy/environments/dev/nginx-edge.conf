map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name localhost;

    # Docker Compose recreates containers with new IPs; static upstream hostnames are cached at
    # config load. Resolver + variables forces runtime DNS so /login/ healthcheck stays valid.
    resolver 127.0.0.11 valid=10s ipv6=off;

    client_max_body_size 50M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Unified API entry (same origin as SPAs)
    location ^~ /api/ {
        set $kong_upstream kong;
        proxy_pass http://$kong_upstream:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    # Canonical trailing slashes (SPA base paths use .../)
    location = /portal { return 308 /portal/; }
    location = /login { return 308 /login/; }
    location = /admin { return 308 /admin/; }
    location = /dev { return 308 /dev/; }

    # Unified Login SPA
    location ^~ /login/ {
        set $login_upstream platform-login-frontend;
        proxy_pass http://$login_upstream:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Admin Center SPA
    location ^~ /admin/ {
        set $admin_fe_upstream admin-center-frontend;
        proxy_pass http://$admin_fe_upstream:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # User Portal SPA
    location ^~ /portal/ {
        set $portal_fe_upstream user-portal-frontend;
        proxy_pass http://$portal_fe_upstream:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Developer Workstation SPA (DEV only)
    location ^~ /dev/ {
        set $dw_fe_upstream developer-workstation-frontend;
        proxy_pass http://$dw_fe_upstream:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Default: hard 404 (avoid nginx default file lookup)
    location = / {
        return 404;
    }
}

