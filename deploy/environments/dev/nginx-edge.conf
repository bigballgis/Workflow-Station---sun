map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Docker embedded DNS: re-resolve service names when frontend containers are recreated (new IPs).
# Without `resolve`, edge can proxy /portal/ to a stale IP (often login nginx) → 404.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream kong_upstream {
    zone kong_upstream 64k;
    server kong:8000 resolve;
}

upstream login_fe_upstream {
    zone login_fe_upstream 64k;
    server platform-login-frontend:80 resolve;
}

upstream admin_fe_upstream {
    zone admin_fe_upstream 64k;
    server admin-center-frontend:80 resolve;
}

upstream portal_fe_upstream {
    zone portal_fe_upstream 64k;
    server user-portal-frontend:80 resolve;
}

upstream dw_fe_upstream {
    zone dw_fe_upstream 64k;
    server developer-workstation-frontend:80 resolve;
}

upstream kestra_upstream {
    zone kestra_upstream 64k;
    server kestra:8080 resolve;
}

upstream n8n_upstream {
    zone n8n_upstream 64k;
    server n8n:5678 resolve;
}

server {
    listen 80;
    server_name localhost;

    client_max_body_size 50M;

    # HSTS: production TLS only; dev edge is HTTP — leave empty (no policy value).
    set $hsts_sts_header "";
    add_header Strict-Transport-Security $hsts_sts_header always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Unified API entry (same origin as SPAs)
    location ^~ /api/ {
        proxy_pass http://kong_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    # Canonical trailing slashes (SPA base paths use .../)
    location = /portal { return 308 /portal/; }
    location = /login { return 308 /login/; }
    location = /admin { return 308 /admin/; }
    location = /dev { return 308 /dev/; }
    location = /n8n { return 308 /n8n/; }
    # Superset runs on :8088 (shares /login/ and /api/ with platform on :3000 — no full subpath proxy).
    location = /superset { return 302 http://localhost:8088/superset/welcome/; }
    location = /superset/ { return 302 http://localhost:8088/superset/welcome/; }
    location ^~ /superset/ { return 302 http://localhost:8088$request_uri; }

    # N8N (DEV): n8n runs at container root; strip /n8n/ prefix. Do NOT set N8N_PATH (breaks /n8nassets MIME).
    # Use $http_host (not $host): $host drops the port; WebSocket origin check then fails
    # (Origin localhost:3000 vs expected localhost) and the editor only partially loads.
    location ^~ /n8n/ {
        rewrite ^/n8n/?(.*)$ /$1 break;
        proxy_pass http://n8n_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        # n8n still emits BASE_PATH=/; fix editor + static tags for subpath
        proxy_set_header Accept-Encoding "";
        sub_filter_once off;
        sub_filter_types text/html text/javascript application/javascript application/json text/css;
        sub_filter "window.BASE_PATH = '/'" "window.BASE_PATH = '/n8n/'";
        sub_filter 'href="/assets/' 'href="/n8n/assets/';
        sub_filter 'src="/assets/' 'src="/n8n/assets/';
        sub_filter 'href="/static/' 'href="/n8n/static/';
        sub_filter 'src="/static/' 'src="/n8n/static/';
        sub_filter 'href="/favicon' 'href="/n8n/favicon';
        sub_filter '"/rest/' '"/n8n/rest/';
        sub_filter '"/assets/' '"/n8n/assets/';
    }

    # n8n dynamic imports / API still use root-absolute paths (DEV edge only; no other service uses these)
    location ^~ /rest/ {
        proxy_pass http://n8n_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    location ^~ /assets/ {
        proxy_pass http://n8n_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    location ^~ /static/ {
        proxy_pass http://n8n_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }


    # Kestra — path-based routing via edge
    location = /kestra { return 308 /kestra/; }
    location ^~ /kestra/ {
        proxy_pass http://kestra_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        sub_filter_once off;
        sub_filter_types text/html text/javascript application/javascript text/css;
        sub_filter 'src="/' 'src="/kestra/';
        sub_filter 'href="/' 'href="/kestra/';
    }

    # Unified Login SPA
    location ^~ /login/ {
        proxy_pass http://login_fe_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Admin Center SPA
    location ^~ /admin/ {
        proxy_pass http://admin_fe_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # User Portal SPA
    location ^~ /portal/ {
        proxy_pass http://portal_fe_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Developer Workstation SPA (DEV only)
    location ^~ /dev/ {
        proxy_pass http://dw_fe_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Default: hard 404 (avoid nginx default file lookup)
    location = / {
        return 404;
    }
}
