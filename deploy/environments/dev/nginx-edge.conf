map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name localhost;

    # Docker Compose recreates containers with new IPs; static upstream hostnames are cached at
    # config load. Resolver + variables forces runtime DNS so /login/ healthcheck stays valid.
    resolver 127.0.0.11 valid=10s ipv6=off;

    client_max_body_size 50M;

    # HSTS: production TLS only; dev edge is HTTP — leave empty (no policy value).
    set $hsts_sts_header "";
    add_header Strict-Transport-Security $hsts_sts_header always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Unified API entry (same origin as SPAs)
    location ^~ /api/ {
        set $kong_upstream kong;
        proxy_pass http://$kong_upstream:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    # Canonical trailing slashes (SPA base paths use .../)
    location = /portal { return 308 /portal/; }
    location = /login { return 308 /login/; }
    location = /admin { return 308 /admin/; }
    location = /dev { return 308 /dev/; }
    location = /n8n { return 308 /n8n/; }

    # N8N (DEV): n8n runs at container root; strip /n8n/ prefix. Do NOT set N8N_PATH (breaks /n8nassets MIME).
    # Use $http_host (not $host): $host drops the port; WebSocket origin check then fails
    # (Origin localhost:3000 vs expected localhost) and the editor only partially loads.
    location ^~ /n8n/ {
        set $n8n_upstream n8n;
        rewrite ^/n8n/?(.*)$ /$1 break;
        proxy_pass http://$n8n_upstream:5678;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        # n8n still emits BASE_PATH=/; fix editor + static tags for subpath
        proxy_set_header Accept-Encoding "";
        sub_filter_once off;
        sub_filter_types text/html text/javascript application/javascript application/json text/css;
        sub_filter "window.BASE_PATH = '/'" "window.BASE_PATH = '/n8n/'";
        sub_filter 'href="/assets/' 'href="/n8n/assets/';
        sub_filter 'src="/assets/' 'src="/n8n/assets/';
        sub_filter 'href="/static/' 'href="/n8n/static/';
        sub_filter 'src="/static/' 'src="/n8n/static/';
        sub_filter 'href="/favicon' 'href="/n8n/favicon';
        sub_filter '"/rest/' '"/n8n/rest/';
        sub_filter '"/assets/' '"/n8n/assets/';
    }

    # n8n dynamic imports / API still use root-absolute paths (DEV edge only; no other service uses these)
    location ^~ /rest/ {
        set $n8n_upstream n8n;
        proxy_pass http://$n8n_upstream:5678;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    location ^~ /assets/ {
        set $n8n_upstream n8n;
        proxy_pass http://$n8n_upstream:5678;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    location ^~ /static/ {
        set $n8n_upstream n8n;
        proxy_pass http://$n8n_upstream:5678;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    # Unified Login SPA
    location ^~ /login/ {
        set $login_upstream platform-login-frontend;
        proxy_pass http://$login_upstream:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Admin Center SPA
    location ^~ /admin/ {
        set $admin_fe_upstream admin-center-frontend;
        proxy_pass http://$admin_fe_upstream:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # User Portal SPA
    location ^~ /portal/ {
        set $portal_fe_upstream user-portal-frontend;
        proxy_pass http://$portal_fe_upstream:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Developer Workstation SPA (DEV only)
    location ^~ /dev/ {
        set $dw_fe_upstream developer-workstation-frontend;
        proxy_pass http://$dw_fe_upstream:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Default: hard 404 (avoid nginx default file lookup)
    location = / {
        return 404;
    }
}

