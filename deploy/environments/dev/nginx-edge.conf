map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Docker embedded DNS: re-resolve service names when frontend containers are recreated (new IPs).
# Without `resolve`, edge can proxy /portal/ to a stale IP (often login nginx) → 404.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream kong_upstream {
    zone kong_upstream 64k;
    server kong:8000 resolve;
}

upstream login_fe_upstream {
    zone login_fe_upstream 64k;
    server platform-login-frontend:80 resolve;
}

upstream admin_fe_upstream {
    zone admin_fe_upstream 64k;
    server admin-center-frontend:80 resolve;
}

upstream portal_fe_upstream {
    zone portal_fe_upstream 64k;
    server user-portal-frontend:80 resolve;
}

upstream dw_fe_upstream {
    zone dw_fe_upstream 64k;
    server developer-workstation-frontend:80 resolve;
}

upstream n8n_upstream {
    zone n8n_upstream 64k;
    server n8n:5678 resolve;
}

upstream superset_upstream {
    zone superset_upstream 64k;
    server superset-final:8088 resolve;
}

# admin-center API, reached directly (bypass Kong) for the Superset auth_request subrequest.
upstream admin_center_api_upstream {
    zone admin_center_api_upstream 64k;
    server admin-center:8080 resolve;
}

server {
    listen 80;
    server_name localhost;

    client_max_body_size 50M;

    # HSTS: production TLS only; dev edge is HTTP — leave empty (no policy value).
    set $hsts_sts_header "";
    add_header Strict-Transport-Security $hsts_sts_header always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Unified API entry (same origin as SPAs)
    location ^~ /api/ {
        proxy_pass http://kong_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    # Canonical trailing slashes (SPA base paths use .../)
    location = /portal { return 308 /portal/; }
    location = /login { return 308 /login/; }
    location = /admin { return 308 /admin/; }
    location = /dev { return 308 /dev/; }
    location = /n8n { return 308 /n8n/; }
    # Superset author UI is JWT-gated on :8087; embedded dashboards use :8086.
    # Raw :8088 is closed. Bounce /superset links to the gated author origin.
    location = /superset { return 302 http://localhost:8087/superset/welcome/; }
    location = /superset/ { return 302 http://localhost:8087/superset/welcome/; }
    location ^~ /superset/ { return 302 http://localhost:8087$request_uri; }

    # N8N (DEV): n8n runs at container root; strip /n8n/ prefix. Do NOT set N8N_PATH (breaks /n8nassets MIME).
    # Use $http_host (not $host): $host drops the port; WebSocket origin check then fails
    # (Origin localhost:3000 vs expected localhost) and the editor only partially loads.
    location ^~ /n8n/ {
        rewrite ^/n8n/?(.*)$ /$1 break;
        proxy_pass http://n8n_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        # n8n still emits BASE_PATH=/; fix editor + static tags for subpath
        proxy_set_header Accept-Encoding "";
        sub_filter_once off;
        sub_filter_types text/html text/javascript application/javascript application/json text/css;
        sub_filter "window.BASE_PATH = '/'" "window.BASE_PATH = '/n8n/'";
        sub_filter 'href="/assets/' 'href="/n8n/assets/';
        sub_filter 'src="/assets/' 'src="/n8n/assets/';
        sub_filter 'href="/static/' 'href="/n8n/static/';
        sub_filter 'src="/static/' 'src="/n8n/static/';
        sub_filter 'href="/favicon' 'href="/n8n/favicon';
        sub_filter '"/rest/' '"/n8n/rest/';
        sub_filter '"/assets/' '"/n8n/assets/';
    }

    # n8n dynamic imports / API still use root-absolute paths (DEV edge only; no other service uses these)
    location ^~ /rest/ {
        proxy_pass http://n8n_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    location ^~ /assets/ {
        proxy_pass http://n8n_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    location ^~ /static/ {
        proxy_pass http://n8n_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    # Unified Login SPA
    location ^~ /login/ {
        proxy_pass http://login_fe_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Admin Center SPA
    location ^~ /admin/ {
        proxy_pass http://admin_fe_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # User Portal SPA
    location ^~ /portal/ {
        proxy_pass http://portal_fe_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Developer Workstation SPA (DEV only)
    location ^~ /dev/ {
        proxy_pass http://dw_fe_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Default: hard 404 (avoid nginx default file lookup)
    location = / {
        return 404;
    }
}

# =============================================================================
# Gated Superset author UI (DEV) — Phase 1 "C1".
# Authors reach Superset through this port; the gate validates the platform JWT
# and injects trusted X-Remote-User / X-Remote-Roles for REMOTE_USER SSO.
# Served at ROOT (not a /superset/ subpath) because Superset's /static /api paths
# collide with n8n/kong on :3000. Raw :8088 stays open for embedded guest-token
# dashboards (that port is closed and embedding re-routed in a later step "C2").
# =============================================================================
server {
    listen 8087;
    server_name localhost;
    client_max_body_size 50M;

    # auth_request subrequest -> admin-center authorize endpoint.
    # Validates the JWT cookie and returns X-Remote-User / X-Remote-Roles (200),
    # 401 (no/invalid JWT) or 403 (no BI role mapping). Internal-only.
    location = /_superset_authz {
        internal;
        proxy_pass http://admin_center_api_upstream/api/v1/admin/internal/bi/superset/authorize;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Cookie $http_cookie;   # forward JWT cookie to the filter
        # Strip Origin: this is an internal server-to-server call. Forwarding the
        # browser's Origin (e.g. http://localhost:8087 from a Superset telemetry
        # POST) makes admin-center's CORS filter reject the subrequest with 403,
        # which then denies the whole request. The auth check needs no Origin.
        proxy_set_header Origin "";
    }

    location / {
        auth_request /_superset_authz;
        auth_request_set $sx_user  $upstream_http_x_remote_user;
        auth_request_set $sx_roles $upstream_http_x_remote_roles;
        auth_request_set $sx_email $upstream_http_x_remote_email;
        auth_request_set $sx_first $upstream_http_x_remote_firstname;

        # Inject trusted identity. These also OVERRIDE any client-forged X-Remote-*
        # of the same name (forgery stripping) — set every header the SM reads.
        # Firstname is URL-encoded by the authz endpoint (may contain non-ASCII).
        proxy_set_header X-Remote-User      $sx_user;
        proxy_set_header X-Remote-Roles     $sx_roles;
        proxy_set_header X-Remote-Email     $sx_email;
        proxy_set_header X-Remote-Firstname $sx_first;
        proxy_set_header X-Remote-Lastname  "";

        proxy_pass http://superset_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 600s;

        error_page 401 = @superset_login;
        error_page 403 = @superset_forbidden;
    }

    # Unauthenticated -> bounce to the unified login WITH SSO params, else the login
    # SPA aborts with LOGIN_MISSING_PARAMS (client_id/redirect_uri are required).
    # Use the admin client so the callback sets ac_access_token — the cookie the
    # admin-center authorize endpoint (this gate's auth_request) reads. After login
    # the user lands on /admin (cookie set); re-open :8087 to enter Superset.
    location @superset_login {
        return 302 "http://localhost:3000/login/?client_id=admin&redirect_uri=http://localhost:3000/admin/sso/callback&state=superset-author";
    }
    location @superset_forbidden {
        default_type text/plain;
        return 403 "No Superset access: your account has no BI role mapping.\n";
    }
}

# =============================================================================
# Embed origin (DEV) — Phase 1 "C2". The user-portal iframes embedded dashboards
# through this port (SUPERSET_PUBLIC_HOST=http://localhost:8086). No JWT gate —
# guest tokens are the auth — but client-forged X-Remote-* are stripped so this
# open origin can't be abused to forge an authenticated (author) REMOTE_USER
# session. Replaces direct browser access to the now-closed raw :8088.
# =============================================================================
server {
    listen 8089;
    server_name localhost;
    client_max_body_size 50M;

    location / {
        # Strip any client-supplied X-Remote-* (Superset trusts these for
        # REMOTE_USER auth) — the embed origin must never establish an author session.
        proxy_set_header X-Remote-User      "";
        proxy_set_header X-Remote-Roles     "";
        proxy_set_header X-Remote-Email     "";
        proxy_set_header X-Remote-Firstname "";
        proxy_set_header X-Remote-Lastname  "";

        proxy_pass http://superset_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }
}
