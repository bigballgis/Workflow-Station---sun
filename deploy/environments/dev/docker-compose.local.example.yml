services:
  mailpit:
    image: axllent/mailpit:latest
    container_name: platform-mailpit-dev
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - platform-dev-network
    restart: unless-stopped

  developer-workstation:
    environment:
      SSRF_ALLOWED_HOSTS: n8n,mailpit
