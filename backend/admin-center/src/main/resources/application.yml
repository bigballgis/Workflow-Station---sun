server:
  port: ${SERVER_PORT:8090}
  servlet:
    context-path: /api/v1/admin

# CORS Configuration
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}

# Application Configuration (platform-common)
app:
  database:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/workflow_platform}
    username: ${SPRING_DATASOURCE_USERNAME:platform}
    password: ${SPRING_DATASOURCE_PASSWORD:platform123}
    driver-class-name: org.postgresql.Driver
    max-pool-size: 20
    min-idle: 5
    connection-timeout: 20000
    
  security:
    jwt-secret-key: ${JWT_SECRET:default-jwt-secret-key}
    jwt-expiration-ms: ${JWT_EXPIRATION:86400000}
    jwt-refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION:604800000}
    password:
      min-length: 8
      max-length: 128
      require-uppercase: true
      require-lowercase: true
      require-digit: true
      require-special: true
      history-count: 5
      expiry-days: 90
    login:
      max-failed-attempts: 5
      lockout-duration-minutes: 30
    session:
      timeout-minutes: 30
      max-concurrent-sessions: 3
      
  api:
    workflow-engine-url: ${WORKFLOW_ENGINE_URL:http://localhost:8081}
    admin-center-url: ${ADMIN_CENTER_URL:http://localhost:8090}
    timeout-seconds: 30
    max-retries: 3
    
  monitoring:
    enabled: true
    log-level: ${LOG_LEVEL:INFO}
    metrics-enabled: true
    health-check-interval-seconds: 60
    
  cache:
    redis-host: ${SPRING_REDIS_HOST:localhost}
    redis-port: ${SPRING_REDIS_PORT:6379}
    redis-password: ${SPRING_REDIS_PASSWORD:redis123}
    redis-database: 1
    user-ttl-minutes: 30
    permission-ttl-minutes: 60
    dictionary-ttl-minutes: 120
    
  messaging:
    kafka-bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    kafka-group-id: admin-center
    enabled: false
    
  workflow:
    engine-url: ${WORKFLOW_ENGINE_URL:http://localhost:8081}
    enabled: true
    timeout-seconds: 30

# 编排调用 user-portal 内部清理 API（须与门户 portal.internal.api-token 一致）
user-portal:
  base-url: ${USER_PORTAL_BASE_URL:http://localhost:8082/api/portal}
  internal-api-token: ${PORTAL_INTERNAL_API_TOKEN:}

spring:
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  application:
    name: admin-center
  
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/workflow_platform}
    username: ${SPRING_DATASOURCE_USERNAME:platform}
    password: ${SPRING_DATASOURCE_PASSWORD:platform123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
      pool-name: AdminCenterHikariPool

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: Asia/Shanghai

  flyway:
    enabled: true
    locations: classpath:db/migration/admin-center,classpath:db/migration/platform-security
    baseline-on-migrate: true
    validate-on-migrate: false
  
  # 禁用静态资源处理，避免与 API 路由冲突
  web:
    resources:
      add-mappings: false

  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      password: ${SPRING_REDIS_PASSWORD:redis123}
      database: 1
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: 3000ms

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: admin-center
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer

  messages:
    basename: i18n/messages
    encoding: UTF-8

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

# Security Configuration
security:
  password:
    min-length: 8
    max-length: 128
    require-uppercase: true
    require-lowercase: true
    require-digit: true
    require-special: true
    history-count: 5
    expiry-days: 90
  
  login:
    max-failed-attempts: 5
    lockout-duration-minutes: 30
  
  session:
    timeout-minutes: 30
    max-concurrent-sessions: 3

# Logging Configuration
logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.admin: ${LOG_LEVEL_PLATFORM:DEBUG}
    org.springframework.security: INFO
    org.hibernate.SQL: ${LOG_LEVEL_SQL:DEBUG}
  file:
    name: logs/admin-center.log
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [admin-center] [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [admin-center] [%thread] %-5level %logger{36} - %msg%n"
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
      group:
        live:
          include: ping
        ready:
          include: db,redis
  health:
    ping:
      enabled: true
    db:
      enabled: true
    redis:
      enabled: true

# OpenAPI Configuration
springdoc:
  api-docs:
    path: /api-docs
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SWAGGER_ENABLED:true}
    tags-sorter: alpha
    operations-sorter: alpha

# Application Configuration
admin:
  audit:
    enabled: true
    retention-days: 365
  
  notification:
    email:
      enabled: true
    sms:
      enabled: false
    
  cache:
    user-ttl-minutes: 30
    permission-ttl-minutes: 60
    dictionary-ttl-minutes: 120

  user:
    reset-password: ${USER_RESET_PASSWORD:password}

# Workflow Engine Configuration
workflow-engine:
  url: ${WORKFLOW_ENGINE_URL:http://localhost:8081}
  enabled: true

# BI Management Configuration
bi:
  superset:
    host: ${SUPERSET_HOST:http://localhost:8088}
    public-host: ${SUPERSET_PUBLIC_HOST:http://localhost:8088}
    db-schema: ${SUPERSET_DB_SCHEMA:public}
    admin-username: ${SUPERSET_ADMIN_USERNAME:admin}
    admin-password: ${SUPERSET_ADMIN_PASSWORD:admin123}
    guest-token-timeout-seconds: 30
  sync:
    cron: ${BI_SYNC_CRON:0 0 */6 * * ?}
    enabled: ${BI_SYNC_ENABLED:true}

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-key-for-development-only}
  expiration: ${JWT_EXPIRATION:86400000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

# Platform Security JWT Configuration (used by platform-security JwtProperties)
platform:
  security:
    jwt:
      secret: ${JWT_SECRET:your-256-bit-secret-key-for-development-only}
      expiration-ms: ${JWT_EXPIRATION:86400000}
      refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION:604800000}
      # 服务自有 cookie 名，避免与 user-portal / developer-workstation 在同源下互相覆盖。
      # 列表首项是本服务写出 Cookie 的名字；其它项用于读取（兼容老客户端 / 转发场景）。
      cookie-names:
        - ac_access_token
        - access_token
      refresh-cookie-name: ac_refresh_token
      issuer: platform
      validate-issuer: false
  encryption:
    secret-key: ${ENCRYPTION_SECRET_KEY:your-32-byte-aes-256-secret-key!!}
  # 统一登录页 /login：签发 SSO code；子系统凭 SSO_INTERNAL_TOKEN 调用 /internal/sso/redeem
  sso:
    internal-token: ${SSO_INTERNAL_TOKEN:}
    code-ttl-seconds: ${SSO_CODE_TTL_SECONDS:300}
    clients:
      admin:
        enabled: true
        redirect-uri-prefixes:
          - ${SSO_REDIRECT_ADMIN_PREFIX:http://localhost:3000/admin/sso/callback}
          - ${SSO_REDIRECT_ADMIN_HTTP_PREFIX:http://localhost:3000/admin/sso/callback}
          - http://localhost:3000/admin/sso/callback
          # Edge on 127.0.0.1 (browser Origin / redirect_uri differ from localhost)
          - http://127.0.0.1:3000/admin/sso/callback
      portal:
        enabled: true
        redirect-uri-prefixes:
          - ${SSO_REDIRECT_PORTAL_PREFIX:http://localhost:3000/portal/sso/callback}
          - ${SSO_REDIRECT_PORTAL_HTTP_PREFIX:http://localhost:3000/portal/sso/callback}
          - http://localhost:3001/portal/sso/callback
          - http://127.0.0.1:3000/portal/sso/callback
          - http://127.0.0.1:3001/portal/sso/callback
      developer-workstation:
        enabled: ${SSO_CLIENT_DEVELOPER_ENABLED:true}
        redirect-uri-prefixes:
          - ${SSO_REDIRECT_DW_PREFIX:http://localhost:3000/dev/sso/callback}
          - ${SSO_REDIRECT_DW_HTTP_PREFIX:http://localhost:3000/dev/sso/callback}
          - http://localhost:3002/dev/sso/callback
          - http://127.0.0.1:3000/dev/sso/callback
          - http://127.0.0.1:3102/dev/sso/callback

# MFE Package Store — shared volume path for import/export
mfe:
  store:
    path: ${MFE_STORE_PATH:${user.home}/.hermes/mfe-store}
