server:
  port: ${SERVER_PORT:8083}
  servlet:
    context-path: /api/v1

# CORS Configuration
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3002,http://localhost:5173}

# Admin Center URL for permission checking、部署与 SSO redeem（仅 DEV）
admin-center:
  url: ${ADMIN_CENTER_URL:http://localhost:8090}

# 一键部署到管理中心：生产环境应要求 JWT（由 Kong 注入或浏览器转发）；本地/测试可关闭
developer:
  deployment:
    require-admin-authorization: ${DEVELOPER_DEPLOY_REQUIRE_ADMIN_AUTH:true}

spring:
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  application:
    name: developer-workstation
  
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/workflow_platform}
    username: ${SPRING_DATASOURCE_USERNAME:platform}
    password: ${SPRING_DATASOURCE_PASSWORD:?SPRING_DATASOURCE_PASSWORD is required}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
  
  flyway:
    # schema 唯一来源 = deploy/init-scripts/00-schema（见 docs/schema-single-source-init-scripts-plan.md）。
    # Flyway 已清退（所有环境本就 SPRING_FLYWAY_ENABLED=false，迁移从未在部署中执行）；
    # 历史迁移归档于 docs/legacy-flyway-migrations/。此处固化为 false，不再依赖 env 覆盖。
    enabled: false

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: Asia/Shanghai

  jackson:
    serialization:
      write-dates-as-timestamps: false
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      password: ${SPRING_REDIS_PASSWORD:?SPRING_REDIS_PASSWORD is required}
      timeout: 5000ms
  
  messages:
    basename: i18n/messages
    encoding: UTF-8

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# File Upload Configuration
file:
  upload:
    base-url: ${FILE_UPLOAD_BASE_URL:/api/v1/upload/files}

# Security
security:
  jwt:
    secret: ${JWT_SECRET:?JWT_SECRET is required}
    expiration: ${JWT_EXPIRATION:2592000000}  # 30 days
  max-login-attempts: ${MAX_LOGIN_ATTEMPTS:5}
  lock-duration-minutes: ${LOCK_DURATION_MINUTES:30}
  
  # Security Permission System Configuration
  cache:
    session-timeout-minutes: ${SECURITY_CACHE_SESSION_TIMEOUT:30}
    max-size: ${SECURITY_CACHE_MAX_SIZE:1000}
    enabled: ${SECURITY_CACHE_ENABLED:true}
    cleanup-interval-minutes: ${SECURITY_CACHE_CLEANUP_INTERVAL:15}
  
  database:
    query-timeout-seconds: ${SECURITY_DB_QUERY_TIMEOUT:30}
    retry-attempts: ${SECURITY_DB_RETRY_ATTEMPTS:2}
    retry-delay-ms: ${SECURITY_DB_RETRY_DELAY:1000}
    connection-pooling-enabled: ${SECURITY_DB_CONNECTION_POOLING:true}
  
  permission:
    resolution-strategy: ${SECURITY_PERMISSION_STRATEGY:DATABASE_FIRST}
    strict-checking: ${SECURITY_PERMISSION_STRICT:true}
    audit-logging: ${SECURITY_PERMISSION_AUDIT:true}
    max-permission-name-length: ${SECURITY_PERMISSION_MAX_NAME_LENGTH:100}
    max-role-name-length: ${SECURITY_ROLE_MAX_NAME_LENGTH:100}
  
  rate-limit:
    requests-per-minute: 100

# Workflow Engine Configuration
workflow-engine:
  url: ${WORKFLOW_ENGINE_URL:http://localhost:8081}
  enabled: true
  jwt:
    secret: ${JWT_SECRET:?JWT_SECRET is required}

# JWT Configuration (used by AuthController)
jwt:
  secret: ${JWT_SECRET:?JWT_SECRET is required}
  expiration: ${JWT_EXPIRATION:2592000000}

# Platform Security JWT Configuration (used by platform-security JwtProperties)
# developer-exchange-enabled=false 可在误部署到共享环境时关闭 SSO exchange（SIT/UAT/PROD 不应部署本服务）
platform:
  sso:
    developer-exchange-enabled: ${SSO_DEVELOPER_EXCHANGE_ENABLED:true}
    internal-token: ${SSO_INTERNAL_TOKEN:}
  security:
    jwt:
      secret: ${JWT_SECRET:?JWT_SECRET is required}
      expiration-ms: ${JWT_EXPIRATION:2592000000}
      refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION:604800000}
      # 服务自有 cookie 名，避免与 user-portal / admin-center 在同源下互相覆盖。
      # 列表首项是本服务写出 Cookie 的名字；其它项用于读取（兼容老客户端 / 转发场景）。
      cookie-names:
        - dw_access_token
        - access_token
      refresh-cookie-name: dw_refresh_token
      issuer: platform
      validate-issuer: false
  encryption:
    secret-key: ${ENCRYPTION_SECRET_KEY:?ENCRYPTION_SECRET_KEY is required}

# OpenAPI
springdoc:
  api-docs:
    path: /api-docs
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SWAGGER_ENABLED:true}

# Logging
logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.developer: ${LOG_LEVEL_PLATFORM:DEBUG}
    org.springframework.security: INFO
    org.hibernate.SQL: ${LOG_LEVEL_SQL:DEBUG}

# Actuator Configuration
management:
  tracing:
    sampling:
      # 100% 采样：保证每条日志都有 traceId（跨服务链路串联）
      probability: 1.0
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
      group:
        live:
          include: ping
        ready:
          include: db,redis
  health:
    ping:
      enabled: true
    db:
      enabled: true
    redis:
      enabled: true

# AI Generation webhook — Activepieces sync webhook.
# The backend POSTs to <base>/api/v1/webhooks/<flowId>/sync; the response contract is unchanged
# ({reply, document, documentType, phaseComplete, generatedData}). flowId is environment-specific.
activepieces:
  ai-generation:
    webhook-url: ${AI_GENERATION_WEBHOOK_URL:http://activepieces:80/api/v1/webhooks/QnU0ytf5oBaxL9rbwOU2Z/sync}
    # 300s: deepseek-v4-pro 生成 DESIGN 文档实测 ~230s;须 >= AP 的 AP_WEBHOOK_TIMEOUT_SECONDS,
    # 否则 AP 侧先超时返回 204 空响应(表现为 "returned empty response")。
    timeout-seconds: ${AI_GENERATION_TIMEOUT:300}

# Trusted hostnames for configured outbound webhooks (localhost for local dev, activepieces for Docker)
ssrf:
  allowed-hosts: ${SSRF_ALLOWED_HOSTS:localhost,activepieces}

# AI Generation Lock Configuration
ai-generation:
  lock:
    ttl-seconds: ${AI_GENERATION_LOCK_TTL:1800}
    force-unlock-timeout-seconds: ${AI_GENERATION_FORCE_UNLOCK_TIMEOUT:60}
  context:
    max-size-bytes: ${AI_GENERATION_CONTEXT_MAX_SIZE:102400}
