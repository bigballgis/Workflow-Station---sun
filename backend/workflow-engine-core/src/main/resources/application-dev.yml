# Development Profile Configuration
# Secrets here apply ONLY when spring.profiles.active=dev (local bare-metal, not Docker).
# Docker Compose uses profile=docker and injects secrets via environment variables.
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/workflow_platform
    username: platform
    password: platform123
  
  data:
    redis:
      host: localhost
      port: 6379
      password: redis123
  
  jpa:
    show-sql: true

jwt:
  secret: ${JWT_SECRET}

platform:
  security:
    jwt:
      secret: ${JWT_SECRET}
  encryption:
    secret-key: ${ENCRYPTION_SECRET_KEY}

logging:
  level:
    com.workflow: DEBUG
    org.hibernate.SQL: DEBUG
