# Docker profile configuration for workflow-engine
# Overrides default settings for Docker environment

# Application Configuration (platform-common)
app:
  database:
    url: jdbc:postgresql://postgres:5432/workflow_platform
    username: platform
    password: ${SPRING_DATASOURCE_PASSWORD:?SPRING_DATASOURCE_PASSWORD is required}
    driver-class-name: org.postgresql.Driver
    max-pool-size: 20
    min-idle: 5
    connection-timeout: 20000
    
  security:
    jwt-secret-key: ${JWT_SECRET:?JWT_SECRET is required}
    jwt-expiration-ms: ${JWT_EXPIRATION:86400000}
    jwt-refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION:604800000}
    password:
      min-length: ${SECURITY_PASSWORD_MIN_LENGTH:8}
      max-length: 128
      require-uppercase: true
      require-lowercase: true
      require-digit: true
      require-special: true
      history-count: 5
      expiry-days: 90
    login:
      max-failed-attempts: ${SECURITY_LOGIN_MAX_FAILED_ATTEMPTS:5}
      lockout-duration-minutes: 30
    session:
      timeout-minutes: ${SECURITY_SESSION_TIMEOUT_MINUTES:30}
      max-concurrent-sessions: 3
      
  api:
    workflow-engine-url: ${WORKFLOW_ENGINE_URL:http://workflow-engine:8080}
    admin-center-url: ${ADMIN_CENTER_URL:http://admin-center:8080}
    timeout-seconds: 30
    max-retries: 3
    
  monitoring:
    enabled: true
    log-level: ${LOG_LEVEL:INFO}
    metrics-enabled: true
    health-check-interval-seconds: 60
    
  cache:
    redis-host: redis
    redis-port: 6379
    redis-password: ${SPRING_REDIS_PASSWORD:?SPRING_REDIS_PASSWORD is required}
    redis-database: 3
    user-ttl-minutes: ${CACHE_USER_TTL_MINUTES:30}
    permission-ttl-minutes: ${CACHE_PERMISSION_TTL_MINUTES:60}
    dictionary-ttl-minutes: ${CACHE_DICTIONARY_TTL_MINUTES:120}
    
  messaging:
    kafka-bootstrap-servers: kafka:29092
    kafka-group-id: workflow-engine
    enabled: false
    
  workflow:
    engine-url: ${WORKFLOW_ENGINE_URL:http://workflow-engine:8080}
    enabled: true
    timeout-seconds: 30

spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/workflow_platform
    username: platform
    password: ${SPRING_DATASOURCE_PASSWORD:?SPRING_DATASOURCE_PASSWORD is required}

  data:
    redis:
      host: ${SPRING_REDIS_HOST:redis}
      port: ${SPRING_REDIS_PORT:6379}
      password: ${SPRING_REDIS_PASSWORD:?SPRING_REDIS_PASSWORD is required}
      database: 3

  kafka:
    bootstrap-servers: kafka:29092

# Flowable Configuration - schema migration is MANUAL in every environment.
# The engine must not silently upgrade act_* on startup: a Flowable major/minor schema migration
# is one-way (no vendor downgrade scripts), so it needs a backup and a deliberate operator step,
# not a side effect of a container restart. Run the migration SQL first, then start the engine:
#   deploy/k8s/init-data/init-flowable/upgrade/MIGRATE-<from>-to-<to>-for-gui.sql
# Set FLOWABLE_SCHEMA_UPDATE=true only to deliberately let the engine create/upgrade the schema
# (e.g. a throwaway local database you are happy to lose).
flowable:
  database-schema-update: ${FLOWABLE_SCHEMA_UPDATE:false}
  async-executor-activate: true
  history-level: full

# Actuator: ready group (application.yml) includes redis — keep contributor enabled; host is compose service "redis", not localhost
management:
  endpoint:
    health:
      group:
        ready:
          include: db,redis
  health:
    redis:
      enabled: true

# Logging - reduce verbosity in Docker
logging:
  level:
    root: INFO
    com.workflow: INFO
    com.platform: INFO
    org.flowable: INFO
    org.hibernate.SQL: WARN

# File service base URL (developer-workstation internal address in Docker network)
file-service:
  base-url: ${FILE_SERVICE_BASE_URL:http://developer-workstation:8080}

# Activepieces runtime — internal Docker address (AP container listens on :80)
service-task:
  webhook-base-url: ${ACTIVEPIECES_WEBHOOK_BASE_URL:http://activepieces:80}
  # Q7 部署期解析走 admin-center（容器内网）；context-path=/api/v1/admin
  flow-resolve-url: ${ACTIVEPIECES_FLOW_RESOLVE_URL:${ADMIN_CENTER_URL:http://admin-center:8080}/api/v1/admin/automation/flows/resolve}
