spring:
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  application:
    name: user-portal
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/workflow_platform}
    username: ${SPRING_DATASOURCE_USERNAME:platform}
    password: ${SPRING_DATASOURCE_PASSWORD:?SPRING_DATASOURCE_PASSWORD is required}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      # 连接占用超过阈值(ms)时打印堆栈，用于压测确认“是否真泄漏”——正常情况下不应有告警。
      leak-detection-threshold: 20000
  jpa:
    # OSIV 关闭：连接按仓储/事务调用即取即还，不再横跨整个请求(含对 workflow-engine 的阻塞 HTTP)。
    # /tasks/query 高并发下连接池耗尽的主因之一。见 TaskQueryComponent 并行扇出。
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: Asia/Shanghai

  # 库表主要由 deploy/init-scripts 初始化；此处仅补齐与 JDBC 查询一致的增量（如 V405 submitted_by_user_id）。
  # baseline-on-migrate + baseline-version=404：跳过 V400–V404，避免与已有 Docker 初始化脚本重复执行破坏性语句。
  flyway:
    # schema 唯一来源 = deploy/init-scripts/00-schema（见 docs/schema-single-source-init-scripts-plan.md）。
    # Flyway 已清退（所有环境本就 SPRING_FLYWAY_ENABLED=false，迁移从未在部署中执行）；
    # 历史迁移归档于 docs/legacy-flyway-migrations/。此处固化为 false，不再依赖 env 覆盖。
    enabled: false

  
  jackson:
    serialization:
      write-dates-as-timestamps: false
    date-format: yyyy-MM-dd'T'HH:mm:ss
    time-zone: Asia/Shanghai

  messages:
    basename: i18n/messages
    encoding: UTF-8

  # Redis Configuration (if needed)
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      password: ${SPRING_REDIS_PASSWORD:?SPRING_REDIS_PASSWORD is required}
      database: 2
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
  
  # RecordNote 附件上传（multipart 默认 1MB 太小）
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB

  # 禁用静态资源处理，避免与 API 路由冲突
  web:
    resources:
      add-mappings: false

server:
  port: ${SERVER_PORT:8082}
  servlet:
    context-path: /api/portal

# Admin Center URL for API calls
admin-center:
  url: ${ADMIN_CENTER_URL:http://localhost:8090}

# Workflow Engine Core URL for API calls
workflow-engine:
  url: ${WORKFLOW_ENGINE_URL:http://localhost:8081}
  enabled: true  # 启用 Flowable 集成，通过 workflow-engine-core 调用 Flowable 引擎

# 管理端调用 /internal/runtime/* 时使用的共享密钥（与 admin-center user-portal.internal-api-token 一致）
portal:
  internal:
    api-token: ${PORTAL_INTERNAL_API_TOKEN:}
  dashboard:
    # 首页团队任务汇总：true 时按 BU 成员逐个 queryTasks（成员多时极慢）。默认 false。
    team-task-aggregation-enabled: ${PORTAL_DASHBOARD_TEAM_TASK_AGGREGATION_ENABLED:false}
    # 首页 /dashboard/overview 内存缓存（秒）。0=关闭；15～30 可显著减少短时间重复进入首页的引擎压力。
    # 默认 15s：同一用户短时间重复进入首页直接命中缓存，计数仍足够新鲜。
    overview-cache-ttl-seconds: ${PORTAL_DASHBOARD_OVERVIEW_CACHE_TTL_SECONDS:15}
    # 为 true 时不请求「平均处理时长」所需的 completed-tasks 样本，减轻引擎调用（avg 展示为默认 2.5）。
    skip-avg-processing-hours: ${PORTAL_DASHBOARD_SKIP_AVG_PROCESSING_HOURS:true}

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:?JWT_SECRET is required}
  expiration: ${JWT_EXPIRATION:86400000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

# Platform Security JWT Configuration (used by platform-security JwtProperties)
# SSO internal-token：与 admin-center 一致，用于 /internal/sso/redeem
platform:
  sso:
    internal-token: ${SSO_INTERNAL_TOKEN:}
  security:
    jwt:
      secret: ${JWT_SECRET:?JWT_SECRET is required}
      expiration-ms: ${JWT_EXPIRATION:86400000}
      refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION:604800000}
      # 服务自有 cookie 名，避免与 admin-center / developer-workstation 在同源 localhost:3000 下互相覆盖工作台 claim。
      # 列表首项是本服务写出 Cookie 的名字；其它项用于读取（兼容老客户端 / 转发场景）。
      cookie-names:
        - up_access_token
        - access_token
      refresh-cookie-name: up_refresh_token
      issuer: platform
      validate-issuer: false
  encryption:
    secret-key: ${ENCRYPTION_SECRET_KEY:?ENCRYPTION_SECRET_KEY is required}

springdoc:
  api-docs:
    path: /api-docs
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SWAGGER_ENABLED:true}

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.portal: ${LOG_LEVEL_PLATFORM:DEBUG}
    org.springframework.web: INFO
    org.hibernate.SQL: ${LOG_LEVEL_SQL:DEBUG}

# Actuator Configuration
management:
  tracing:
    sampling:
      # 100% 采样：保证每条日志都有 traceId（跨服务链路串联）
      probability: 1.0
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
      group:
        live:
          include: ping
        ready:
          include: db
  health:
    ping:
      enabled: true
    db:
      enabled: true
