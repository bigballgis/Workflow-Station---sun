spring:
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  application:
    name: user-portal
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/workflow_platform}
    username: ${SPRING_DATASOURCE_USERNAME:platform}
    password: ${SPRING_DATASOURCE_PASSWORD:platform123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: Asia/Shanghai

  # 库表主要由 deploy/init-scripts 初始化；此处仅补齐与 JDBC 查询一致的增量（如 V405 submitted_by_user_id）。
  # baseline-on-migrate + baseline-version=404：跳过 V400–V404，避免与已有 Docker 初始化脚本重复执行破坏性语句。
  flyway:
    enabled: true
    locations: classpath:db/migration/user-portal
    baseline-on-migrate: true
    baseline-version: "404"

  
  jackson:
    serialization:
      write-dates-as-timestamps: false
    date-format: yyyy-MM-dd'T'HH:mm:ss
    time-zone: Asia/Shanghai

  messages:
    basename: i18n/messages
    encoding: UTF-8

  # Redis Configuration (if needed)
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      password: ${SPRING_REDIS_PASSWORD:redis123}
      database: 2
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
  
  # 禁用静态资源处理，避免与 API 路由冲突
  web:
    resources:
      add-mappings: false

server:
  port: ${SERVER_PORT:8082}
  servlet:
    context-path: /api/portal

# Admin Center URL for API calls
admin-center:
  url: ${ADMIN_CENTER_URL:http://localhost:8090}

# Workflow Engine Core URL for API calls
workflow-engine:
  url: ${WORKFLOW_ENGINE_URL:http://localhost:8081}
  enabled: true  # 启用 Flowable 集成，通过 workflow-engine-core 调用 Flowable 引擎

# 管理端调用 /internal/runtime/* 时使用的共享密钥（与 admin-center user-portal.internal-api-token 一致）
portal:
  internal:
    api-token: ${PORTAL_INTERNAL_API_TOKEN:}

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-key-for-development-only}
  expiration: ${JWT_EXPIRATION:86400000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

# Platform Security JWT Configuration (used by platform-security JwtProperties)
# SSO internal-token：与 admin-center 一致，用于 /internal/sso/redeem
platform:
  sso:
    internal-token: ${SSO_INTERNAL_TOKEN:}
  security:
    jwt:
      secret: ${JWT_SECRET:your-256-bit-secret-key-for-development-only}
      expiration-ms: ${JWT_EXPIRATION:86400000}
      refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION:604800000}
      issuer: platform
      validate-issuer: false
  encryption:
    secret-key: ${ENCRYPTION_SECRET_KEY:your-32-byte-aes-256-secret-key!!}

springdoc:
  api-docs:
    path: /api-docs
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SWAGGER_ENABLED:true}

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.portal: ${LOG_LEVEL_PLATFORM:DEBUG}
    org.springframework.web: INFO
    org.hibernate.SQL: ${LOG_LEVEL_SQL:DEBUG}

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
