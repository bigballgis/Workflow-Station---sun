name: Backend build & tests

# 这个仓库此前**没有任何 Java CI** —— .github/workflows 下只有 vendor-trim-check 和
# ai-guidance-sync，都不跑 mvn。于是"测试是绿的"只能靠人记忆，而记忆会过时：
# 2026-07-31 实测发现记忆中的基线（engine 784 全绿）早已不成立，真实数字是
# engine 830/3F、portal 947/2E、admin 634/0F，且 engine 还必须外部传 JWT secret
# 才跑得起来（否则 64 个 error）。
#
# 没有 CI 就无法机械区分"我改坏了"和"本来就红"，每一次改动的验证都退化成手工跑一遍
# 加上主观判断。这个 workflow 就是把那条基线钉死在机器上。
#
# 已知的既存失败在 .github/known-test-failures.txt 里隔离，理由和去向逐条写在那里。
# 隔离清单只减不增：新出现的失败就是回归，应该修代码而不是往清单里加。

on:
  push:
    paths:
      - 'backend/**'
      - 'pom.xml'
      - '.github/workflows/build.yml'
      - '.github/known-test-failures.txt'
  pull_request:
    paths:
      - 'backend/**'
      - 'pom.xml'
      - '.github/workflows/build.yml'
      - '.github/known-test-failures.txt'
  workflow_dispatch:

concurrency:
  group: backend-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # 加 -B（batch）去掉下载进度条噪声；-ntp 隐藏 transfer 日志，让失败信息不被淹没。
  MAVEN_ARGS: -B -ntp
  # surefire 的 excludesFile 是相对**每个模块**解析的：写相对路径会跑到
  # backend/<module>/.github/ 下找，报 "Failed to load list from file"。必须给绝对路径。
  # 另注：该文件必须是 **纯 ASCII** —— surefire 用平台默认编码读它，非 ASCII 字符会
  # 报 "Input length = 1"（本地用中文注释时踩过）。
  EXCLUDES: -Dsurefire.excludesFile=${{ github.workspace }}/.github/known-test-failures.txt
  # 对齐上面无密码的 Redis service（见 services.redis 的说明）。
  REDIS_OVERRIDE: -DTEST_REDIS_PASSWORD= -Dspring.data.redis.password=

jobs:
  build-and-test:
    name: Compile + test all backend modules
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      # workflow-engine-core 的 @SpringBootTest 里 redisMessageListenerContainer 在
      # **上下文启动时就连接**（不是懒加载），连不上整个 application context 就死，
      # 会把该模块每一个 @SpringBootTest 都变成 error。所以 Redis 是硬依赖，不是可选项。
      #
      # 这里跑**无密码** Redis：GitHub 的 service container 不能覆盖镜像 command，
      # 而官方 redis 镜像并不认 REDIS_ARGS（那是 Bitnami 的约定）—— 试过，设了也照样
      # 无密码起来。与其假装设了密码，不如显式无密码，再让测试侧传空密码对齐
      # （application-test.yml 的 TEST_REDIS_PASSWORD 默认值是 dev_redis_123，
      # 对着无密码实例会认证失败，所以下面每个 test step 都传了空值）。
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
        ports:
          - 6379:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Java 17：根 pom 的 java.version / maven.compiler.source-target 都是 17，
      # 四个 backend Dockerfile 的基础镜像也是 eclipse-temurin:17-jre。保持一致。
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # 必须先 install：platform-common / -cache / -security / -messaging 是被
      # 四个应用模块以硬编码 1.0.0-SNAPSHOT 依赖的，不先装进本地仓库，后面单模块
      # 跑测试会解析不到。这一步也顺带充当编译门 —— 编译不过就没必要跑测试了。
      - name: Install all modules (skip tests)
        run: mvn $MAVEN_ARGS clean install -DskipTests -T 1C

      # 分模块跑而不是一次 mvn test：三个大模块各自 800~950 个测试，分开跑时
      # GitHub 的 job 摘要能直接看出是哪个模块红了，不用翻几千行日志。
      # -o（离线）不加：CI 每次都是干净的 runner，需要联网拉依赖。
      - name: Test workflow-engine-core
        run: mvn $MAVEN_ARGS test -pl backend/workflow-engine-core $EXCLUDES $REDIS_OVERRIDE

      - name: Test user-portal
        run: mvn $MAVEN_ARGS test -pl backend/user-portal $EXCLUDES $REDIS_OVERRIDE

      - name: Test admin-center
        run: mvn $MAVEN_ARGS test -pl backend/admin-center $EXCLUDES $REDIS_OVERRIDE

      - name: Test platform modules
        run: >-
          mvn $MAVEN_ARGS test
          -pl backend/platform-common,backend/platform-cache,backend/platform-security,backend/platform-messaging
          $EXCLUDES $REDIS_OVERRIDE

      # 这一步曾是 continue-on-error：当时该模块 696 个测试里有 22 failures + 43 errors，
      # 分布在 17 个测试类（在升级前的提交上同样复现，属既存债务）。那 65 个已全部修完，
      # 模块现在 696 tests / 0F / 0E，因此按当初写下的退出条件把它升为**硬门禁**。
      - name: Test developer-workstation
        run: mvn $MAVEN_ARGS test -pl backend/developer-workstation $EXCLUDES $REDIS_OVERRIDE

      # 容器化持久层测试（*IT）。默认的 `mvn test` **不会**跑它们 ——
      # surefire 的 includes 只收 *Test/*Tests/*Properties，所以本地没装 docker
      # 的开发机不受影响；这里用 -Dtest 显式点名。
      #
      # 为什么值得单独一步：此前三个模块的 pom 都声明了 testcontainers 依赖，
      # 却没有一个测试文件用过它 —— JPA 映射、FK 级联、唯一约束、JSONB 往返全部零覆盖，
      # 改坏一个列映射整套测试照样全绿。GitHub runner 自带 docker，跑得起来。
      - name: Container integration tests (real PostgreSQL)
        run: >-
          mvn $MAVEN_ARGS test -pl backend/admin-center
          -Dtest='*ContainerIT' -DfailIfNoTests=false
          $REDIS_OVERRIDE

      # 覆盖率报告：只归档，不设阈值。目的是让覆盖率**下降**变得可见 ——
      # 此前 10 个 pom 没有任何覆盖率工具，一个 PR 加 500 行零测试代码看不出来。
      - name: Upload JaCoCo reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-reports
          path: '**/target/site/jacoco/**'
          retention-days: 14
          if-no-files-found: ignore

      # 失败时把 surefire 报告捞出来 —— 日志里只有摘要，具体哪个断言炸了要看报告。
      - name: Upload surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/**'
          retention-days: 7
