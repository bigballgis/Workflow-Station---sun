name: Frontend tests

# 三个前端 app 一共 207 个测试文件，但在这条 workflow 之前**从未在 CI 里跑过**，
# 而且本地也基本跑不起来：各 app 的 node_modules 里连 vitest 都没装。门槛在环境准备，
# 不在测试本身 —— 于是"装不上所以不跑"，测试就慢慢腐烂：
#   - user-portal 的一个套件因缺 async-validator 声明，整体 transform 失败
#   - developer-workstation 的 Kong 断言按 \n 匹配，在 CRLF 检出下恒失败
#   - 同模块的中文注释规约（Requirement 8.1/8.2）已积累 21 处违规
# 这些都是几分钟能修的问题，只是没有任何东西在盯着。
#
# 单独一条 workflow 而不是并进 build.yml：触发路径、工具链、耗时都与后端无关，
# 混在一起会让后端改动白等前端安装依赖。

on:
  push:
    paths:
      - 'frontend/**'
      - 'deploy/kong/**'          # preservation.property.test.ts 直接断言 kong.yml.template
      - '.github/workflows/frontend-build.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - 'deploy/kong/**'
      - '.github/workflows/frontend-build.yml'
  workflow_dispatch:

concurrency:
  group: frontend-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      # 一个 app 红不掩盖另外两个的结果 —— 三个各自独立报告。
      fail-fast: false
      matrix:
        app: [user-portal, developer-workstation, admin-center]

    defaults:
      run:
        working-directory: frontend/${{ matrix.app }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 每个 app 各自 install（frontend/ 不是 pnpm workspace，没有根 lockfile）。
      # 版本跟随 frontend/package.json 的 packageManager 字段。
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/${{ matrix.app }}/pnpm-lock.yaml

      # --frozen-lockfile：lockfile 与 package.json 不一致时直接失败，而不是悄悄改依赖树。
      # 本地那次 async-validator 缺声明的问题，正是"依赖只靠 hoist 偶然可用"的后果。
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      # 硬门禁：三个 app 的 vite build 实测均通过（2026-08-28），所以这里直接卡死。
      # 此前 CI 只跑 pnpm test，一个能让构建失败的改动可以全绿合入。
      - name: Build
        run: pnpm build

      # 棘轮门禁：typecheck / lint 脚本三个 app 早就有，但从未接进 CI，
      # 于是 tsconfig 的 strict: true 在 PR 上只是装饰。实测存量太大，
      # 直接硬卡会让每个 PR 都红（typecheck 579、eslint errors 2571），
      # 一次性清零又会长期阻塞主干 —— 所以冻结基线、只禁新增。
      # 基线在 frontend/scripts/baseline.json，修好问题后往下调。
      - name: Typecheck (baseline ratchet)
        run: node ../scripts/check-baseline.mjs typecheck ${{ matrix.app }}

      - name: Lint (baseline ratchet)
        run: node ../scripts/check-baseline.mjs lint ${{ matrix.app }}

      # 覆盖率只归档、不设门禁 —— 目的是让覆盖率**下降**可见，而不是卡阈值。
      # continue-on-error 仅用于这一步：报告生成失败不该让整条 PR 红，
      # 真正的测试结论已经由上面的 `pnpm test` 给出了。
      - name: Coverage report
        continue-on-error: true
        run: pnpm test:coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.app }}
          path: frontend/${{ matrix.app }}/coverage
          retention-days: 14
          if-no-files-found: ignore
