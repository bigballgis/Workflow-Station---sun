name: AP workspace invariants

# Two cheap gates on the vendored Activepieces workspace. Neither is about upstream
# alignment — that stopped being a goal in D12/D13; both catch mistakes we make ourselves.
#
#   1. No tsconfig path mapping points at a file that does not exist. A dangling mapping
#      resolves imports to nothing and tsc reports it far from the cause. There were 34 of
#      them on 2026-08-07 (leftovers from deleting packages/pieces/core).
#   2. The committed lockfile still matches the workspace manifests. The image build runs
#      `pnpm install --frozen-lockfile` in both stages, so a manifest edit without a
#      lockfile refresh fails the build instead of this job — much later and much noisier.
#
# This job replaced the HERMES-PATCH-013 "piece trim did not regress" gate: community/ is
# where our own pieces live, so asserting an allowlist there taxed the workflow it was
# meant to protect.

on:
  push:
    paths:
      - 'activepieces/**'
      - '.github/workflows/vendor-trim-check.yml'
  pull_request:
    paths:
      - 'activepieces/**'
      - '.github/workflows/vendor-trim-check.yml'
  workflow_dispatch:

concurrency:
  group: vendor-trim-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace-invariants:
    name: tsconfig paths resolve, lockfile matches workspace
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: tsconfig path mappings all resolve
        run: node activepieces/hermes/check-tsconfig-paths.mjs

      - name: Lockfile matches the workspace
        working-directory: activepieces
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile --lockfile-only
