<title>Automation 点击原型</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* Layout: 应用外壳 = 顶栏（切换 DW / Admin、身份）+ 左侧导航 + 主区 + 右侧演示路线。颜色沿用方案页：蓝 = 调用，绿 = 数据，红 = 拦截，琥珀 = FU 专属 */
:root {
  --bg: #F4F6F9; --surface: #FFFFFF; --band: #E9EDF3; --fg: #18202C; --muted: #5A6577;
  --line: #D6DCE5; --line-strong: #AEB8C6;
  --accent: #2F5BD3; --accent-soft: #E3EAFB;
  --data: #0B7F63; --data-soft: #DCF1E9;
  --block: #C23B3B; --block-soft: #FBE7E7;
  --fu: #9A5A00; --fu-soft: #FBEFD8;
  --on-accent: #FFFFFF;
  --shadow: 0 14px 40px rgba(20, 30, 50, 0.16);
  --font-body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F141B; --surface: #171E27; --band: #1D2531; --fg: #E5EAF1; --muted: #9AA5B5;
    --line: #2A3441; --line-strong: #46525F;
    --accent: #7C9CFF; --accent-soft: #1E2A47;
    --data: #3CC79C; --data-soft: #12302A;
    --block: #F27878; --block-soft: #3A1B1E;
    --fu: #F0B45A; --fu-soft: #3A2A12;
    --on-accent: #0F141B;
    --shadow: 0 14px 40px rgba(0, 0, 0, 0.55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F141B; --surface: #171E27; --band: #1D2531; --fg: #E5EAF1; --muted: #9AA5B5;
  --line: #2A3441; --line-strong: #46525F;
  --accent: #7C9CFF; --accent-soft: #1E2A47;
  --data: #3CC79C; --data-soft: #12302A;
  --block: #F27878; --block-soft: #3A1B1E;
  --fu: #F0B45A; --fu-soft: #3A2A12;
  --on-accent: #0F141B;
  --shadow: 0 14px 40px rgba(0, 0, 0, 0.55);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 14px; line-height: 1.6; }
button, select, input { font: inherit; color: inherit; }
.mono, code { font-family: var(--font-mono); font-size: 0.92em; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- shell ---------- */
.app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); }
.topbar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--surface); border-bottom: 1px solid var(--line);
}
.brand { font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 8px; }
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 9px; padding: 2px; background: var(--band); }
.seg button { border: 0; background: transparent; padding: 4px 12px; border-radius: 7px; cursor: pointer; font-size: 13.5px; color: var(--muted); }
.seg button.on { background: var(--surface); color: var(--fg); font-weight: 600; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08); }
.seg .short { display: none; }
.spacer { flex: 1; }
.persona { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.persona select { width: auto; }
.shell { display: grid; grid-template-columns: 200px minmax(0, 1fr) auto; min-height: 0; }
.side {
  border-right: 1px solid var(--line); background: var(--surface);
  padding-block: 14px; padding-right: 10px; padding-left: max(10px, env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; gap: 2px; overflow: auto;
}
.side .grp { font-size: 11.5px; letter-spacing: 0.06em; color: var(--muted); padding: 6px 10px 4px; }
.side button { text-align: left; border: 0; background: transparent; border-radius: 8px; padding: 7px 10px; cursor: pointer; font-size: 14px; }
.side button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.side button:disabled { color: var(--muted); cursor: default; opacity: 0.7; }
.side .parent { font-size: 14px; padding: 7px 10px; font-weight: 600; display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.side button.sub { padding-left: 26px; }
@media (max-width: 820px) { .side button:disabled, .side .parent { display: none; } .side button.sub { padding-left: 10px; } }
main { overflow: auto; min-width: 0; padding: 22px 24px 48px; }
.tour {
  width: 300px; border-left: 1px solid var(--line); background: var(--surface); overflow: auto;
  padding-block: 16px; padding-left: 16px; padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 10px; align-content: start;
}
@media (max-width: 1199px) {
  .tour {
    position: fixed; z-index: 40; top: calc(env(safe-area-inset-top, 0px) + 60px);
    right: max(12px, env(safe-area-inset-right, 0px)); bottom: max(12px, env(safe-area-inset-bottom, 0px));
    width: min(330px, calc(100% - 24px)); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 16px;
  }
}
@media (max-width: 820px) {
  .shell { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
  .side {
    flex-direction: row; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line);
    padding-block: 6px; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px));
  }
  .side .grp { display: none; }
  .side button { white-space: nowrap; }
  main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .seg .long { display: none; }
  .seg .short { display: inline; }
}
.tour h2 { margin: 0; font-size: 15px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.tour p { margin: 0; font-size: 13px; color: var(--muted); }
.tour ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.tour li button {
  width: 100%; text-align: left; display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 2px 8px;
  border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 10px; cursor: pointer;
}
.tour li button:hover { border-color: var(--accent); }
.tour li button.on { border-color: var(--accent); background: var(--accent-soft); }
.tour .n { grid-row: span 2; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--band); font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; }
.tour li button.on .n { background: var(--accent); color: var(--on-accent); }
.tour .tt { font-weight: 600; font-size: 13.5px; line-height: 1.4; }
.tour .td { font-size: 12.5px; color: var(--muted); line-height: 1.5; }

/* ---------- common ---------- */
.btn { border: 1px solid var(--line-strong); background: var(--surface); color: var(--fg); border-radius: 8px; padding: 6px 14px; font-size: 13.5px; cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
.btn.danger { border-color: var(--block); background: var(--block); color: var(--on-accent); font-weight: 600; }
.btn.text-danger { border-color: transparent; background: transparent; color: var(--block); padding-inline: 0; }
.icon-btn { border: 0; background: transparent; color: var(--muted); cursor: pointer; border-radius: 6px; padding: 4px 8px; font-size: 13px; }
.icon-btn:hover { background: var(--band); color: var(--fg); }
.link { border: 0; background: transparent; padding: 0; color: var(--accent); cursor: pointer; font-size: 13px; text-align: left; }
.link:hover { text-decoration: underline; }
.link.danger { color: var(--block); }
.tag { display: inline-flex; align-items: center; font-size: 12px; padding: 1px 9px; border-radius: 999px; line-height: 1.7; border: 1px solid var(--line-strong); color: var(--muted); background: var(--surface); white-space: nowrap; }
.tag-data { border-color: var(--data); color: var(--data); background: var(--data-soft); }
.tag-call { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.tag-fail { border-color: var(--block); color: var(--block); background: var(--block-soft); }
.tag-mock { border-style: dashed; }
.tag-plan { border-style: dashed; border-color: var(--accent); color: var(--accent); }
.new-mark { font-size: 11px; color: var(--accent); border: 1px dashed var(--accent); border-radius: 4px; padding: 0 5px; margin-left: 6px; font-weight: 500; white-space: nowrap; vertical-align: middle; }
.cat { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 6px; font-weight: 500; white-space: nowrap; }
.cat-tool { background: var(--band); color: var(--muted); }
.cat-data { background: var(--data-soft); color: var(--data); }
.cat-ext { background: var(--accent-soft); color: var(--accent); }
.cat-fu { background: var(--fu-soft); color: var(--fu); }
.ic { width: 32px; height: 32px; border-radius: 8px; display: inline-grid; place-items: center; font-size: 10.5px; font-weight: 700; flex: none; line-height: 1; }
.ic.sm { width: 26px; height: 26px; font-size: 9.5px; border-radius: 7px; }
.ic-tool { background: var(--band); color: var(--muted); }
.ic-data { background: var(--data-soft); color: var(--data); }
.ic-ext { background: var(--accent-soft); color: var(--accent); }
.ic-fu { background: var(--fu-soft); color: var(--fu); }
.hint { font-size: 12.5px; color: var(--muted); }
.empty { padding: 28px 16px; text-align: center; color: var(--muted); font-size: 13.5px; }
.state { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.state::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--data); }
.page-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
.page-head > div { min-width: 0; }
.crumb { font-size: 12.5px; color: var(--muted); }
.crumb .link { font-size: 12.5px; }
h1 { font-size: 22px; margin: 2px 0 0; line-height: 1.35; text-wrap: balance; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; align-items: center; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.tbl-wrap { overflow-x: auto; }
table.tbl { border-collapse: collapse; width: 100%; font-size: 13.5px; }
.tbl th, .tbl td { text-align: left; padding: 10px 14px; border-top: 1px solid var(--line); vertical-align: middle; }
.tbl thead th { border-top: 0; font-size: 12px; color: var(--muted); font-weight: 600; white-space: nowrap; }
.tbl td.num { font-family: var(--font-mono); font-size: 12.5px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tbl td.nw { white-space: nowrap; }
.tbl tr.click { cursor: pointer; }
.tbl tr.click:hover td { background: var(--band); }
.tbl tr.xrow td { background: var(--bg); white-space: normal; }
.sub { display: block; font-size: 12px; color: var(--muted); }
.banner { border-radius: 10px; padding: 10px 14px; font-size: 13.5px; border: 1px solid var(--line); background: var(--surface); margin-bottom: 12px; }
.banner.info { border-color: var(--line-strong); background: var(--band); }
.banner.data { border-color: var(--data); background: var(--data-soft); }
.banner.call { border-color: var(--accent); background: var(--accent-soft); }
.banner.fail { border-color: var(--block); background: var(--block-soft); }
.toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.toolbar .inp { max-width: 300px; }
.ws-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
.ws-row select { width: auto; min-width: 180px; }

/* ---------- flow editor ---------- */
.editor { display: grid; grid-template-columns: minmax(260px, 340px) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 980px) { .editor { grid-template-columns: minmax(0, 1fr); } }
.canvas {
  border: 1px solid var(--line); border-radius: 12px; padding: 20px 16px; background-color: var(--bg);
  background-image: radial-gradient(var(--line) 1px, transparent 1px); background-size: 16px 16px;
  display: flex; flex-direction: column; align-items: center;
}
.step { width: 100%; display: flex; gap: 10px; align-items: center; text-align: left; padding: 10px 12px; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--surface); cursor: pointer; }
.step:hover { border-color: var(--accent); }
.step.sel { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.step.bad { border-color: var(--block); }
.step.bad.sel { box-shadow: 0 0 0 3px var(--block-soft); }
.step .txt { min-width: 0; flex: 1; display: grid; }
.step .nm { font-size: 13.5px; font-weight: 600; line-height: 1.35; overflow-wrap: anywhere; }
.step .ds { font-size: 12px; color: var(--muted); line-height: 1.4; overflow-wrap: anywhere; }
.step .kind { font-size: 11px; color: var(--muted); letter-spacing: 0.04em; }
.warn { font-size: 12px; color: var(--block); font-weight: 500; line-height: 1.4; }
.ok-tag { font-size: 12px; color: var(--data); font-weight: 500; line-height: 1.4; }
.joint { display: flex; flex-direction: column; align-items: center; }
.joint .v { width: 2px; height: 10px; background: var(--line-strong); }
.joint .plus { width: 24px; height: 24px; border-radius: 50%; border: 1px dashed var(--line-strong); background: var(--surface); color: var(--muted); cursor: pointer; display: grid; place-items: center; font-size: 15px; line-height: 1; padding: 0; }
.joint .plus:hover { border-color: var(--accent); color: var(--accent); border-style: solid; }
.rdot { width: 20px; height: 20px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 11px; font-weight: 700; flex: none; }
.rdot.ok { background: var(--data-soft); color: var(--data); }
.rdot.fail { background: var(--block-soft); color: var(--block); }
.rdot.skip { background: var(--band); color: var(--muted); }
.panel { overflow: hidden; }
.ptabs { display: flex; border-bottom: 1px solid var(--line); padding: 0 8px; }
.ptabs button { border: 0; background: transparent; padding: 10px 12px; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.ptabs button.on { color: var(--fg); font-weight: 600; border-bottom-color: var(--accent); }
.pbody { padding: 16px 18px 20px; display: grid; gap: 14px; }
.fs { border: 0; padding: 0; margin: 0; min-width: 0; display: grid; gap: 14px; }
.p-title { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.p-title b { font-size: 15px; }
.catline { font-size: 12.5px; color: var(--muted); background: var(--band); border-radius: 8px; padding: 8px 10px; }
.design-note { font-size: 13px; background: var(--accent-soft); border-radius: 8px; padding: 8px 10px; }
.design-note b { color: var(--accent); }
.field { display: grid; gap: 5px; min-width: 0; }
.lbl { font-size: 12px; color: var(--muted); font-weight: 500; }
.inp { width: 100%; min-width: 0; border: 1px solid var(--line-strong); border-radius: 7px; padding: 6px 10px; font-size: 13px; background: var(--surface); color: var(--fg); }
.inp:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.inp:disabled { background: var(--band); color: var(--muted); }
.inp.expr { font-family: var(--font-mono); font-size: 12.5px; color: var(--accent); }
.ro { border: 1px dashed var(--line-strong); border-radius: 7px; padding: 6px 10px; font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.auto { border: 1px dashed var(--data); border-radius: 7px; padding: 6px 10px; font-size: 13px; color: var(--data); }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.three { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.grp-box { border: 1px solid var(--line); border-radius: 10px; padding: 10px; display: grid; gap: 6px; background: var(--bg); }
.grp-h { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--muted); }
.or-sep { text-align: center; font-size: 12px; font-weight: 700; color: var(--accent); letter-spacing: 0.1em; }
.cond { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 0.8fr) minmax(0, 1.6fr) auto; gap: 6px; align-items: center; }
.cond .vals { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.cond .vals.one { grid-template-columns: minmax(0, 1fr); }
.kvrow { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.6fr) auto; gap: 6px; align-items: center; }
.frow { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr) minmax(0, 0.8fr) auto; gap: 6px; align-items: center; }
.chk-list { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; }
.chk { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; cursor: pointer; }
@media (max-width: 560px) {
  .two, .three { grid-template-columns: minmax(0, 1fr); }
  .cond { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto; }
  .cond .vals { grid-column: 1 / 3; }
  .frow { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto; }
}
details.peek { font-size: 13px; }
details.peek summary { cursor: pointer; color: var(--accent); }
.mini-wrap { overflow-x: auto; }
.mini { border-collapse: collapse; width: 100%; font-size: 12.5px; margin-top: 6px; }
.mini th, .mini td { text-align: left; padding: 5px 8px; border-top: 1px solid var(--line); white-space: nowrap; }
.mini th { color: var(--muted); font-weight: 500; border-top: 0; }
.mini td { font-family: var(--font-mono); font-size: 12px; }
.rules { border: 1px solid var(--fu); border-radius: 10px; overflow: hidden; }
.rules table { border-collapse: collapse; width: 100%; font-size: 13px; }
.rules th, .rules td { text-align: left; padding: 7px 12px; border-top: 1px solid var(--line); }
.rules th { background: var(--fu-soft); color: var(--fu); border-top: 0; font-weight: 600; font-size: 12px; }
.rules tr.hit td { background: var(--fu-soft); font-weight: 600; }
.try { border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: grid; gap: 10px; background: var(--bg); }
.try-h { font-weight: 600; font-size: 13.5px; }
.try-out { font-size: 13.5px; }
.try-out b { color: var(--fu); font-size: 15px; }
.p-foot { border-top: 1px solid var(--line); padding-top: 12px; display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: center; }
pre.out { margin: 0; font-family: var(--font-mono); font-size: 12px; line-height: 1.55; color: var(--fg); background: var(--band); border-radius: 8px; padding: 8px 10px; overflow: auto; max-height: 240px; }
.rl { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 8px; }
.rl.fail { border-color: var(--block); }
.rl-h { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.rl-h b { font-size: 13.5px; }
.rl-s { margin-left: auto; font-size: 12px; color: var(--muted); }
.rl-err { color: var(--block); font-size: 13px; font-weight: 500; }
.rl-sub { border-left: 2px solid var(--data); padding-left: 10px; display: grid; gap: 4px; font-size: 12.5px; }
.rl-sub div { display: flex; gap: 6px; align-items: center; }

/* ---------- process ---------- */
.bpmn-wrap { overflow-x: auto; padding: 22px 16px; }
.bpmn { display: flex; align-items: center; min-width: max-content; }
.bp-ev { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--line-strong); background: var(--surface); flex: none; }
.bp-ev.end { border-width: 4px; }
.bp-ar { width: 26px; height: 2px; background: var(--line-strong); flex: none; }
.bp-task { font-size: 13px; padding: 10px 12px; border: 1px solid var(--line-strong); border-radius: 9px; background: var(--surface); line-height: 1.3; text-align: center; flex: none; }
.bp-task small { display: block; color: var(--muted); font-size: 11px; margin-top: 2px; }
button.bp-task { cursor: pointer; border-color: var(--accent); }
button.bp-task:hover { box-shadow: 0 0 0 3px var(--accent-soft); }
button.bp-task.sel { box-shadow: 0 0 0 3px var(--accent); }
.proc { display: grid; gap: 16px; }
.proc-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 980px) { .proc-grid { grid-template-columns: minmax(0, 1fr); } }
.st-panel { padding: 16px 18px; display: grid; gap: 14px; }

/* ---------- admin ---------- */
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 12px; }
.chip { font-size: 13px; padding: 3px 12px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--surface); cursor: pointer; }
.chip span { color: var(--muted); margin-left: 4px; font-variant-numeric: tabular-nums; }
.chip.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.chip.on span { color: var(--bg); opacity: 0.75; }
.catdesc { display: flex; gap: 10px; align-items: flex-start; font-size: 13.5px; margin-bottom: 12px; }
.switch { width: 36px; height: 20px; border-radius: 999px; background: var(--line-strong); border: 0; position: relative; cursor: pointer; padding: 0; flex: none; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--surface); }
.switch[aria-checked="true"] { background: var(--data); }
.switch[aria-checked="true"]::after { left: 18px; }
.xdetail { display: grid; gap: 8px; padding: 4px 0; font-size: 13px; }
.xline { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.xlabel { color: var(--muted); min-width: 72px; }
.atag, .ttag { font-size: 12px; padding: 1px 8px; border-radius: 6px; }
.atag { background: var(--accent-soft); color: var(--accent); }
.ttag { background: var(--fu-soft); color: var(--fu); }
.xnew { border: 1px dashed var(--accent); border-radius: 10px; padding: 10px 12px; display: grid; gap: 6px; }

/* ---------- overlay ---------- */
.overlay { position: fixed; inset: 0; z-index: 50; }
.backdrop { position: absolute; inset: 0; background: var(--fg); opacity: 0.32; }
.modal {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: min(820px, calc(100% - 24px)); max-height: calc(100% - 48px); overflow: auto;
  background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); border: 1px solid var(--line);
  display: grid; grid-template-rows: auto minmax(0, 1fr);
}
.modal.narrow { width: min(560px, calc(100% - 24px)); }
.m-head { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.m-head h2 { margin: 0; font-size: 16px; flex: 1; }
.m-body { padding: 16px 18px 20px; display: grid; gap: 12px; min-height: 0; }
.m-foot { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
.picker { display: grid; grid-template-columns: 170px minmax(0, 1fr); min-height: 0; }
.pk-nav { border-right: 1px solid var(--line); padding: 10px; display: grid; gap: 2px; align-content: start; }
.pk-cat { display: flex; justify-content: space-between; gap: 6px; border: 0; background: transparent; padding: 7px 10px; border-radius: 8px; cursor: pointer; text-align: left; }
.pk-cat span { color: var(--muted); font-variant-numeric: tabular-nums; }
.pk-cat.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.pk-main { padding: 14px 16px 18px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.pk-list { display: grid; gap: 6px; }
.pk-item { display: flex; gap: 10px; align-items: center; text-align: left; width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 12px; cursor: pointer; }
.pk-item:hover { border-color: var(--accent); }
.pk-item .txt { flex: 1; min-width: 0; display: grid; }
.pk-item .ds { font-size: 12.5px; color: var(--muted); }
@media (max-width: 620px) {
  .picker { grid-template-columns: minmax(0, 1fr); }
  .pk-nav { display: flex; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); }
  .pk-cat { white-space: nowrap; }
}
.filepick { display: grid; gap: 8px; }
.filepick button { display: flex; gap: 10px; align-items: center; justify-content: space-between; text-align: left; border: 1px dashed var(--line-strong); background: var(--bg); border-radius: 10px; padding: 12px 14px; cursor: pointer; }
.filepick button:hover { border-color: var(--accent); border-style: solid; }
dl.kvl { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 14px; margin: 0; font-size: 13.5px; }
dl.kvl dt { color: var(--muted); }
dl.kvl dd { margin: 0; overflow-wrap: anywhere; }
.toast {
  position: fixed; z-index: 60; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 22px);
  background: var(--fg); color: var(--bg); padding: 9px 16px; border-radius: 10px; font-size: 13.5px; box-shadow: var(--shadow); max-width: calc(100% - 32px);
}
@media (prefers-reduced-motion: no-preference) {
  .step, .pk-item, .chip { transition: border-color 0.15s, box-shadow 0.15s; }
  .switch::after { transition: left 0.15s; }
}
</style>
