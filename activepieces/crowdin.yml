# HERMES-PATCH-014 —— 本 fork 从不与上游的 Crowdin 项目同步，两个入口（package.json 的
# pull-i18n / push-i18n）已改为 fail-loud 拒跑。配置文件保留只为 vendor diff 干净。
#
# 为什么不能跑：
#   · push（`crowdin upload sources`）会把**本仓库当前的**源串推进上游 Activepieces 的 Crowdin
#     项目。HERMES-PATCH-013 之后 `packages/pieces/**/**/src/i18n/translation.json` 只剩 29 个
#     匹配（裁剪前约 700），一次上传在上游项目里等同于"批量删除源串"。
#   · pull（`crowdin pull`）会把上游的最新译文灌进 Q8 冻结基线，静默改掉 vendored i18n。
#   · 两者都要 CROWDIN_PERSONAL_TOKEN，且目标是公网 SaaS —— 气隙部署下既不需要也不该发生。
#
# 自研件不受影响也不会外泄：`biz-calendar` / `hash-helper` 只有手写的 `src/i18n/zh.json`，
# 没有 `translation.json`，因此从来不在 source 匹配里（29 个 source 全部是上游件）。
project_id_env: CROWDIN_PROJECT_ID
api_token_env: CROWDIN_PERSONAL_TOKEN
base_path: .
base_url: 'https://api.crowdin.com'
preserve_hierarchy: 1
files:
  - type: i18next_json
    source: packages/web/public/locales/en/translation.json
    translation: /packages/web/public/locales/%two_letters_code%/translation.json
  - type: json
    source: packages/pieces/**/**/src/i18n/translation.json
    translation: /packages/pieces/**/**/src/i18n/%two_letters_code%.json
