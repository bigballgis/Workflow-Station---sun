<!-- Keep title and favicon in one line, so the github actions remove them correctly -->
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <base href="/" />
  <title><%= apTitle %></title>

  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- HERMES-PATCH-010: 同源图标，上游指向 /logo*.svg|png（气隙下 favicon 请求本身无害，
       但与 theme.ts 的白标必须一致，否则浏览器标签与应用内 logo 对不上） -->
  <link rel="icon" type="image/svg+xml" href="/hermes-mark.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="/hermes-mark-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/hermes-mark-180.png">
  <link rel="icon" type="image/x-icon" href="<%= apFavicon %>">
  <link rel="stylesheet" href="/src/styles.css" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
